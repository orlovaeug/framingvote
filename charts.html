<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart</title>
  <!-- Load Chart.js once here, upfront, before anything else -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F0EDE6;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    #error {
      display: none;
      padding: 24px;
      font-size: 12px;
      color: #c94040;
    }
  </style>
</head>
<body>
  <div id="chart-container"></div>
  <div id="error"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if (!id) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error').textContent = 'No chart id specified.';
    } else {
      fetch(`charts/${id}.html`)
        .then(res => {
          if (!res.ok) throw new Error(`Chart "${id}" not found.`);
          return res.text();
        })
        .then(html => {
          const container = document.getElementById('chart-container');

          // Strip out any <script src="...chart.js..."> tags since we already loaded it above
          const cleaned = html.replace(/<script[^>]+cdnjs\.cloudflare\.com[^>]*><\/script>/gi, '');
          container.innerHTML = cleaned;

          // Re-run inline scripts only (external Chart.js already loaded)
          container.querySelectorAll('script').forEach(old => {
            if (!old.src) {
              const s = document.createElement('script');
              s.textContent = old.textContent;
              document.body.appendChild(s);
            }
          });
        })
        .catch(err => {
          document.getElementById('error').style.display = 'block';
          document.getElementById('error').textContent = err.message;
        });
    }
  </script>

</body>
</html>
