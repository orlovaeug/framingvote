<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Framing Vote — A journal on elections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #F5F2EA;
      --bg-warm: #EDE9DE;
      --bg-deep: #E3DED1;
      --ink: #0F0E0B;
      --ink-2: #2A2924;
      --ink-3: #6B6860;
      --ink-4: #ABA89F;
      --rule: #C8C3B6;
      --accent: #C1440E;
      --accent-pale: #F5E8E2;
      --night: #0F0E0B;
      --night-2: #1E1D19;
      --ff-display: 'Playfair Display', Georgia, serif;
      --ff-sans: 'DM Sans', system-ui, sans-serif;
      --ff-mono: 'DM Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ff-sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
    img { max-width: 100%; display: block; }
    ::selection { background: var(--accent); color: #fff; }

    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 48px; }
    .read { width: 100%; max-width: 700px; margin: 0 auto; padding: 0 40px; }

    /* ── TYPOGRAPHY ── */
    .label {
      font-family: var(--ff-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .label-accent { color: var(--accent); }

    .display {
      font-family: var(--ff-display);
      font-weight: 400;
      letter-spacing: -0.025em;
      line-height: 0.94;
      color: var(--ink);
    }
    .display em { font-style: italic; }
    .display strong { font-weight: 900; }

    /* ── RULES ── */
    hr { border: 0; border-top: 1px solid var(--rule); }

    /* ── READING PROGRESS ── */
    #progress {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent); transform-origin: 0 50%;
      transform: scaleX(0); z-index: 200; transition: transform 80ms linear;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid transparent;
      transition: border-color 200ms, background 200ms;
      background: rgba(245,242,234,0);
      backdrop-filter: blur(0);
    }
    header.scrolled {
      background: rgba(245,242,234,0.94);
      border-bottom-color: var(--rule);
      backdrop-filter: saturate(160%) blur(16px);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
    }
    .wordmark {
      font-family: var(--ff-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      display: flex; align-items: center; gap: 10px;
    }
    .wordmark-mark {
      width: 26px; height: 26px; background: var(--accent); border-radius: 4px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .wordmark-mark svg { display: block; }
    nav { display: flex; align-items: center; gap: 2px; }
    .nav-btn {
      padding: 7px 13px;
      font-family: var(--ff-sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-3);
      border-radius: 6px;
      transition: color 140ms, background 140ms;
    }
    .nav-btn:hover { color: var(--ink); background: rgba(15,14,11,0.05); }
    .nav-btn.active { color: var(--ink); font-weight: 500; }
    .btn-cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px;
      font-family: var(--ff-sans);
      font-size: 13px; font-weight: 500;
      background: var(--ink); color: var(--bg);
      border-radius: 6px;
      transition: background 160ms var(--ease), transform 140ms;
    }
    .btn-cta:hover { background: var(--accent); }
    .btn-cta:active { transform: translateY(1px); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 12px 22px;
      font-family: var(--ff-sans); font-size: 13.5px; font-weight: 500;
      background: var(--ink); color: var(--bg); border-radius: 6px;
      transition: background 160ms var(--ease), transform 120ms;
    }
    .btn:hover { background: var(--accent); }
    .btn:active { transform: translateY(1px); }
    .btn-outline {
      background: transparent; color: var(--ink);
      border: 1px solid var(--ink);
    }
    .btn-outline:hover { background: var(--ink); color: var(--bg); }
    .btn-outline-ghost {
      background: transparent; color: var(--ink-3);
      border: 1px solid var(--rule);
    }
    .btn-outline-ghost:hover { border-color: var(--ink); color: var(--ink); background: transparent; }

    .mono-arrow { font-family: var(--ff-mono); font-size: 13px; }

    /* ── HERO ── */
    .hero {
      padding: 0 0 88px;
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
    }
    .hero-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; border-bottom: 1px solid var(--rule);
      flex-wrap: wrap; gap: 16px;
    }
    .hero-bar-left { display: flex; align-items: center; gap: 16px; }
    .issue-num {
      font-family: var(--ff-mono); font-size: 11px;
      letter-spacing: 0.1em; color: var(--ink-3);
    }
    .dot-sep {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--ink-4); flex-shrink: 0;
    }
    .issue-theme {
      font-family: var(--ff-display); font-style: italic;
      font-size: 16px; color: var(--ink-2);
    }
    .live-badge {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3);
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .hero-head {
      padding: 80px 0 64px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }
    .hero-h1 {
      font-family: var(--ff-display);
      font-size: clamp(64px, 11vw, 168px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 0.91;
      color: var(--ink);
    }
    .hero-h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
    .hero-sub {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 40px; align-items: flex-end;
    }
    .hero-tagline {
      font-family: var(--ff-display);
      font-style: italic; font-size: 22px; line-height: 1.4;
      color: var(--ink-2); max-width: 540px;
    }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ── FEATURED CARD ── */
    .featured-section {
      padding: 72px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
    }
    .featured-label {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 20px; border-bottom: 1px solid var(--rule); margin-bottom: 40px;
    }
    .featured-grid {
      display: grid;
      grid-template-columns: minmax(0,1.6fr) minmax(0,1fr);
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
      border-radius: 4px;
      overflow: hidden;
    }
    .feat-card {
      background: var(--bg);
      padding: 40px;
      cursor: pointer;
      transition: background 200ms;
    }
    .feat-card:hover { background: var(--bg-warm); }
    .feat-card-kicker {
      font-family: var(--ff-mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 14px;
    }
    .feat-card-title {
      font-family: var(--ff-display); font-weight: 700;
      font-size: clamp(26px,3vw,44px); line-height: 1.05;
      letter-spacing: -0.02em; color: var(--ink); margin-bottom: 16px;
    }
    .feat-card-title em { font-style: italic; font-weight: 400; }
    .feat-card-sub {
      font-family: var(--ff-display); font-style: italic;
      font-size: 17px; line-height: 1.5; color: var(--ink-3);
      margin-bottom: 28px;
    }
    .feat-card-meta {
      font-family: var(--ff-mono); font-size: 11px;
      color: var(--ink-4); display: flex; align-items: center; gap: 12px;
    }
    .secondary-cards {
      display: flex; flex-direction: column; gap: 1px;
    }
    .sec-card {
      background: var(--bg); padding: 28px 32px;
      cursor: pointer; transition: background 200ms;
      display: flex; flex-direction: column; gap: 8px; flex: 1;
    }
    .sec-card:hover { background: var(--bg-warm); }
    .sec-card-kicker {
      font-family: var(--ff-mono); font-size: 9.5px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4);
    }
    .sec-card-title {
      font-family: var(--ff-display); font-size: 20px; font-weight: 700;
      letter-spacing: -0.015em; line-height: 1.1; color: var(--ink);
    }
    .sec-card-meta {
      font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-4);
    }

    /* ── MANIFESTO ── */
    .manifesto {
      padding: 112px 0;
      background: var(--bg-warm);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .manifesto-grid {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.5fr);
      gap: 80px; align-items: flex-start;
    }
    .manifesto-sticky {
      position: sticky; top: 120px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .manifesto-head {
      font-family: var(--ff-display); font-size: clamp(48px,6vw,88px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.92; color: var(--ink);
    }
    .manifesto-head em { font-style: italic; font-weight: 400; color: var(--accent); }
    .principles { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .principle {
      padding: 24px 0; border-top: 1px solid var(--rule);
    }
    .principle:nth-child(odd) { padding-right: 32px; }
    .principle:nth-child(even) { padding-left: 32px; border-left: 1px solid var(--rule); }
    .principle-head {
      font-family: var(--ff-display); font-size: 22px; font-weight: 700;
      letter-spacing: -0.01em; color: var(--ink); margin-bottom: 8px;
    }
    .principle-body {
      font-family: var(--ff-sans); font-size: 14.5px; line-height: 1.6;
      color: var(--ink-3);
    }

    /* ── ARCHIVE TABLE ── */
    .archive-section {
      padding: 80px 0 100px;
      background: var(--bg);
    }
    .archive-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding-bottom: 20px; border-bottom: 1px solid var(--rule); margin-bottom: 0;
      flex-wrap: wrap; gap: 24px;
    }
    .archive-title {
      font-family: var(--ff-display); font-size: clamp(36px,4.5vw,64px);
      font-weight: 900; letter-spacing: -0.025em; line-height: 1; color: var(--ink);
    }
    .archive-title em { font-style: italic; font-weight: 400; color: var(--accent); }
    .table-header {
      display: grid;
      grid-template-columns: 52px minmax(0,1fr) 160px 120px 24px;
      gap: 24px; padding: 14px 16px;
      font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-4);
    }
    .table-row {
      display: grid;
      grid-template-columns: 52px minmax(0,1fr) 160px 120px 24px;
      gap: 24px; padding: 22px 16px;
      border-top: 1px solid var(--rule);
      cursor: pointer; transition: background 180ms;
      text-align: left; width: 100%;
    }
    .table-row:hover { background: var(--bg-warm); }
    .table-row:hover .row-arrow { transform: translateX(4px); color: var(--accent); }
    .row-num {
      font-family: var(--ff-display); font-style: italic; font-size: 28px;
      line-height: 1; color: var(--ink); align-self: center;
    }
    .row-title-block { min-width: 0; align-self: center; }
    .row-kicker {
      font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 5px;
    }
    .row-title {
      font-family: var(--ff-display); font-size: 21px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.1; color: var(--ink);
    }
    .row-sub {
      font-family: var(--ff-sans); font-style: italic; font-size: 13px;
      color: var(--ink-4); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-author {
      font-family: var(--ff-sans); font-size: 13px; color: var(--ink-2);
      align-self: center;
    }
    .row-date {
      font-family: var(--ff-mono); font-size: 11px; color: var(--ink-4);
      align-self: center;
    }
    .row-arrow {
      font-family: var(--ff-mono); font-size: 13px; color: var(--ink-4);
      align-self: center; transition: transform 200ms, color 200ms;
    }

    /* ── PITCH CTA ── */
    .pitch-section {
      background: var(--night);
      padding: 96px 0;
      position: relative;
      overflow: hidden;
    }
    .pitch-section::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 100% at 100% 0%, rgba(193,68,14,0.12), transparent 55%);
      pointer-events: none;
    }
    .pitch-inner {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 80px; align-items: center;
    }
    .pitch-head {
      font-family: var(--ff-display);
      font-size: clamp(44px,5.5vw,80px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.92;
      color: #F5F2EA;
    }
    .pitch-head em { font-style: italic; font-weight: 400; color: #E8866A; }
    .pitch-right { display: flex; flex-direction: column; gap: 32px; }
    .pitch-label {
      font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(245,242,234,0.4);
    }
    .pitch-body {
      font-family: var(--ff-display); font-style: italic;
      font-size: 20px; line-height: 1.45; color: rgba(245,242,234,0.75);
    }
    .pitch-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .pitch-spec {
      padding: 20px 0; border-top: 1px solid rgba(245,242,234,0.1);
    }
    .pitch-spec:nth-child(odd) { padding-right: 24px; }
    .pitch-spec:nth-child(even) { padding-left: 24px; border-left: 1px solid rgba(245,242,234,0.1); }
    .pitch-spec-head {
      font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(245,242,234,0.4); margin-bottom: 4px;
    }
    .pitch-spec-val {
      font-family: var(--ff-sans); font-size: 14px; color: rgba(245,242,234,0.85);
    }
    .btn-light {
      background: #F5F2EA; color: var(--night);
      display: inline-flex; align-items: center; gap: 9px;
      padding: 12px 22px; font-family: var(--ff-sans);
      font-size: 13.5px; font-weight: 500; border-radius: 6px;
      transition: background 160ms, color 160ms;
    }
    .btn-light:hover { background: var(--accent); color: #fff; }

    /* ── NEWSLETTER ── */
    .newsletter {
      padding: 88px 0; background: var(--bg-deep);
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    }
    .nl-inner {
      display: grid;
      grid-template-columns: minmax(0,1.2fr) minmax(0,1fr);
      gap: 64px; align-items: center;
    }
    .nl-head {
      font-family: var(--ff-display);
      font-size: clamp(36px,4.5vw,64px);
      font-weight: 900; letter-spacing: -0.025em; line-height: 0.92; color: var(--ink);
    }
    .nl-head em { font-style: italic; font-weight: 400; }
    .nl-sub {
      font-family: var(--ff-display); font-style: italic;
      font-size: 18px; line-height: 1.45; color: var(--ink-3);
      margin-top: 18px;
    }
    .nl-form { display: flex; flex-direction: column; gap: 12px; }
    .nl-input {
      width: 100%; padding: 14px 18px;
      border: 1px solid var(--rule); background: var(--bg);
      font-family: var(--ff-sans); font-size: 15px; color: var(--ink);
      border-radius: 6px; outline: none;
      transition: border-color 140ms;
    }
    .nl-input::placeholder { color: var(--ink-4); font-style: italic; }
    .nl-input:focus { border-color: var(--ink); }
    .nl-note {
      font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-4);
    }
    .nl-success {
      padding: 28px; border: 1px solid var(--rule); border-radius: 6px;
      background: var(--bg);
    }
    .nl-success-head {
      font-family: var(--ff-display); font-style: italic; font-size: 32px;
      color: var(--accent); margin-bottom: 6px;
    }
    .nl-success-body {
      font-family: var(--ff-sans); font-size: 14px; color: var(--ink-3);
    }

    /* ── ARTICLE VIEW ── */
    .article-wrap { animation: fadein 220ms var(--ease) both; }
    @keyframes fadein { from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;} }
    .article-header { padding: 40px 0 32px; }
    .article-title {
      font-family: var(--ff-display);
      font-size: clamp(38px,5.5vw,76px);
      font-weight: 900; letter-spacing: -0.025em; line-height: 0.94;
      color: var(--ink); margin: 14px 0 0;
    }
    .article-sub {
      font-family: var(--ff-display); font-style: italic;
      font-size: 22px; line-height: 1.4; color: var(--ink-3); margin: 16px 0 0;
    }
    .article-byline {
      display: flex; align-items: center; gap: 14px;
      margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule);
    }
    .byline-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--night); color: var(--bg);
      display: grid; place-items: center;
      font-family: var(--ff-display); font-style: italic; font-size: 18px;
      flex-shrink: 0;
    }
    .byline-name {
      font-family: var(--ff-sans); font-size: 13.5px; font-weight: 500; color: var(--ink);
    }
    .byline-detail {
      font-family: var(--ff-sans); font-size: 12px; color: var(--ink-4);
    }
    .cover-placeholder {
      width: 100%; aspect-ratio: 16/7; background: var(--bg-deep);
      border-radius: 4px; overflow: hidden; position: relative;
      margin: 32px 0 56px;
    }
    .cover-glyph {
      position: absolute; bottom: 20px; left: 32px;
      font-family: var(--ff-display); font-size: 140px; line-height: 0.8;
      color: var(--ink); opacity: 0.08; font-style: italic;
    }
    .cover-label {
      position: absolute; bottom: 20px; right: 24px;
      font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-4);
    }
    .post-body h2 {
      font-family: var(--ff-display); font-weight: 700; font-size: 34px;
      letter-spacing: -0.02em; line-height: 1.1; color: var(--ink);
      margin: 52px 0 16px;
    }
    .post-body h3 {
      font-family: var(--ff-display); font-weight: 700; font-size: 24px;
      letter-spacing: -0.01em; line-height: 1.2; color: var(--ink);
      margin: 36px 0 12px;
    }
    .post-body p {
      font-family: var(--ff-sans); font-size: 19px; line-height: 1.68;
      color: var(--ink); margin: 0 0 22px; font-weight: 300;
    }
    .post-body blockquote {
      margin: 36px 0; padding: 0 0 0 28px;
      border-left: 2.5px solid var(--accent);
    }
    .post-body blockquote p {
      font-family: var(--ff-display); font-style: italic;
      font-size: 28px; line-height: 1.3; color: var(--ink); margin: 0;
    }
    .post-body ul, .post-body ol {
      font-family: var(--ff-sans); font-size: 18px; line-height: 1.65;
      color: var(--ink); padding-left: 22px; margin: 0 0 22px; font-weight: 300;
    }
    .post-body hr { margin: 48px 0; }
    .dropcap::first-letter {
      font-family: var(--ff-display); font-weight: 900; float: left;
      font-size: 5.2em; line-height: 0.82; margin: 0.04em 0.1em -0.05em 0;
      color: var(--accent);
    }

    /* ── SUBMIT / ABOUT ── */
    .page-hero { padding: 56px 0 80px; }
    .page-h1 {
      font-family: var(--ff-display); font-size: clamp(44px,6vw,96px);

      font-size: 22px; line-height: 1.4; color: var(--ink-3); margin-top: 20px;
    }
    .info-box {
      padding: 32px; background: var(--bg-warm);
      border: 1px solid var(--rule); border-radius: 6px; margin-top: 32px;

    /* ── FOOTER ── */

      color: var(--ink);
    }
    .footer-inner {
      padding: 64px 0 28px;
    }
    .footer-grid {
      display: grid;

    .footer-tagline {

    .footer-col-head {

    .footer-link {

    .footer-link:hover { color: var(--accent); }
    .footer-bottom {
      display: flex; align-items: center; justify-content: space-between;

    /* ── DISPATCHES / NEWS ── */
    .dispatch-section {
      padding: 80px 0;
      background: var(--night); color: #F5F2EA;
      border-top: 1px solid var(--rule);
    }
    .dispatch-inner {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 64px;
    }

    .dispatch-num {
      font-family: var(--ff-mono); font-size: 11px; letter-spacing: 0.1em;
      color: rgba(245,242,234,0.4);
    }
    .dispatch-label {
      font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: #E8866A;
    }
    .dispatch-featured-head {
      font-family: var(--ff-display); font-size: clamp(28px,3vw,44px);
      font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; color: #F5F2EA;
    }
    .dispatch-featured-body {
      font-family: var(--ff-sans); font-size: 15px; line-height: 1.6;
      color: rgba(245,242,234,0.65);
    }
    .dispatch-list { display: flex; flex-direction: column; gap: 1px; }
    .dispatch-item {
      display: grid; grid-template-columns: 40px 1fr auto;
      gap: 16px; align-items: center; padding: 18px 16px;
      text-align: left; width: 100%;
      transition: background 200ms; border-radius: 6px; cursor: pointer;
    }
    .dispatch-item:hover { background: rgba(245,242,234,0.05); }
    .dispatch-item.active { background: rgba(245,242,234,0.06); }
    .d-num {
      font-family: var(--ff-mono); font-size: 10.5px; color: rgba(245,242,234,0.4);
    }
    .d-num-active { color: #E8866A; }
    .d-title {
      font-family: var(--ff-display); font-size: 19px; line-height: 1.1;
      color: #F5F2EA;
    }
    .d-date { font-family: var(--ff-mono); font-size: 10.5px; color: rgba(245,242,234,0.35); }

    /* ── BACK BTN ── */
    .back-btn {
      font-family: var(--ff-sans); font-size: 13px; color: var(--ink-3);
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 0;
      transition: color 140ms;
    }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; font-family: var(--ff-mono);
      font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-pale); border-radius: 999px;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      padding: 96px 0;
      text-align: center;
    }
    .empty-glyph {
      font-family: var(--ff-display); font-style: italic; font-size: 120px;
      color: var(--ink); opacity: 0.06; line-height: 1; margin-bottom: 24px;
    }
    .empty-msg {
      font-family: var(--ff-display); font-style: italic; font-size: 24px;
      color: var(--ink-3);
    }

    /* ── RESPONSIVE ── */
    @media(max-width:960px){
      .header-inner,.wrap,.footer-grid,.featured-grid,.pitch-inner,.nl-inner,.dispatch-inner,.manifesto-grid{
        grid-template-columns:1fr;
      }
      .hero-sub{grid-template-columns:1fr;}
      .pitch-section::before{display:none;}
      .hero-h1{font-size:clamp(52px,14vw,96px);}
      .featured-grid{gap:1px;}
      .secondary-cards{flex-direction:row;}
      .sec-card{min-width:0;}
      .footer-grid{grid-template-columns:1fr 1fr;}
      .wrap{padding:0 24px;}
      .header-inner{padding:16px 24px;}
      .table-header,.table-row{
        grid-template-columns:40px minmax(0,1fr) 100px 24px;
      }
      .table-header div:nth-child(3),.table-row .row-author{display:none;}
    }
    @media(max-width:640px){
      .table-header,.table-row{grid-template-columns:36px minmax(0,1fr) 24px;}
      .table-header div:nth-child(4),.table-row .row-date{display:none;}
      .principles,.pitch-specs{grid-template-columns:1fr;}
      .principle:nth-child(even){padding-left:0;border-left:0;}
      .footer-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)">
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <div style="width:36px;height:36px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 28 28"><path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-0.025em;color:var(--ink)">Framing Vote</span>
      <span style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-4)">Loading</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const SPACE='upaglixkbf42',TOKEN='H3fmoxO4StTBS-lRp_ULYaywbv3uM3C6WTG8o1M_PbU';
const BASE=`https://cdn.contentful.com/spaces/${SPACE}/environments/master`;
async function cfFetch(path){const r=await fetch(`${BASE}${path}&access_token=${TOKEN}`);if(!r.ok)throw new Error(r.status);return r.json();}
async function getEntries(ct,extra=''){return cfFetch(`/entries?content_type=${ct}${extra}`);}

function rt(doc){
  if(!doc||!doc.content)return'';
  const n=node=>{
    if(node.nodeType==='text'){let t=node.value;(node.marks||[]).forEach(m=>{if(m.type==='bold')t=`<strong>${t}</strong>`;if(m.type==='italic')t=`<em>${t}</em>`;if(m.type==='code')t=`<code>${t}</code>`;});return t;}
    const i=(node.content||[]).map(n).join('');
    switch(node.nodeType){
      case'paragraph':return`<p>${i}</p>`;case'heading-1':return`<h1>${i}</h1>`;case'heading-2':return`<h2>${i}</h2>`;
      case'heading-3':return`<h3>${i}</h3>`;case'unordered-list':return`<ul>${i}</ul>`;case'ordered-list':return`<ol>${i}</ol>`;
      case'list-item':return`<li>${i}</li>`;case'blockquote':return`<blockquote>${i}</blockquote>`;case'hr':return`<hr/>`;
      case'hyperlink':return`<a href="${node.data?.uri}" target="_blank" rel="noopener">${i}</a>`;default:return i;
    }
  };
  return doc.content.map(n).join('');
}
function fmtDate(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});}
function fmtDateLong(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});}

function Mark({size=28}){
  return(
    <span style={{display:'inline-block',width:size,height:size,background:'var(--accent)',borderRadius:Math.round(size*0.15),flexShrink:0}}>
      <svg width={size} height={size} viewBox="0 0 28 28">
        <path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </span>
  );
}

function ReadingProgress(){
  const[p,setP]=useState(0);
  useEffect(()=>{const f=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;setP(m>0?Math.min(1,h.scrollTop/m):0);};window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  return<div id="progress" style={{transform:`scaleX(${p})`}}/>;
}

function Header({route,setRoute}){
  const links=[['home','Front'],['archive','Archive'],['news','Dispatches'],['about','About'],['submit','Pitch us']];
  const[scrolled,setScrolled]=useState(false);
  useEffect(()=>{const f=()=>setScrolled(window.scrollY>8);window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  return(
    <header className={scrolled?'scrolled':''}>
      <div className="header-inner">
        <button onClick={()=>setRoute('home')} className="wordmark">
          <span className="wordmark-mark">
            <svg width="14" height="14" viewBox="0 0 28 28"><path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" strokeWidth="2.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </span>
          Framing Vote
        </button>
        <nav>
          {links.map(([k,label])=>(
            <button key={k} onClick={()=>setRoute(k)} className={`nav-btn${route===k?' active':''}`}>{label}</button>
          ))}
        </nav>
        <button className="btn-cta" onClick={()=>document.getElementById('fv-nl')?.scrollIntoView({behavior:'smooth'})}>
          Subscribe <span className="mono-arrow">→</span>
        </button>
      </div>
    </header>
  );
}

function Hero({featured,settings,about,setRoute,setCurrentArticle,articles,news}){
  const num=settings?.issueNumber||'01';
  const theme=settings?.issueTheme||'The Argument';
  const season=settings?.issueSeason||'';
  const tagline=settings?.tagline||'A journal on how the vote is asked, counted, and contested.';
  const verbs=['frame','count','read','question','contest'];
  const[vIdx,setVIdx]=useState(0);
  const[prev,setPrev]=useState(0);
  useEffect(()=>{
    const t=setInterval(()=>{setPrev(v=>v);setVIdx(i=>(i+1)%verbs.length);},2400);
    return()=>clearInterval(t);
  },[]);

  return(
    <section className="hero">
      <div className="wrap">
        <div className="hero-bar">
          <div className="hero-bar-left">
            <span className="issue-num">Issue №{String(num).padStart(2,'0')}</span>
            <span className="dot-sep"/>
            <span className="issue-theme">{theme}</span>
            {season&&<span className="issue-num">{season}</span>}
          </div>
          <div className="live-badge">
            <span className="live-dot"/>
            {featured?`Filed ${fmtDate(featured.publishDate)||'live'}`:'In preparation'}
          </div>
        </div>

        <div className="hero-head">
          <h1 className="hero-h1">
            We <em>{verbs[vIdx]}</em><br/>elections.
          </h1>
          <div className="hero-sub">
            <p className="hero-tagline">{tagline}</p>
            <div className="hero-actions">
              <button className="btn" onClick={()=>document.getElementById('fv-nl')?.scrollIntoView({behavior:'smooth'})}>
                Get the dispatch <span className="mono-arrow">→</span>
              </button>
              <button className="btn btn-outline-ghost" onClick={()=>setRoute('submit')}>
                Pitch us
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function FeaturedGrid({articles,about,setRoute,setCurrentArticle}){
  if(!articles||articles.length===0)return null;
  const[main,...rest]=articles;
  const secondaries=rest.slice(0,2);
  return(
    <section className="featured-section">
      <div className="wrap">
        <div className="featured-label">
          <span className="label label-accent">Latest essays</span>
          <button onClick={()=>setRoute('archive')} style={{fontFamily:'var(--ff-mono)',fontSize:11,color:'var(--ink-3)',display:'inline-flex',alignItems:'center',gap:7}} onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.color='var(--ink-3)'}>
            Full archive <span className="mono-arrow">→</span>
          </button>
        </div>
        <div className="featured-grid">
          <div className="feat-card" onClick={()=>{setCurrentArticle(main);setRoute('article');}}>
            {main.kicker&&<div className="feat-card-kicker">{main.kicker}</div>}
            <div className="feat-card-title">{main.title}</div>
            {main.subtitle&&<div className="feat-card-sub">{main.subtitle}</div>}
            <div className="feat-card-meta">
              <span>{main.author||about?.editorName}</span>
              <span className="dot-sep"/>
              <span>{main.publishDate?fmtDate(main.publishDate):'—'}</span>
              <span style={{marginLeft:'auto',fontFamily:'var(--ff-mono)',fontSize:11,color:'var(--accent)'}}>Read →</span>
            </div>
          </div>
          {secondaries.length>0&&(
            <div className="secondary-cards">
              {secondaries.map(a=>(
                <div key={a.id} className="sec-card" onClick={()=>{setCurrentArticle(a);setRoute('article');}}>
                  {a.kicker&&<div className="sec-card-kicker">{a.kicker}</div>}
                  <div className="sec-card-title">{a.title}</div>
                  <div className="sec-card-meta">{a.author||about?.editorName} · {a.publishDate?fmtDate(a.publishDate):'—'}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function Dispatches({news,setRoute,setCurrentNews}){
  const[active,setActive]=useState(0);
  if(!news||news.length===0)return null;
  const items=news.slice(0,5);
  const d=items[active]||{};
  return(
    <section className="dispatch-section">
      <div className="wrap">
        <div className="dispatch-inner">
          <div className="dispatch-sidebar">
            <div>
              <div className="dispatch-label">Field dispatches</div>
              <div style={{fontFamily:'var(--ff-mono)',fontSize:10,color:'rgba(245,242,234,0.3)',marginTop:6}}>{news.length} notes on file</div>
            </div>
            <div>
              <div className="dispatch-featured-head">{d.title}</div>
              {d.summary&&<p className="dispatch-featured-body" style={{marginTop:14}}>{d.summary}</p>}
              <div style={{display:'flex',alignItems:'center',gap:20,marginTop:32}}>
                <button className="btn-light" onClick={()=>{setCurrentNews(d);setRoute('newsArticle');}}>
                  Read note <span className="mono-arrow">→</span>
                </button>
                <span style={{fontFamily:'var(--ff-mono)',fontSize:11,color:'rgba(245,242,234,0.4)'}}>
                  {d.publishDate?fmtDateLong(d.publishDate):''}
                </span>
              </div>
            </div>
          </div>
          <div>
            <div className="dispatch-list">
              {items.map((it,i)=>(
                <button key={it.id} onClick={()=>setActive(i)} className={`dispatch-item${i===active?' active':''}`}>
                  <span className={`d-num${i===active?' d-num-active':''}`}>№{String(i+1).padStart(2,'0')}</span>
                  <span style={{display:'flex',flexDirection:'column',gap:3,minWidth:0}}>
                    <span style={{fontFamily:'var(--ff-mono)',fontSize:9.5,letterSpacing:'0.12em',textTransform:'uppercase',color:i===active?'#E8866A':'rgba(245,242,234,0.45)'}}>{it.category||'Note'}</span>
                    <span className="d-title" style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.title}</span>
                  </span>
                  <span className="d-date">{it.publishDate?fmtDate(it.publishDate):''}</span>
                </button>
              ))}
            </div>
            <div style={{display:'flex',justifyContent:'flex-end',marginTop:24,paddingTop:16,borderTop:'1px solid rgba(245,242,234,0.1)'}}>
              <button onClick={()=>setRoute('news')} style={{fontFamily:'var(--ff-mono)',fontSize:11,color:'#E8866A',display:'inline-flex',alignItems:'center',gap:7}}>
                All dispatches <span className="mono-arrow">→</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Manifesto(){
  return(
    <section className="manifesto">
      <div className="wrap">
        <div className="manifesto-grid">
          <div className="manifesto-sticky">
            <Mark size={44}/>
            <div className="label label-accent" style={{marginTop:24}}>The position</div>
            <p style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:17,lineHeight:1.55,color:'var(--ink-3)',maxWidth:300}}>

            <h2 className="manifesto-head">

                ["No models.","We don't run forecasts. We don't aggregate polls. We don't tell you what will happen."],

function Register({articles,about,setRoute,setCurrentArticle}){

    <section className="archive-section">

        <div className="archive-head">

            <div className="label label-accent">The register</div>

            Full archive →
          </button>
        </div>
      </div>

function PitchCTA({about,setRoute}){
  return(
    <section className="pitch-section">
      <div className="wrap">
        <div className="pitch-inner">
          <div>
            <div className="label" style={{color:'rgba(245,242,234,0.4)',marginBottom:28}}>Work with us</div>
            <h2 className="pitch-head">
              We read every pitch.<br/><em>We reply to all.</em>
            </h2>
          </div>
          <div className="pitch-right">
            <div>
              <div className="pitch-label">What we publish</div>
              <p className="pitch-body" style={{marginTop:10}}>
                Long-form essays, field reports, data analyses, and editorial arguments on elections and democratic institutions.
              </p>
            </div>
            <div className="pitch-specs">
              {[
                ['Length','2,500–6,000 words'],
                ['Tone','First-person. Argument required.'],
                ['Sources','Primary documents preferred.'],
                ['Rights','First pub. You retain ownership.'],
              ].map(([h,b])=>(
                <div key={h} className="pitch-spec">
                  <div className="pitch-spec-head">{h}</div>
                  <div className="pitch-spec-val">{b}</div>
                </div>
              ))}
            </div>
            <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
              <button className="btn-light" onClick={()=>setRoute('submit')}>
                See pitch guidelines <span className="mono-arrow">→</span>

function App(){
  const[route,setRoute]=useState('home');
  const[articles,setArticles]=useState([]);
  const[news,setNews]=useState([]);
  const[settings,setSettings]=useState(null);
  const[about,setAbout]=useState(null);
  const[currentArticle,setCurrentArticle]=useState(null);
  const[currentNews,setCurrentNews]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{window.scrollTo(0,0);},[route]);

  useEffect(()=>{
    async function load(){
      try{
        const[aR,sR,abR,nR]=await Promise.all([
          getEntries('articlePost','&order=-fields.publishDate'),
          getEntries('settings'),
          getEntries('about'),
          getEntries('news','&order=-fields.publishDate'),
        ]);
        setArticles((aR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        setNews((nR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        if(sR.items?.length)setSettings(sR.items[0].fields);
        if(abR.items?.length)setAbout(abR.items[0].fields);
      }catch(e){console.error('Contentful error:',e);}
      finally{setLoading(false);}
    }
    load();
  },[]);

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--bg)'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
        <Mark size={36}/>
        <span style={{fontFamily:'Playfair Display,serif',fontSize:22,fontWeight:700,letterSpacing:'-0.025em',color:'var(--ink)'}}>Framing Vote</span>
        <span style={{fontFamily:'DM Mono,monospace',fontSize:10,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--ink-4)'}}>Loading</span>
      </div>
    </div>
  );

  const props={articles,news,settings,about,setRoute,setCurrentArticle,setCurrentNews};

  return(
    <div className="page">
      <Header route={route} setRoute={setRoute}/>
      <main style={{flex:1}}>
        {route==='home'        &&<HomeView {...props}/>}
        {route==='article'     &&<ArticleView article={currentArticle} {...props}/>}
        {route==='archive'     &&<ArchiveView {...props}/>}
        {route==='news'        &&<NewsView {...props}/>}
        {route==='newsArticle' &&<NewsArticleView item={currentNews} about={about} setRoute={setRoute}/>}
        {route==='about'       &&<AboutView about={about}/>}
        {route==='submit'      &&<SubmitView about={about} setRoute={setRoute}/>}
      </main>
      <Newsletter/>
      <Footer setRoute={setRoute} settings={settings} about={about}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
