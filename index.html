<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Framing Vote — Quarterly Journal of Elections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400;1,6..96,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper:#F6F2EA;--paper-deep:#EAE3D5;--paper-soft:#FEFDF8;--paper-edge:#D9CFB8;
      --ink:#1B1A17;--ink-2:#3C3A33;--ink-3:#6B6759;--ink-4:#9A9382;
      --accent:#7A1F1F;--accent-deep:#5A1414;--accent-soft:#B85B5B;
      --ink-bg:#1B1A17;--ink-bg-2:#2A2823;
      --font-display:"Fraunces","Times New Roman",serif;
      --font-serif:"Bodoni Moda","Georgia",serif;
      --font-sans:"Inter Tight",-apple-system,sans-serif;
      --font-mono:"JetBrains Mono",monospace;
      --ease-standard:cubic-bezier(0.2,0.6,0.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;}
    html,body,#root{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;}
    a{color:var(--accent);text-decoration:underline;text-underline-offset:0.18em;text-decoration-thickness:1px;transition:color 140ms;}
    a:hover{color:var(--accent-deep);}
    button{font-family:inherit;cursor:pointer;}
    ::selection{background:rgba(122,31,31,0.18);color:var(--ink);}
    .fv-page{min-height:100vh;display:flex;flex-direction:column;}
    .fv-container{width:100%;max-width:1180px;margin:0 auto;padding:0 32px;box-sizing:border-box;}
    .fv-reading{width:100%;max-width:680px;margin:0 auto;padding:0 32px;}
    .hr{border:0;border-top:1px solid var(--paper-edge);margin:0;}
    .hr-strong{border:0;border-top:2px solid var(--ink);margin:0;}
    .kicker{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);}
    .fade-in{animation:fade 220ms var(--ease-standard) both;}
    @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
    .reading-progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:100;transition:transform 80ms linear;}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:0;transition:all 140ms;text-decoration:none;}
    .btn:hover{background:#2A2823;color:var(--paper);}
    .btn:active{transform:scale(0.98);}
    .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--paper-edge);}
    .btn-ghost:hover{border-color:var(--ink);}
    .btn-paper{background:var(--paper);color:var(--ink);border:1px solid var(--ink);}
    .btn-paper:hover{background:var(--paper-deep);}
    .btn-on-dark{background:transparent;color:var(--paper);border:1px solid var(--paper);}
    .btn-on-dark:hover{background:var(--paper);color:var(--ink);}
    .input{display:block;width:100%;box-sizing:border-box;padding:13px 16px;border:1px solid var(--paper-edge);background:var(--paper-soft);font-family:var(--font-serif);font-size:16px;color:var(--ink);border-radius:4px;outline:none;transition:border-color 140ms;}
    .input::placeholder{color:var(--ink-4);font-style:italic;}
    .input:focus{border-color:var(--ink);}
    .input.on-dark{background:rgba(244,237,224,0.06);border-color:rgba(244,237,224,0.18);color:var(--paper);}
    .input.on-dark::placeholder{color:rgba(244,237,224,0.4);}
    .input.on-dark:focus{border-color:var(--paper);}
    .tag-pill{display:inline-flex;align-items:center;padding:5px 14px;border:1px solid var(--paper-edge);background:transparent;font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-2);border-radius:999px;cursor:pointer;transition:all 140ms;}
    .tag-pill:hover{border-color:var(--ink);color:var(--ink);}
    .tag-pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
    .news-category{display:inline-block;font-family:var(--font-sans);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;margin-bottom:8px;}
    .fv-dropcap::first-letter{font-family:var(--font-display);font-weight:400;float:left;font-size:5.4em;line-height:0.85;margin:0.05em 0.08em 0 0;color:var(--accent);}
    .post-body h2{font-family:var(--font-display);font-size:32px;line-height:1.2;letter-spacing:-0.01em;color:var(--ink);margin:40px 0 16px;font-weight:400;}
    .post-body h3{font-family:var(--font-display);font-size:24px;line-height:1.2;color:var(--ink);margin:32px 0 12px;font-weight:400;}
    .post-body p{font-family:var(--font-serif);font-size:18px;line-height:1.65;color:var(--ink);margin:0 0 20px;}
    .post-body blockquote{margin:24px -40px;padding:32px 40px;background:var(--ink-bg);color:var(--paper);}
    .post-body blockquote p{font-family:var(--font-display);font-size:26px;font-style:italic;line-height:1.25;color:var(--paper);margin:0;}
    .post-body ul,.post-body ol{font-family:var(--font-serif);font-size:18px;line-height:1.65;color:var(--ink);padding-left:24px;margin:0 0 20px;}
    .post-body hr{border:0;border-top:1px solid var(--paper-edge);margin:40px 0;}
    .reg-row{transition:background 200ms ease;}
    .reg-row:hover{background:var(--ink);padding-left:16px !important;padding-right:16px !important;}
    .reg-row:hover .reg-no{color:var(--accent);}
    .reg-row:hover .reg-title{color:var(--paper);}
    .reg-row:hover *{color:var(--paper) !important;}
    .reg-row:hover .reg-arrow{transform:translateX(6px);}
    @media(max-width:1100px){.v2-edge-vert{display:none !important;}}
    @media(max-width:880px){section{padding-left:24px !important;padding-right:24px !important;}}
  </style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="text-align:center;">
      <div style="font-family:'Fraunces',serif;font-size:28px;color:#1B1A17;margin-bottom:16px;">Framing <em style="color:#7A1F1F;">Vote</em></div>
      <div style="font-family:monospace;font-size:12px;color:#6B6759;letter-spacing:0.08em;text-transform:uppercase;">Loading…</div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">
const { useState, useEffect } = React;

/* ── CONTENTFUL ── */
const SPACE='upaglixkbf42',TOKEN='H3fmoxO4StTBS-lRp_ULYaywbv3uM3C6WTG8o1M_PbU';
const BASE=`https://cdn.contentful.com/spaces/${SPACE}/environments/master`;
async function cfFetch(path){const r=await fetch(`${BASE}${path}&access_token=${TOKEN}`);if(!r.ok)throw new Error(r.status);return r.json();}
async function getEntries(ct,extra=''){return cfFetch(`/entries?content_type=${ct}${extra}`);}

/* ── RICH TEXT ── */
function rt(doc){
  if(!doc||!doc.content)return'';
  const n=node=>{
    if(node.nodeType==='text'){let t=node.value;(node.marks||[]).forEach(m=>{if(m.type==='bold')t=`<strong>${t}</strong>`;if(m.type==='italic')t=`<em>${t}</em>`;if(m.type==='code')t=`<code>${t}</code>`;});return t;}
    const i=(node.content||[]).map(n).join('');
    switch(node.nodeType){
      case'paragraph':return`<p>${i}</p>`;case'heading-1':return`<h1>${i}</h1>`;case'heading-2':return`<h2>${i}</h2>`;
      case'heading-3':return`<h3>${i}</h3>`;case'unordered-list':return`<ul>${i}</ul>`;case'ordered-list':return`<ol>${i}</ol>`;
      case'list-item':return`<li>${i}</li>`;case'blockquote':return`<blockquote>${i}</blockquote>`;case'hr':return`<hr/>`;
      case'hyperlink':return`<a href="${node.data?.uri}">${i}</a>`;default:return i;
    }
  };
  return doc.content.map(n).join('');
}
function fmtDate(s){if(!s)return'';return new Date(s).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}

/* ── PRIMITIVES ── */
function TickerTape({items,dark=false,speed=70}){
  const sep=' ✕ ',line=items.join(sep)+sep;
  const bg=dark?'var(--ink-bg)':'var(--paper)',fg=dark?'var(--paper)':'var(--ink)',edge=dark?'rgba(244,237,224,0.18)':'var(--paper-edge)';
  return(<div style={{overflow:'hidden',whiteSpace:'nowrap',background:bg,color:fg,borderTop:`1px solid ${edge}`,borderBottom:`1px solid ${edge}`}}>
    <div style={{display:'inline-flex',animation:`fvmq ${speed}s linear infinite`,paddingTop:9,paddingBottom:9}}>
      {[0,1].map(k=><span key={k} aria-hidden={k===1} style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.18em',textTransform:'uppercase'}}>{line.repeat(2)}</span>)}
    </div>
    <style>{`@keyframes fvmq{from{transform:translateX(0);}to{transform:translateX(-50%);}}`}</style>
  </div>);
}

function TallyMark({count=5,color='var(--accent)',size=18,gap=4}){
  const g=Math.floor(count/5),r=count%5,s=Math.max(1,Math.round(size/14));
  const Grp=({five=false,n=5})=>(<span style={{position:'relative',display:'inline-block',width:size*0.9,height:size*1.1,marginRight:gap}}>
    {Array.from({length:five?4:n}).map((_,i)=><span key={i} style={{position:'absolute',left:i*(size*0.18),top:0,bottom:0,width:s,background:color}}/>)}
    {five&&<span style={{position:'absolute',left:-2,top:'50%',width:size*0.95,height:s,background:color,transform:'translateY(-50%) rotate(-22deg)',transformOrigin:'left center'}}/>}
  </span>);
  return(<span style={{display:'inline-flex',alignItems:'center'}}>{Array.from({length:g}).map((_,i)=><Grp key={i} five/>)}{r>0&&<Grp n={r}/>}</span>);
}

function CompoArt({glyph='§',marks=[],style:{numSize,...divStyle}={}}){
  return(<div style={{position:'relative',overflow:'hidden',background:'var(--ink-bg)',...divStyle}}>
    <div style={{position:'absolute',inset:0,background:'linear-gradient(160deg,#3C3A33 0%,#1B1A17 60%,#2A2823 100%)'}}/>
    {marks.map((m,i)=><div key={i} style={{position:'absolute',color:'var(--paper)',opacity:0.35,...m.style}}>{m.text}</div>)}
    <div style={{position:'absolute',left:18,bottom:14,fontFamily:'var(--font-display)',color:'var(--paper)',opacity:0.85,fontStyle:'italic',lineHeight:0.9,fontSize:numSize||120}}>{glyph}</div>
  </div>);
}

function ReadingProgress(){
  const[p,setP]=useState(0);
  useEffect(()=>{const f=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;setP(m>0?Math.min(1,h.scrollTop/m):0);};window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  return<div className="reading-progress" style={{transform:`scaleX(${p})`}}/>;
}

/* ── MASTHEAD ── */
function MastheadV2({route,setRoute,settings}){
  const links=[['home','Front'],['archive','Register'],['news','Dispatch'],['about','Colophon'],['submit','Desk']];
  const num=settings?.issueNumber||'01',season=settings?.issueSeason||'',cities=settings?.cities||'';
  const today=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return(<header style={{position:'sticky',top:0,zIndex:50,background:'var(--paper)',borderBottom:'1px solid var(--paper-edge)'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 32px',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.16em',textTransform:'uppercase',color:'var(--ink-3)',borderBottom:'1px solid var(--paper-edge)'}}>
      <span>Vol.{settings?.volumeNumber||'I'} · Issue {num} · {season}</span>
      <span style={{display:'inline-flex',alignItems:'center',gap:8}}><span style={{width:6,height:6,background:'var(--accent)',borderRadius:'50%',animation:'fvpulse 2.4s ease-in-out infinite'}}/>Filed live · {today}</span>
      <span>{cities}</span>
      <style>{`@keyframes fvpulse{0%,100%{opacity:1;}50%{opacity:0.25;}}`}</style>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'auto 1fr auto',alignItems:'end',padding:'26px 32px 22px',gap:24}}>
      <div style={{writingMode:'vertical-rl',transform:'rotate(180deg)',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.24em',textTransform:'uppercase',color:'var(--ink-3)',paddingRight:4}}>№ {String(num).padStart(3,'0')} / {new Date().getFullYear()}</div>
      <button onClick={()=>setRoute('home')} style={{background:'none',border:0,padding:0,cursor:'pointer',textAlign:'left',display:'flex',alignItems:'baseline',gap:14,lineHeight:0.85}}>
        <span style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:'clamp(48px,7vw,96px)',letterSpacing:'-0.035em',color:'var(--ink)'}}>Framing</span>
        <span style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontWeight:400,fontSize:'clamp(48px,7vw,96px)',letterSpacing:'-0.035em',color:'var(--accent)'}}>Vote</span>
        <span aria-hidden style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.16em',color:'var(--ink-3)',paddingLeft:8}}>‖‖‖‖</span>
      </button>
      <div style={{textAlign:'right',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--ink-3)'}}>{settings?.tagline||'A quarterly journal'}<br/>on elections</div>
    </div>
    <nav style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 32px',borderTop:'2px solid var(--ink)'}}>
      <ul style={{display:'flex',gap:36,listStyle:'none',margin:0,padding:0}}>
        {links.map(([k,label])=>(
          <li key={k}><button onClick={()=>setRoute(k)} style={{background:'none',border:0,padding:0,cursor:'pointer',fontFamily:'var(--font-sans)',fontSize:13,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',color:route===k?'var(--accent)':'var(--ink)',display:'inline-flex',alignItems:'center',gap:8}}>
            {route===k&&<span style={{width:6,height:6,background:'var(--accent)'}}/>}{label}
          </button></li>
        ))}
      </ul>
      <button className="btn btn-paper" style={{padding:'8px 14px',fontSize:11}} onClick={()=>document.getElementById('fv-newsletter')?.scrollIntoView({behavior:'smooth'})}>Subscribe</button>
    </nav>
    <TickerTape items={[settings?.issueTheme?`Issue ${num} · ${settings.issueTheme}`:`Now open · Issue ${num}`,settings?.tagline||'A quarterly journal of elections','Free postage on orders of two or more','Subscriptions open · Subscribe below']}/>
  </header>);
}

/* ── HERO ── */
function HeroV2({featured,settings,about,setRoute,setCurrentArticle}){
  const num=settings?.issueNumber||'01',theme=settings?.issueTheme||'The Argument',season=settings?.issueSeason||'';
  if(!featured)return(
    <section style={{position:'relative',borderBottom:'2px solid var(--ink)',overflow:'hidden',background:'var(--paper)',padding:'80px 64px 64px'}}>
      <div aria-hidden style={{position:'absolute',right:-20,top:-20,fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:'clamp(200px,30vw,420px)',lineHeight:0.78,color:'var(--ink)',opacity:0.06,pointerEvents:'none',userSelect:'none'}}>{num}</div>
      <div style={{maxWidth:760,position:'relative'}}>
        <div className="kicker" style={{marginBottom:18,color:'var(--accent)'}}>Issue N°{num} · {season}</div>
        <h1 style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:'clamp(44px,7vw,100px)',lineHeight:0.94,letterSpacing:'-0.03em',color:'var(--ink)',margin:0}}><em style={{color:'var(--accent)'}}>{theme}</em><br/>is in preparation.</h1>
        <p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:20,lineHeight:1.5,color:'var(--ink-2)',margin:'26px 0 0',maxWidth:580}}>{settings?.tagline||'A quarterly journal on elections.'}</p>
        <div style={{display:'flex',gap:14,marginTop:32}}>
          <button className="btn" onClick={()=>document.getElementById('fv-newsletter')?.scrollIntoView({behavior:'smooth'})}>Get notified</button>
          <button className="btn btn-ghost" onClick={()=>setRoute('about')}>About the journal</button>
        </div>
      </div>
    </section>
  );
  return(
    <section style={{position:'relative',borderBottom:'2px solid var(--ink)',overflow:'hidden',background:'var(--paper)'}}>
      <div aria-hidden className="v2-edge-vert" style={{position:'absolute',left:14,top:36,bottom:36,display:'flex',flexDirection:'column',justifyContent:'space-between',alignItems:'center',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.24em',textTransform:'uppercase',color:'var(--ink-3)',pointerEvents:'none'}}>
        <span style={{writingMode:'vertical-rl',transform:'rotate(180deg)'}}>The Front · {new Date().toLocaleDateString('en-GB')}</span>
        <span style={{writingMode:'vertical-rl',transform:'rotate(180deg)'}}>Cont. p. 02 →</span>
      </div>
      <div aria-hidden className="v2-edge-vert" style={{position:'absolute',right:14,top:36,bottom:36,display:'flex',flexDirection:'column',justifyContent:'space-between',alignItems:'center',fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.24em',textTransform:'uppercase',color:'var(--ink-3)',pointerEvents:'none'}}>
        <span style={{writingMode:'vertical-rl'}}>Plate I</span>
        <span style={{writingMode:'vertical-rl'}}>Issue {num}</span>
      </div>
      <div style={{position:'relative',padding:'56px 64px 0',maxWidth:1400,margin:'0 auto'}}>
        <div aria-hidden style={{position:'absolute',right:-20,top:-20,fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:'clamp(200px,30vw,420px)',lineHeight:0.78,color:'var(--ink)',opacity:0.06,pointerEvents:'none',userSelect:'none'}}>{num}</div>
        <div aria-hidden style={{position:'absolute',right:60,top:16,opacity:0.95,mixBlendMode:'multiply'}}><TallyMark count={parseInt(num)||1} color="var(--accent)" size={26}/></div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',paddingBottom:16,borderBottom:'1px solid var(--paper-edge)',position:'relative'}}>
          <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--ink-2)'}}><span style={{color:'var(--accent)'}}>●</span> Lead Essay · {theme}</div>
          <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--ink-3)'}}>File {String(num).padStart(2,'0')}.01</div>
        </div>
        <div style={{position:'relative',paddingTop:36,paddingBottom:56,maxWidth:760}}>
          <div className="kicker" style={{marginBottom:18,color:'var(--ink-3)'}}><span style={{color:'var(--accent)'}}>—</span> {featured.kicker||`Issue N°${num}`} &nbsp;·&nbsp; {featured.publishDate?fmtDate(featured.publishDate):''}</div>
          <h1 style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:'clamp(44px,7vw,100px)',lineHeight:0.94,letterSpacing:'-0.03em',color:'var(--ink)',margin:0}}>{featured.title}</h1>
          {featured.subtitle&&<p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:20,lineHeight:1.5,color:'var(--ink-2)',margin:'26px 0 0',maxWidth:600}}>{featured.subtitle}</p>}
          <div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap:18,marginTop:32}}>
            <div style={{display:'flex',alignItems:'center',gap:12}}>
              <div style={{width:40,height:40,background:'var(--ink)',color:'var(--paper)',display:'grid',placeItems:'center',fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:22}}>{(featured.author||about?.editorName||'E')[0]}</div>
              <div style={{lineHeight:1.2}}>
                <div style={{fontFamily:'var(--font-sans)',fontSize:12,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--ink)'}}>{featured.author||about?.editorName}</div>
                <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--ink-3)',marginTop:4}}>{about?.editorTitle||'Editor'}</div>
              </div>
            </div>
            <span style={{width:1,height:40,background:'var(--paper-edge)'}}/>
            <button className="btn" onClick={()=>{setCurrentArticle(featured);setRoute('article');}}>Read the essay <span style={{fontFamily:'var(--font-mono)',letterSpacing:'0.1em'}}>→</span></button>
            <button className="btn btn-ghost" onClick={()=>setRoute('archive')}>Browse Issue {num}</button>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',borderTop:'2px solid var(--ink)',borderBottom:'1px solid var(--paper-edge)',marginTop:40,background:'var(--paper-soft)'}}>
          {[{k:'Issue',f:num,u:'current',n:theme},{k:'Season',f:season||'–',u:'',n:settings?.cities||''},{k:'Editor',f:(about?.editorName||'–').split(' ')[0],u:'',n:about?.editorTitle||''},{k:'Submit',f:'Open',u:'pitches',n:'We reply to all'}].map((s,i)=>(
            <div key={i} style={{padding:'20px 24px',borderRight:i<3?'1px solid var(--paper-edge)':'none',display:'flex',flexDirection:'column',gap:4}}>
              <div className="kicker" style={{color:'var(--accent)',fontSize:10}}>{s.k}</div>

          {items.map((it,i)=><React.Fragment key={i}><span>{it.text}</span>{i<items.length-1&&<span style={{color:'var(--accent)',padding:'0 0.3em'}}>·</span>}</React.Fragment>)}
        </span>)}
      </div>
      <style>{`@keyframes fvlaneleft{from{transform:translateX(0);}to{transform:translateX(-50%);}}@keyframes fvlaneright{from{transform:translateX(-50%);}to{transform:translateX(0);}}`}</style>

      <div style={{maxWidth:1400,margin:'0 auto',padding:'0 64px 64px'}}>

      <div style={{maxWidth:1400,margin:'0 auto',padding:'0 64px'}}>
        <div style={{paddingBottom:24,borderBottom:'2px solid var(--ink)'}}>
          <div className="kicker" style={{color:'var(--accent)',marginBottom:14}}>News & Dispatches</div>
          <h1 style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:'clamp(36px,5vw,72px)',lineHeight:0.95,letterSpacing:'-0.03em',margin:0,color:'var(--ink)'}}>Deliberate. <em style={{color:'var(--accent)'}}>Once a week or two.</em></h1>
        </div>
        {cats.length>1&&<div style={{display:'flex',gap:10,flexWrap:'wrap',padding:'24px 0',borderBottom:'1px solid var(--paper-edge)'}}>{cats.map(c=><button key={c} onClick={()=>setFilter(c)} className={`tag-pill${filter===c?' active':''}`}>{c}</button>)}</div>}
        {filtered.length===0?(
          <div style={{padding:'80px 0',textAlign:'center'}}><p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:18,color:'var(--ink-3)'}}>No dispatches yet. Check back soon.</p></div>
        ):filtered.map((n,i)=>(
          <button key={n.id} onClick={()=>{setCurrentNews(n);setRoute('newsArticle');}} className="reg-row" style={{all:'unset',display:'grid',gridTemplateColumns:'60px 1fr 200px 160px 60px',gap:24,padding:'26px 0',borderBottom:'1px solid var(--paper-edge)',cursor:'pointer',alignItems:'center',textAlign:'left',width:'100%',boxSizing:'border-box'}}>
            <div style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:32,lineHeight:1,color:'var(--ink)'}} className="reg-no">{String(i+1).padStart(2,'0')}</div>
            <div>{n.category&&<div style={{fontFamily:'var(--font-sans)',fontSize:10,fontWeight:600,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--accent)',marginBottom:6}}>{n.category}</div>}<div style={{fontFamily:'var(--font-display)',fontWeight:400,fontSize:22,lineHeight:1.15,color:'var(--ink)'}} className="reg-title">{n.title}</div>{n.summary&&<div style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:14,color:'var(--ink-3)',marginTop:4}}>{(n.summary||'').substring(0,100)}</div>}</div>
            <div style={{fontFamily:'var(--font-sans)',fontSize:12,fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',color:'var(--ink-2)'}}>{n.author}</div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-3)'}}>{n.publishDate?fmtDate(n.publishDate):'–'}</div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:14,color:'var(--ink-3)',textAlign:'right'}} className="reg-arrow">→</div>
          </button>
        ))}
      </div>
    </section>
  );
}

/* ── NEWS ARTICLE ── */
function NewsArticleView({item,about,setRoute}){
  if(!item)return null;
  const html=rt(item.body);
  return(
    <article className="fade-in">
      <ReadingProgress/>
      <div style={{padding:'56px 0 24px'}}><div className="fv-reading"><a href="#" onClick={e=>{e.preventDefault();setRoute('news');}} style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--ink-3)',textDecoration:'none'}}>← Back to Dispatches</a></div></div>
      <header style={{paddingBottom:40}}>
        <div className="fv-reading" style={{display:'flex',flexDirection:'column',gap:16}}>
          {item.category&&<div className="news-category" style={{alignSelf:'flex-start'}}>{item.category}</div>}
          <h1 style={{fontFamily:'var(--font-display)',fontSize:'clamp(32px,4vw,56px)',lineHeight:1.05,letterSpacing:'-0.02em',margin:0,fontWeight:400,color:'var(--ink)'}}>{item.title}</h1>
          {item.summary&&<p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:20,lineHeight:1.45,color:'var(--ink-2)',margin:0}}>{item.summary}</p>}
          <div style={{display:'flex',alignItems:'center',gap:12,paddingTop:16,borderTop:'1px solid var(--paper-edge)'}}>
            <div style={{width:44,height:44,background:'var(--ink-bg)',color:'var(--paper)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:20,flexShrink:0}}>{(item.author||about?.editorName||'E')[0]}</div>
            <div>
              <div style={{fontFamily:'var(--font-sans)',fontSize:12,fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',color:'var(--ink-2)'}}>{item.author||about?.editorName}</div>
              {item.publishDate&&<div style={{fontFamily:'var(--font-sans)',fontSize:12,color:'var(--ink-3)'}}>{fmtDate(item.publishDate)}</div>}
            </div>
          </div>
        </div>
      </header>
      <div className="fv-reading post-body" style={{paddingBottom:80}} dangerouslySetInnerHTML={{__html:html||`<p>${item.summary||''}</p>`}}/>
      <div style={{borderTop:'1px solid var(--paper-edge)',padding:'32px 0'}}>
        <div className="fv-reading" style={{display:'flex',gap:12}}>
          <button className="btn btn-ghost" onClick={()=>setRoute('news')}>← All dispatches</button>
          <button className="btn btn-ghost" onClick={()=>setRoute('home')}>Homepage</button>
        </div>
      </div>
    </article>
  );
}

/* ── ABOUT ── */
function AboutView({about}){
  if(!about)return<div style={{padding:'80px 32px',textAlign:'center',fontFamily:'var(--font-serif)',color:'var(--ink-3)'}}>Loading…</div>;
  const bioHtml=about.editorBio?.nodeType?rt(about.editorBio):`<p>${about.editorBio||''}</p>`;
  const descHtml=about.journalDescription?.nodeType?rt(about.journalDescription):`<p>${about.journalDescription||''}</p>`;
  const prinHtml=about.publishingPrinciples?.nodeType?rt(about.publishingPrinciples):about.publishingPrinciples?`<p>${about.publishingPrinciples}</p>`:null;
  return(
    <section className="fade-in" style={{padding:'64px 0 96px'}}>
      <div className="fv-reading" style={{display:'flex',flexDirection:'column',gap:24}}>
        <div className="kicker" style={{color:'var(--accent)'}}>About the journal</div>
        <h1 style={{fontFamily:'var(--font-display)',fontSize:'clamp(32px,4.5vw,56px)',lineHeight:1.05,letterSpacing:'-0.02em',margin:0,fontWeight:400}}>A quarterly on elections, <em>written to last.</em></h1>
        <div className="post-body fv-dropcap" dangerouslySetInnerHTML={{__html:bioHtml}}/>
        <div className="post-body" dangerouslySetInnerHTML={{__html:descHtml}}/>
        <div style={{display:'flex',alignItems:'center',gap:18,padding:'8px 0'}}><div style={{height:1,background:'var(--paper-edge)',flex:1}}/><span style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:22,color:'var(--accent)'}}>§</span><div style={{height:1,background:'var(--paper-edge)',flex:1}}/></div>
        <h2 style={{fontFamily:'var(--font-display)',fontSize:28,lineHeight:1.2,letterSpacing:'-0.01em',margin:'8px 0 0',fontWeight:400}}>The editor</h2>
        <div style={{padding:24,background:'var(--paper-deep)',borderLeft:'2px solid var(--accent)'}}>
          <div style={{fontFamily:'var(--font-sans)',fontSize:13,fontWeight:600,letterSpacing:'0.04em',textTransform:'uppercase',color:'var(--ink)',marginBottom:4}}>{about.editorName}</div>
          <div style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:14,color:'var(--ink-3)'}}>{about.editorTitle}{about.editorEmail&&<> · <a href={`mailto:${about.editorEmail}`}>{about.editorEmail}</a></>}</div>
        </div>
        {prinHtml&&<><div style={{display:'flex',alignItems:'center',gap:18,padding:'8px 0'}}><div style={{height:1,background:'var(--paper-edge)',flex:1}}/><span style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:22,color:'var(--accent)'}}>§</span><div style={{height:1,background:'var(--paper-edge)',flex:1}}/></div><h2 style={{fontFamily:'var(--font-display)',fontSize:28,lineHeight:1.2,letterSpacing:'-0.01em',margin:'8px 0 0',fontWeight:400}}>Publishing principles</h2><div className="post-body" dangerouslySetInnerHTML={{__html:prinHtml}}/></>}
      </div>
    </section>
  );
}

/* ── SUBMIT ── */
function SubmitView({about}){
  return(
    <section className="fade-in" style={{padding:'64px 0 96px'}}>
      <div className="fv-reading" style={{display:'flex',flexDirection:'column',gap:24}}>
        <div className="kicker" style={{color:'var(--accent)'}}>Pitch an essay</div>
        <h1 style={{fontFamily:'var(--font-display)',fontSize:'clamp(32px,4.5vw,56px)',lineHeight:1.05,letterSpacing:'-0.02em',margin:0,fontWeight:400}}>We read every pitch. <em>We reply to all.</em></h1>
        <p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:20,lineHeight:1.5,color:'var(--ink-2)',margin:0}}>Framing Vote publishes long-form essays, field reports, data analyses, and editorial arguments on elections and democratic institutions.</p>
        <div style={{display:'flex',alignItems:'center',gap:18,padding:'8px 0'}}><div style={{height:1,background:'var(--paper-edge)',flex:1}}/><span style={{fontFamily:'var(--font-display)',fontStyle:'italic',fontSize:22,color:'var(--accent)'}}>§</span><div style={{height:1,background:'var(--paper-edge)',flex:1}}/></div>
        <div style={{background:'var(--paper-deep)',padding:28,borderTop:'2px solid var(--ink)'}}>
          <div className="kicker" style={{marginBottom:12}}>To pitch</div>
          <p style={{fontFamily:'var(--font-serif)',fontSize:17,lineHeight:1.6,color:'var(--ink)',margin:'0 0 16px'}}>Send a 200–300 word pitch — your argument, your angle, why now — to:</p>
          {about?.editorEmail?<a href={`mailto:${about.editorEmail}`} style={{fontFamily:'var(--font-mono)',fontSize:15,color:'var(--accent)'}}>{about.editorEmail}</a>:<span style={{fontFamily:'var(--font-mono)',fontSize:15,color:'var(--ink-3)'}}>Email coming soon</span>}
          <p style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--ink-3)',margin:'12px 0 0'}}>We reply within two weeks. Commissioned pieces are paid.</p>
        </div>
      </div>
    </section>
  );
}

/* ── HOME ── */
function HomeView({articles,news,settings,about,setRoute,setCurrentArticle,setCurrentNews}){
  const featured=articles&&articles.length>0?articles[0]:null;
  return(<>
    <HeroV2 featured={featured} settings={settings} about={about} setRoute={setRoute} setCurrentArticle={setCurrentArticle}/>
    <DispatchV2 news={news} setRoute={setRoute} setCurrentNews={setCurrentNews}/>
    <RegisterV2 articles={articles} settings={settings} about={about} setRoute={setRoute} setCurrentArticle={setCurrentArticle}/>
    <ManifestoV2/>
  </>);
}

/* ── APP ── */
function App(){
  const[route,setRoute]=useState('home');
  const[articles,setArticles]=useState([]);
  const[news,setNews]=useState([]);
  const[settings,setSettings]=useState(null);
  const[about,setAbout]=useState(null);
  const[currentArticle,setCurrentArticle]=useState(null);
  const[currentNews,setCurrentNews]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{window.scrollTo(0,0);},[route]);

  useEffect(()=>{
    async function load(){
      try{
        const[aR,sR,abR,nR]=await Promise.all([
          getEntries('articlePost','&order=-fields.publishDate'),
          getEntries('settings'),
          getEntries('about'),
          getEntries('news','&order=-fields.publishDate'),
        ]);
        setArticles((aR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        setNews((nR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        if(sR.items?.length)setSettings(sR.items[0].fields);
        if(abR.items?.length)setAbout(abR.items[0].fields);
      }catch(e){console.error('Contentful error:',e);}
      finally{setLoading(false);}
    }
    load();
  },[]);

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--paper)'}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontFamily:'var(--font-display)',fontSize:28,letterSpacing:'-0.02em',color:'var(--ink)',marginBottom:16}}>Framing <em style={{color:'var(--accent)'}}>Vote</em></div>
        <div style={{fontFamily:'var(--font-mono)',fontSize:12,color:'var(--ink-3)',letterSpacing:'0.12em',textTransform:'uppercase'}}>Loading…</div>
      </div>
    </div>
  );

  return(
    <div className="fv-page">
      <MastheadV2 route={route} setRoute={setRoute} settings={settings}/>
      <main style={{flex:1}}>
        {route==='home'        &&<HomeView articles={articles} news={news} settings={settings} about={about} setRoute={setRoute} setCurrentArticle={setCurrentArticle} setCurrentNews={setCurrentNews}/>}
        {route==='article'     &&<ArticleView article={currentArticle} about={about} setRoute={setRoute}/>}
        {route==='archive'     &&<ArchiveView articles={articles} settings={settings} about={about} setRoute={setRoute} setCurrentArticle={setCurrentArticle}/>}
        {route==='news'        &&<NewsView news={news} setRoute={setRoute} setCurrentNews={setCurrentNews}/>}
        {route==='newsArticle' &&<NewsArticleView item={currentNews} about={about} setRoute={setRoute}/>}
        {route==='about'       &&<AboutView about={about}/>}
        {route==='submit'      &&<SubmitView about={about}/>}
      </main>
      <Newsletter/>
      <FooterV2 setRoute={setRoute} settings={settings} about={about}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
