<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Framing Vote — A journal on elections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,800;1,6..96,400;1,6..96,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600;700&family=Permanent+Marker&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    :root{
      /* Paper / ink — near white for minimalist futuristic feel */
      --paper:#FCFBF7;
      --paper-soft:#FFFFFF;
      --paper-deep:#F2F0E8;
      --paper-edge:#E0DCCD;
      --ink:#0E0E0C;
      --ink-2:#2C2A26;
      --ink-3:#62604F;
      --ink-4:#A8A595;

      /* Bright editorial accents */
      --red:#8B1A1A;
      --red-deep:#611010;
      --red-soft:#E8C4C4;
      --yellow:#F4D52A;
      --green:#3DDC91;
      --pink:#FF6FA3;
      --blue:#2C4FE5;

      /* Active accent — switched by tweaks */
      --accent:var(--red);
      --accent-deep:var(--red-deep);

      --font-display:"Fraunces","Times New Roman",serif;
      --font-didone:"Bodoni Moda","Didot",serif;
      --font-serif:"Bodoni Moda","Georgia",serif;
      --font-sans:"Inter Tight",-apple-system,sans-serif;
      --font-mono:"JetBrains Mono",ui-monospace,monospace;
      --font-script:"Caveat",cursive;
      --font-marker:"Permanent Marker",cursive;
      --ease:cubic-bezier(0.2,0.7,0.2,1);
    }
    *,*::before,*::after{box-sizing:border-box;}
    html,body,#root{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0;}
    ::selection{background:var(--accent);color:var(--paper);}
    img{max-width:100%;display:block;}

    .page{min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}
    .wrap{width:100%;max-width:1440px;margin:0 auto;padding:0 48px;}
    .read{width:100%;max-width:680px;margin:0 auto;padding:0 32px;}
    .hr{border:0;border-top:1px solid var(--paper-edge);margin:0;}

    /* Typography ---------------------------------------------------------- */
    .eyebrow{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-3);}
    .eyebrow-accent{color:var(--accent);}
    .mono{font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;color:var(--ink-3);text-transform:uppercase;}
    .script{font-family:var(--font-script);color:var(--accent);font-weight:600;}
    .marker{font-family:var(--font-marker);color:var(--accent);text-transform:uppercase;letter-spacing:0.02em;}

    .display{font-family:var(--font-display);font-weight:500;letter-spacing:-0.028em;line-height:0.9;color:var(--ink);}
    .display em{font-family:var(--font-didone);font-style:italic;font-weight:400;color:var(--ink);letter-spacing:-0.02em;}
    .display .red{color:var(--accent);}

    .didone{font-family:var(--font-didone);font-weight:400;letter-spacing:-0.018em;line-height:1;color:var(--ink);}
    .didone em{font-style:italic;}

    /* Buttons ------------------------------------------------------------- */
    .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-family:var(--font-sans);font-size:11.5px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:0;transition:transform 140ms var(--ease),background 140ms var(--ease);}
    .btn:hover{background:var(--accent);}
    .btn:active{transform:translateY(1px);}
    .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
    .btn-ghost:hover{background:var(--ink);color:var(--paper);}
    .btn-red{background:var(--accent);color:var(--paper);}
    .btn-red:hover{background:var(--accent-deep);}
    .btn-on-dark{background:var(--paper);color:var(--ink);}
    .btn-on-dark:hover{background:var(--accent);color:var(--paper);}
    .arrow{font-family:var(--font-mono);font-size:13px;font-weight:500;}

    .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink);border:1px solid var(--ink);background:transparent;cursor:pointer;transition:all 140ms;border-radius:999px;}
    .pill:hover{background:var(--ink);color:var(--paper);}
    .pill.active{background:var(--accent);color:var(--paper);border-color:var(--accent);}

    .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-family:var(--font-sans);font-size:10.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);background:transparent;border:1px solid var(--accent);}

    .input{display:block;width:100%;box-sizing:border-box;padding:14px 16px;border:1px solid var(--ink);background:var(--paper-soft);font-family:var(--font-serif);font-size:16px;color:var(--ink);border-radius:0;outline:none;transition:border-color 140ms;}
    .input::placeholder{color:var(--ink-4);font-style:italic;}
    .input:focus{border-color:var(--accent);}
    .input.on-dark{background:rgba(250,246,236,0.04);border-color:rgba(250,246,236,0.3);color:var(--paper);}
    .input.on-dark::placeholder{color:rgba(250,246,236,0.45);}
    .input.on-dark:focus{border-color:var(--paper);}

    /* Halftone treatment for images --------------------------------------- */
    .halftone{
      position:relative;
      overflow:hidden;
      filter:grayscale(1) contrast(1.4) brightness(0.97);
    }
    .halftone::after{
      content:"";
      position:absolute;inset:0;
      background-image:radial-gradient(circle at center, rgba(14,14,12,0.55) 22%, transparent 23%);
      background-size:3.2px 3.2px;
      mix-blend-mode:lighten;
      pointer-events:none;
    }

    /* Numbered red circle annotation (Vogue style) ------------------------ */
    .num-mark{
      display:inline-flex;align-items:center;justify-content:center;
      width:34px;height:34px;border-radius:50%;
      background:var(--accent);color:var(--paper);
      font-family:var(--font-script);font-weight:700;font-size:20px;line-height:1;
      transform:rotate(-4deg);
    }

    /* Hand-drawn underline */
    .script-underline{position:relative;display:inline-block;}
    .script-underline::after{
      content:"";position:absolute;left:-4%;right:-4%;bottom:-8px;height:8px;
      background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 6' preserveAspectRatio='none'><path d='M1,4 C20,1 40,5 60,2 C80,5 95,1 99,3' stroke='%23E11F1C' stroke-width='2' fill='none' stroke-linecap='round'/></svg>") no-repeat center/100% 100%;
    }

    /* Star decorative */
    .star-deco{display:inline-block;width:18px;height:18px;background:var(--ink);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}

    /* Image slot styling */
    image-slot{
      --slot-bg:var(--paper-deep);
      --slot-border:1px dashed var(--paper-edge);
      --slot-text-color:var(--ink-3);
      --slot-text-size:11px;
      font-family:var(--font-mono);
    }

    /* Marquee ticker ------------------------------------------------------ */
    .ticker{display:flex;overflow:hidden;}
    .ticker-track{display:flex;gap:48px;flex-shrink:0;padding:14px 0;animation:tick 70s linear infinite;}
    .ticker:hover .ticker-track{animation-play-state:paused;}
    @keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}
    .ticker-item{display:inline-flex;align-items:center;gap:14px;white-space:nowrap;}

    /* Article body styling ----------------------------------------------- */
    .post-body h2{font-family:var(--font-display);font-weight:500;font-size:36px;line-height:1.1;letter-spacing:-0.02em;color:var(--ink);margin:48px 0 16px;}
    .post-body h2 em{font-style:italic;color:var(--accent);}
    .post-body h3{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.2;color:var(--ink);margin:32px 0 12px;}
.post-body p{font-family:'Merriweather',serif;font-size:19px;line-height:1.65;color:var(--ink);margin:0 0 22px;text-align:justify;hyphens:auto;-webkit-hyphens:auto;}
    .post-body p a{color:var(--accent);text-decoration:underline;text-underline-offset:0.2em;}
    .post-body p a:hover{color:var(--accent-deep);}
    .post-body strong{color:var(--ink);font-weight:600;}
    .post-body em{font-style:italic;}
    .post-body blockquote{margin:32px 0;padding:0 0 0 28px;border-left:3px solid var(--accent);}
    .post-body blockquote p{font-family:var(--font-display);font-size:30px;font-style:italic;line-height:1.25;color:var(--ink);margin:0;}
    .post-body ul,.post-body ol{font-family:var(--font-serif);font-size:19px;line-height:1.65;color:var(--ink);padding-left:24px;margin:0 0 22px;}
    .post-body li{margin-bottom:8px;}
    .post-body hr{border:0;border-top:1px solid var(--paper-edge);margin:48px 0;}
    .dropcap::first-letter{font-family:var(--font-didone);font-weight:700;float:left;font-size:6em;line-height:0.82;margin:0.04em 0.08em -0.05em 0;color:var(--accent);font-style:italic;}

    .progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:100;transition:transform 80ms linear;}

    .row-link{transition:background 200ms ease;}
    .row-link:hover{background:var(--paper-deep);}
    .row-link:hover .row-arrow{transform:translateX(4px);color:var(--accent);}
    .row-link:hover .row-title{color:var(--accent);}

    .fade-in{animation:fade 320ms var(--ease) both;}
    @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
    @keyframes wiggle{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(-2deg);}}
    /* RGB glitch split on hover */
    .glitch{position:relative;}
    .glitch::before,.glitch::after{content:"";position:absolute;inset:0;background-image:inherit;background-size:cover;mix-blend-mode:screen;opacity:0;pointer-events:none;transition:opacity 200ms,transform 280ms var(--ease);}
    .glitch:hover::before{opacity:0.55;transform:translate(-4px,1px);background:radial-gradient(closest-side,rgba(225,30,30,0.6),transparent 70%);}
    .glitch:hover::after{opacity:0.55;transform:translate(4px,-1px);background:radial-gradient(closest-side,rgba(30,140,255,0.55),transparent 70%);}

    /* Rolling number transitions */
    .roller{display:inline-flex;overflow:hidden;height:1em;line-height:1;vertical-align:baseline;}
    .roller-col{display:inline-flex;flex-direction:column;transition:transform 800ms cubic-bezier(0.2,0.8,0.2,1);}
    .roller-cell{height:1em;line-height:1;}

    /* Film strip horizontal scroll */
    .film-strip{display:flex;gap:0;align-items:stretch;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:8px 0 8px;}
    .film-strip::-webkit-scrollbar{display:none;}
    .film-frame{flex:0 0 auto;scroll-snap-align:start;position:relative;border-right:1px solid var(--paper-edge);transition:flex-basis 380ms var(--ease);}
    .film-frame:last-child{border-right:0;}

    /* Reveal staggered text */
    @keyframes word-in{from{opacity:0;transform:translateY(0.4em);}to{opacity:1;transform:none;}}
    @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
    @keyframes cycle-in{from{opacity:0;transform:translateY(8px) rotate(-2deg);}to{opacity:1;transform:translateY(-0.12em) rotate(-2deg);}}
    @keyframes cycle-out{from{opacity:1;transform:translateY(-0.12em) rotate(-2deg);}to{opacity:0;transform:translateY(-12px) rotate(-2deg);}}

    /* Custom cursor */
    .fv-cursor-on,.fv-cursor-on *{cursor:none !important;}
    .fv-cursor-on input,.fv-cursor-on textarea,.fv-cursor-on [contenteditable]{cursor:text !important;}
    #fv-cursor-ring{position:fixed;width:34px;height:34px;border:1px solid var(--ink);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width 280ms var(--ease),height 280ms var(--ease),border-color 280ms,background 280ms,opacity 240ms;mix-blend-mode:multiply;}
    #fv-cursor-dot{position:fixed;width:6px;height:6px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);}

    /* Scroll reveal */
    .reveal{opacity:0;transform:translateY(24px);transition:opacity 700ms var(--ease),transform 700ms var(--ease);}
    .reveal.in{opacity:1;transform:none;}
    .reveal-delay-1{transition-delay:80ms;}
    .reveal-delay-2{transition-delay:160ms;}
    .reveal-delay-3{transition-delay:240ms;}

    /* Magnetic numbered circle */
    .mag-num{transition:transform 200ms var(--ease);will-change:transform;cursor:pointer;}
    .mag-num:hover .mag-num-circle{transform:scale(1.18) rotate(-6deg);}
    .mag-num-pop{position:absolute;top:calc(100% + 12px);left:0;width:240px;padding:14px 16px;background:var(--paper-soft);border:1.5px solid var(--ink);font-family:var(--font-serif);font-style:italic;font-size:14px;line-height:1.5;color:var(--ink);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity 200ms,transform 200ms;z-index:30;}
    .mag-num.open .mag-num-pop{opacity:1;transform:none;pointer-events:auto;}
    .mag-num-pop::before{content:"";position:absolute;top:-8px;left:14px;width:14px;height:14px;background:var(--paper-soft);border-left:1.5px solid var(--ink);border-top:1.5px solid var(--ink);transform:rotate(45deg);}

    /* Polaroid card */
    .polaroid{background:var(--paper-soft);padding:14px 14px 48px;border:1px solid var(--paper-edge);box-shadow:0 24px 36px -22px rgba(14,14,12,0.3),0 6px 12px -8px rgba(14,14,12,0.15);transition:transform 380ms var(--ease),box-shadow 380ms var(--ease);cursor:grab;user-select:none;}
    .polaroid:active{cursor:grabbing;}
    .polaroid:hover{box-shadow:0 30px 50px -22px rgba(14,14,12,0.4),0 8px 16px -8px rgba(14,14,12,0.2);}

    /* Stamped wordmark layering */
    .stamp{position:relative;display:inline-block;}
    .stamp::before{content:attr(data-stamp);position:absolute;left:8px;top:6px;color:var(--accent);opacity:0.25;pointer-events:none;z-index:-1;}

    /* Hover lift on cards */
    .lift{transition:transform 240ms var(--ease);}
    .lift:hover{transform:translate(-3px,-3px);}

    @media(max-width:1100px){
      .wrap{padding:0 28px;}
      .read{padding:0 24px;}
      .display{letter-spacing:-0.022em;}
    }
    @media(max-width:720px){
      .hide-md{display:none !important;}
      .show-mobile{display:flex !important;}
      .wrap{padding:0 20px;}
      .read{padding:0 20px;}
      /* Responsive grids */
      .grid-responsive-2{grid-template-columns:1fr !important;}
      /* Post body smaller on mobile */
      .post-body p{font-size:17px;}
      .post-body h2{font-size:26px;}
      .post-body blockquote p{font-size:22px;}
    }
    @media(max-width:480px){
      .wrap{padding:0 16px;}
      .read{padding:0 16px;}
      .btn{padding:12px 16px;font-size:10px;letter-spacing:0.12em;}
    }
    /* show-mobile hidden by default on desktop */
    .show-mobile{display:none;}

    /* ── POST BODY (rich text rendering) ── */
    .post-body h2{font-family:var(--font-display);font-weight:500;font-size:36px;line-height:1.1;letter-spacing:-0.02em;color:var(--ink);margin:48px 0 16px;}
    .post-body h2 em{font-style:italic;color:var(--accent);}
    .post-body h3{font-family:var(--font-display);font-weight:500;font-size:24px;line-height:1.2;color:var(--ink);margin:32px 0 12px;}
.post-body p{font-family:'Merriweather',serif;font-size:19px;line-height:1.65;color:var(--ink);margin:0 0 22px;text-align:justify;hyphens:auto;-webkit-hyphens:auto;}
    .post-body p a{color:var(--accent);text-decoration:underline;text-underline-offset:0.2em;}
    .post-body p a:hover{color:var(--accent-deep);}
    .post-body strong{color:var(--ink);font-weight:600;}
    .post-body em{font-style:italic;}
    .post-body blockquote{margin:32px 0;padding:0 0 0 28px;border-left:3px solid var(--accent);}
    .post-body blockquote p{font-family:var(--font-display);font-size:28px;font-style:italic;line-height:1.25;color:var(--ink);margin:0;text-align:left;hyphens:none;-webkit-hyphens:none;}
    .post-body ul,.post-body ol{font-family:var(--font-serif);font-size:19px;line-height:1.65;color:var(--ink);padding-left:24px;margin:0 0 22px;}
    .post-body li{margin-bottom:8px;}
    .post-body hr{border:0;border-top:1px solid var(--paper-edge);margin:48px 0;}

    /* ── EMBED BREAKOUTS ── */
    .embed-breakout{width:min(100vw,1040px);margin-left:50%;transform:translateX(-50%);margin-top:36px;margin-bottom:36px;}
    .embed-video{aspect-ratio:16/9;width:100%;display:block;border:0;}
    .embed-iframe{width:100%;min-height:500px;border:0;display:block;}
    .embed-caption{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-3);margin-top:10px;padding:0 4px;}
    .embed-img{width:100%;display:block;}

    /* ── UTILITIES ── */
    .back-btn{font-family:var(--font-sans);font-size:13px;color:var(--ink-3);display:inline-flex;align-items:center;gap:8px;padding:6px 0;transition:color 140ms;background:none;border:0;cursor:pointer;}
    .back-btn:hover{color:var(--accent);}
    .empty-state{padding:96px 0;text-align:center;}
    .empty-glyph{font-family:var(--font-didone);font-style:italic;font-size:120px;color:var(--ink);opacity:0.06;line-height:1;margin-bottom:24px;}
    .empty-msg{font-family:var(--font-didone);font-style:italic;font-size:24px;color:var(--ink-3);}
    .issue-breadcrumb{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:18px;cursor:pointer;transition:color 140ms;background:none;border:0;}
    .issue-breadcrumb:hover{color:var(--accent);}

    /* ── COMPAT ALIASES (for adapted components) ── */
    :root{--bg:var(--paper);--bg-warm:var(--paper-deep);--bg-deep:var(--paper-deep);--rule:var(--paper-edge);--ff-display:var(--font-display);--ff-sans:var(--font-sans);--ff-mono:var(--font-mono);--night:var(--ink);--night-2:var(--ink-2);--accent-pale:rgba(225,31,28,0.08);}
  </style>
</head>
<body>
<div id="root">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#FAF6EC;">
    <div style="text-align:center;font-family:'Fraunces',serif;font-size:32px;color:#0E0E0C;letter-spacing:-0.02em;">Framing Vote</div>
  </div>
</div>

<script>
  (function(){
    var r=sessionStorage.redirect;
    delete sessionStorage.redirect;
    if(r&&r!==location.href){
      var u=new URL(r);
      history.replaceState(null,'',u.pathname+u.search+u.hash);
    }
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="env,react">
/* Framing Vote v2 — modern editorial collage */
const { useState, useEffect, useMemo, useRef } = React;

/* ── CONTENTFUL ── */
const SPACE='upaglixkbf42',TOKEN='H3fmoxO4StTBS-lRp_ULYaywbv3uM3C6WTG8o1M_PbU';
const BASE=`https://cdn.contentful.com/spaces/${SPACE}/environments/master`;
async function cfFetch(path){const r=await fetch(`${BASE}${path}&access_token=${TOKEN}`);if(!r.ok)throw new Error(r.status);return r.json();}
async function getEntries(ct,extra=''){return cfFetch(`/entries?content_type=${ct}${extra}`);}

/* ── RICH TEXT ── */
function rt(doc, assets){
  if(!doc||!doc.content)return'';
  const assetPool=assets||window.__fvAssets||[];
  const n=node=>{
    if(node.nodeType==='text'){
      let t=node.value;
      (node.marks||[]).forEach(m=>{
        if(m.type==='bold')t=`<strong>${t}</strong>`;
        if(m.type==='italic')t=`<em>${t}</em>`;
        if(m.type==='code')t=`<code>${t}</code>`;
      });
      return t;
    }
    const i=(node.content||[]).map(n).join('');
    switch(node.nodeType){
      case'paragraph':return`<p>${i}</p>`;
      case'heading-1':return`<h1>${i}</h1>`;
      case'heading-2':return`<h2>${i}</h2>`;
      case'heading-3':return`<h3>${i}</h3>`;
      case'unordered-list':return`<ul>${i}</ul>`;
      case'ordered-list':return`<ol>${i}</ol>`;
      case'list-item':return`<li>${i}</li>`;
      case'blockquote':return`<blockquote>${i}</blockquote>`;
      case'hr':return`<hr/>`;
      case'hyperlink':return`<a href="${node.data?.uri}" target="_blank" rel="noopener">${i}</a>`;
      case'embedded-entry-block':{
        const target=node.data?.target;
        const ct=target?.sys?.contentType?.sys?.id||target?.fields?.contentType;
        const fields=target?.fields||{};
        if(ct==='videoEmbed'||ct==='video'){
          const url=fields.url||fields.src||fields.embedUrl||'';
          const caption=fields.caption||fields.title||'';
          if(!url)return'';
          const isStream=/youtube|youtu\.be|vimeo/.test(url);
          const src=isStream?url.replace('watch?v=','embed/').replace('youtu.be/','www.youtube.com/embed/'):url;
          return`<div class="embed-breakout"><iframe class="embed-video" src="${src}" allowfullscreen loading="lazy" title="${caption}"></iframe>${caption?`<div class="embed-caption">${caption}</div>`:''}</div>`;
        }
        if(ct==='iframeEmbed'||ct==='iframe'||ct==='embed'||ct==='interactiveEmbed'||ct==='chartEmbed'||ct==='chart'||ct==='dataViz'){
          const url=fields.url||fields.src||fields.embedUrl||'';
          const caption=fields.caption||fields.label||fields.title||'';
          if(!url)return'';
          return`<div class="embed-breakout"><iframe class="embed-iframe" src="${url}" loading="lazy" title="${caption}"></iframe>${caption?`<div class="embed-caption">${caption}</div>`:''}</div>`;
        }
        return'';
      }
      case'embedded-asset-block':{
        const target=node.data?.target;
        const file=target?.fields?.file;
        const id=target?.sys?.id;
        const linked=assetPool.find(x=>x.sys?.id===id);
        const finalFile=file||linked?.fields?.file;
        if(!finalFile?.url)return'';
        const src=finalFile.url.startsWith('//')?'https:'+finalFile.url:finalFile.url.startsWith('http')?finalFile.url:'https:'+finalFile.url;
        const mime=finalFile.contentType||'';
        if(mime.startsWith('video/'))return`<div class="embed-breakout"><video controls playsinline class="embed-video"><source src="${src}" type="${mime}"></video></div>`;
        if(mime.startsWith('image/'))return`<div class="embed-breakout"><img src="${src}" class="embed-img" alt="${linked?.fields?.description||linked?.fields?.title||''}"/>${linked?.fields?.description?`<div class="embed-caption">${linked.fields.description}</div>`:''}</div>`;
        return'';
      }
      default:return i;
    }
  };
  return doc.content.map(node=>n(node)).join('');
}

function fmtDate(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});}
function fmtDateLong(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});}

/* ── ASSET HELPERS ── */
function resolveAsset(ref,assets){
  if(!ref)return null;
  if(ref?.fields?.file?.url)return ref;
  const id=ref?.sys?.id;
  if(id&&assets)return assets.find(x=>x.sys?.id===id)||null;
  return null;
}
function assetUrl(ref,assets,w=1200){
  const a=resolveAsset(ref,assets);
  const url=a?.fields?.file?.url;
  if(!url)return null;
  const base=url.startsWith('//')?url:'//'+url.replace(/^https?:\/\//,'');
  return'https:'+base+'?w='+w+'&fm=jpg&fl=progressive&q=80';
}
function assetAlt(ref,assets){
  const a=resolveAsset(ref,assets);
  return a?.fields?.description||a?.fields?.title||'';
}

/* ── CATEGORY / ISSUE HELPERS ── */
function getCategories(items){
  const cats=new Set();
  (items||[]).forEach(it=>{
    const c=it.category||it.categories;
    if(Array.isArray(c))c.forEach(x=>x&&cats.add(x));
    else if(c)cats.add(c);
  });
  return Array.from(cats).sort();
}
function matchesCategory(item,filter){
  if(!filter||filter==='All')return true;
  const c=item.category||item.categories;
  if(Array.isArray(c))return c.includes(filter);
  return c===filter;
}
function getArticleIssueId(a){return a?.issue?.sys?.id||a?.issueId||null;}
function articleBelongsToIssue(a,issueId){return getArticleIssueId(a)===issueId;}

/* ── RESOLVE CORRESPONDENT ── */
function resolveCorrespondent(ref,entryPool){
  if(!ref)return null;
  if(ref.fields)return{id:ref.sys?.id,...ref.fields};
  const id=ref?.sys?.id;
  if(!id)return null;
  const entry=(entryPool||[]).find(e=>e.sys?.id===id);
  if(!entry)return null;
  return{id:entry.sys.id,...entry.fields};
}

/* Numbered red circle with script caption + MAGNETIC interaction & quote popup */
function NumLabel({n,label,quote,style,labelAngle=-2,circleAngle=-4,size=34,alignCaption='left',magnetic=true}){
  const ref=useRef(null);
  const[open,setOpen]=useState(false);
  useEffect(()=>{
    if(!magnetic)return;
    const el=ref.current;if(!el)return;
    const circle=el.querySelector('.mag-num-circle');
    const onMove=(e)=>{
      const r=el.getBoundingClientRect();
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      const dx=e.clientX-cx,dy=e.clientY-cy;
      const d=Math.hypot(dx,dy);
      if(d<140){
        const k=(1-d/140)*0.45;
        circle.style.transform=`translate(${dx*k}px,${dy*k}px) rotate(${circleAngle}deg)`;
      }else{
        circle.style.transform=`rotate(${circleAngle}deg)`;
      }
    };
    window.addEventListener('mousemove',onMove);
    return()=>window.removeEventListener('mousemove',onMove);
  },[magnetic,circleAngle]);
  const handleClick=(e)=>{e.stopPropagation();if(quote)setOpen(o=>!o);};
  return (
    <div ref={ref} className={`mag-num${open?' open':''}`} onClick={handleClick} style={{display:'inline-flex',flexDirection:'column',gap:6,alignItems:alignCaption==='left'?'flex-start':alignCaption==='right'?'flex-end':'center',pointerEvents:'auto',position:'relative',...style}}>

/* ── CUSTOM CURSOR ── */
function CustomCursor({enabled=true}){
  useEffect(()=>{
    if(!enabled)return;
    if(window.matchMedia('(pointer:coarse)').matches)return;
    document.documentElement.classList.add('fv-cursor-on');
    const dot=document.createElement('div');dot.id='fv-cursor-dot';
    const ring=document.createElement('div');ring.id='fv-cursor-ring';
    document.body.appendChild(dot);document.body.appendChild(ring);
    let dx=window.innerWidth/2,dy=window.innerHeight/2;
    let rx=dx,ry=dy;
    const move=(e)=>{dx=e.clientX;dy=e.clientY;dot.style.left=dx+'px';dot.style.top=dy+'px';};
    let raf;
    const tick=()=>{rx+=(dx-rx)*0.2;ry+=(dy-ry)*0.2;ring.style.left=rx+'px';ring.style.top=ry+'px';raf=requestAnimationFrame(tick);};tick();
    const over=(e)=>{
      const t=e.target;
      if(!t||!t.closest)return;
      const isInteractive=t.closest('button, a, input, [role=button], .polaroid, .mag-num');
      if(isInteractive){ring.style.width='60px';ring.style.height='60px';ring.style.borderColor='var(--accent)';ring.style.background='rgba(122,31,31,0.06)';}
      else{ring.style.width='34px';ring.style.height='34px';ring.style.borderColor='var(--ink)';ring.style.background='transparent';}
    };
    const out=()=>{ring.style.opacity='0';dot.style.opacity='0';};
    const back=()=>{ring.style.opacity='1';dot.style.opacity='1';};
    document.addEventListener('mousemove',move);
    document.addEventListener('mouseover',over);
    document.addEventListener('mouseleave',out);
    document.addEventListener('mouseenter',back);
    return()=>{
      document.removeEventListener('mousemove',move);
      document.removeEventListener('mouseover',over);
      document.removeEventListener('mouseleave',out);
      document.removeEventListener('mouseenter',back);
      cancelAnimationFrame(raf);
      dot.remove();ring.remove();
      document.documentElement.classList.remove('fv-cursor-on');
    };
  },[enabled]);
  return null;
}

/* ── CYCLING WORD (hero verb morph) ── */
function CyclingWord({words,interval=2400,style}){
  const[i,setI]=useState(0);
  const[phase,setPhase]=useState('in');
  useEffect(()=>{
    const t=setInterval(()=>{
      setPhase('out');
      setTimeout(()=>{setI(x=>(x+1)%words.length);setPhase('in');},340);
    },interval);
    return()=>clearInterval(t);
  },[words.length,interval]);
  return (

  );
}

/* ── ROLLING COUNTER ── */
function Counter({to,duration=1400,suffix=''}){
  const[n,setN]=useState(0);
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current)return;
    const obs=new IntersectionObserver((entries)=>{
      entries.forEach(en=>{
        if(en.isIntersecting){
          const start=performance.now();
          const ease=(t)=>1-Math.pow(1-t,3);
          const step=(now)=>{
            const t=Math.min(1,(now-start)/duration);
            setN(Math.round(ease(t)*to));
            if(t<1)requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
          obs.disconnect();
        }
      });
    },{threshold:0.4});
    obs.observe(ref.current);
    return()=>obs.disconnect();
  },[to,duration]);
  return <span ref={ref} style={{fontVariantNumeric:'tabular-nums'}}>{n}{suffix}</span>;
}

/* Polaroid card — individual draggable/tiltable card */
function Polaroid({article,index,baseRotation=0,zIndex=1,onOpen}){
  const ref=useRef(null);
  const[drag,setDrag]=useState({active:false,startX:0,startY:0,rot:baseRotation});
  const[tilt,setTilt]=useState({x:0,y:0,active:false});
  useEffect(()=>{setDrag(d=>({...d,rot:baseRotation}));},[baseRotation]);
  const onPointerDown=(e)=>{
    setDrag(d=>({...d,active:true,startX:e.clientX,startY:e.clientY,startRot:d.rot}));
    ref.current?.setPointerCapture?.(e.pointerId);
  };
  const onPointerMove=(e)=>{
    if(drag.active){
      const dx=e.clientX-drag.startX;
      const dy=e.clientY-drag.startY;
      setDrag(d=>({...d,rot:(d.startRot||baseRotation)+dx*0.15,dragY:dy*0.5,dragX:dx*0.5}));
    }else{
      const r=ref.current?.getBoundingClientRect();if(!r)return;
      const cx=r.left+r.width/2,cy=r.top+r.height/2;
      setTilt({x:((e.clientY-cy)/r.height)*-14,y:((e.clientX-cx)/r.width)*14,active:true});
    }
  };
  const onPointerLeave=()=>{if(!drag.active)setTilt({x:0,y:0,active:false});};
  const onPointerUp=(e)=>{
    setDrag(d=>({...d,active:false,dragX:0,dragY:0,rot:baseRotation+(d.rot-baseRotation)*0.3}));
  };
  const transform=`perspective(900px) rotateX(${tilt.x}deg) rotateY(${tilt.y}deg) translate(${drag.dragX||0}px,${drag.dragY||0}px) rotate(${drag.rot}deg)`;
  return (
    <div ref={ref} className="polaroid" onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} onPointerLeave={onPointerLeave} onClick={()=>!drag.active&&onOpen?.(article)} style={{position:'relative',width:240,zIndex,transform,transition:drag.active?'none':'transform 360ms var(--ease)',transformStyle:'preserve-3d'}}>
      <div style={{display:'flex',justifyContent:'space-between',padding:'2px 4px 10px',fontFamily:'var(--font-sans)',fontSize:9.5,fontWeight:600,letterSpacing:'0.16em',textTransform:'uppercase',color:'var(--ink-3)'}}>
        <span>№{String(index).padStart(2,'0')}</span>
        <span style={{color:'var(--accent)'}}>{article.country||'WORLDWIDE'}</span>
      </div>
      <div className="halftone" style={{aspectRatio:'3/4',background:'var(--paper-deep)',marginBottom:14}}>
        <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:'12px',textAlign:'center',fontFamily:'var(--font-mono)',fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-3)',backgroundImage:'repeating-linear-gradient(135deg,transparent 0 14px,rgba(14,14,12,0.04) 14px 15px)'}}>{article.kicker||'editorial'}</div>
      </div>
      <div style={{fontFamily:'var(--font-didone)',fontWeight:400,fontSize:18,lineHeight:1.15,letterSpacing:'-0.01em',color:'var(--ink)',marginTop:8,minHeight:64}}>
        {article.title.length>62?article.title.slice(0,62)+'…':article.title}
      </div>
      <div style={{fontFamily:'var(--font-script)',color:'var(--accent)',fontSize:16,fontWeight:600,marginTop:6,transform:'rotate(-1deg)',display:'inline-block'}}>by {article.author}</div>
    </div>
  );
}

/* Scroll-reveal wrapper */
function Reveal({children,delay=0,as='div',className='',style}){
  const ref=useRef(null);
  const[seen,setSeen]=useState(false);
  useEffect(()=>{
    if(!ref.current||seen)return;
    const io=new IntersectionObserver((entries)=>{
      entries.forEach(en=>{if(en.isIntersecting){setSeen(true);io.disconnect();}});
    },{threshold:0.15});
    io.observe(ref.current);
    return()=>io.disconnect();
  },[seen]);
  const Tag=as;
  return <Tag ref={ref} className={`reveal${seen?' in':''}${delay?' reveal-delay-'+delay:''} ${className}`} style={style}>{children}</Tag>;
}

/* Halftone image w/ optional torn-paper outline (monochrome editorial) */
function HalftoneCutout({slotId,placeholder,imageUrl,style,shape='rect',outline='none',rotate=0}){
  /* outline: 'none' | 'ink' | 'accent' — a thin scribbled border behind the image */
  const showOutline = outline !== 'none';
  const outlineColor = outline === 'accent' ? 'var(--accent)' : 'var(--ink)';
  return (
    <div style={{position:'relative',transform:rotate?`rotate(${rotate}deg)`:'none',...style}}>
      {showOutline && (
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style={{position:'absolute',inset:'-4% -4% -2% -2%',width:'108%',height:'106%',zIndex:1,pointerEvents:'none'}} aria-hidden>
          {shape==='blob'?
            <path d={SHAPES.blob} fill="none" stroke={outlineColor} strokeWidth="1" strokeDasharray="3 2"/> :
            shape==='rect'?
            <path d={SHAPES.rect} fill="none" stroke={outlineColor} strokeWidth="1"/> :
            <rect x="2" y="2" width="96" height="96" rx="2" fill="none" stroke={outlineColor} strokeWidth="1"/>
          }
        </svg>
      )}
      <div className="halftone" style={{position:'relative',zIndex:2,width:'100%',height:'100%',background:'var(--paper-deep)',overflow:'hidden'}}>
        {imageUrl?(
          <img src={imageUrl} alt={placeholder||''} loading="lazy" style={{width:'100%',height:'100%',objectFit:'contain',transform:'scale(0.9)',display:'block'}}/>
        ):(
          <div style={{width:'100%',height:'100%',background:'var(--paper-deep)',display:'flex',alignItems:'center',justifyContent:'center',padding:'12px',textAlign:'center',fontFamily:'var(--font-mono)',fontSize:'10px',letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--ink-3)',backgroundImage:'repeating-linear-gradient(135deg,transparent 0 14px,rgba(14,14,12,0.04) 14px 15px)'}}>{placeholder}</div>
        )}
      </div>
    </div>
  );
}

/* Big year display like Vogue's "2023" with year list */
function BigYear({current=2026,years}){
  const list = years || [2022,2023,2024,2025,2026,2027,2028];

        ))}

/* ── READING PROGRESS ── */
function ReadingProgress(){
  const[p,setP]=useState(0);
  useEffect(()=>{const f=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;setP(m>0?Math.min(1,h.scrollTop/m):0);};window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  return <div className="progress" style={{transform:`scaleX(${p})`}}/>;
}

/* ── HEADER ── */

  const[menuOpen,setMenuOpen]=useState(false);
  useEffect(()=>{const f=()=>setScrolled(window.scrollY>8);window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  useEffect(()=>{if(menuOpen)document.body.style.overflow='hidden';else document.body.style.overflow='';},[menuOpen]);
  return (
    <header style={{position:'sticky',top:0,zIndex:50,background:scrolled?'rgba(250,246,236,0.94)':'var(--paper)',backdropFilter:scrolled?'saturate(140%) blur(14px)':'none',WebkitBackdropFilter:scrolled?'saturate(140%) blur(14px)':'none',borderBottom:scrolled?'1px solid var(--paper-edge)':'1px solid transparent',transition:'all 200ms'}}>
      <div style={{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px clamp(16px,3vw,48px)',gap:24}}>
        <button onClick={()=>{setRoute('home');setMenuOpen(false);}}><FVWordmark size={20}/></button>
        <nav style={{display:'flex',alignItems:'center',gap:2}} className="hide-md">
          {links.map(([k,label])=>(
            <button key={k} onClick={()=>setRoute(k)} style={{padding:'10px 14px',fontFamily:'var(--font-sans)',fontSize:12,fontWeight:600,letterSpacing:'0.14em',textTransform:'uppercase',color:route===k?'var(--ink)':'var(--ink-3)',position:'relative',transition:'color 140ms'}} onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.color=route===k?'var(--ink)':'var(--ink-3)'}>
              {label}
              {route===k&&<span style={{position:'absolute',left:'50%',bottom:3,transform:'translateX(-50%)',width:20,height:3,background:'var(--accent)'}}/>}
            </button>

        </nav>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span className="mono hide-md" style={{fontSize:10.5}}>Issue №{String(settings?.issueNumber||1).padStart(2,'0')} · Spring '26</span>
          <button className="btn hide-md" style={{padding:'10px 16px',fontSize:10.5}} onClick={()=>document.getElementById('fv-newsletter')?.scrollIntoView({behavior:'smooth'})}>
            Subscribe <span className="arrow">→</span>
          </button>
          {/* Mobile hamburger - shown via CSS .show-mobile class */}
          <button onClick={()=>setMenuOpen(o=>!o)} className="show-mobile" aria-label="Menu" style={{flexDirection:'column',gap:5,padding:'8px',background:'transparent',border:0,cursor:'pointer'}}>
            <span style={{display:'block',width:22,height:2,background:'var(--ink)',transition:'all 200ms',transform:menuOpen?'rotate(45deg) translate(5px,5px)':'none'}}/>
            <span style={{display:'block',width:22,height:2,background:'var(--ink)',transition:'all 200ms',opacity:menuOpen?0:1}}/>
            <span style={{display:'block',width:22,height:2,background:'var(--ink)',transition:'all 200ms',transform:menuOpen?'rotate(-45deg) translate(5px,-5px)':'none'}}/>
          </button>
        </div>
      </div>
      {/* Mobile menu overlay */}
      {menuOpen&&(
        <div style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'var(--paper)',zIndex:49,display:'flex',flexDirection:'column',padding:'80px 24px 40px',gap:0}}>
          <button onClick={()=>setMenuOpen(false)} style={{position:'absolute',top:20,right:20,fontFamily:'var(--font-mono)',fontSize:20,color:'var(--ink-3)',background:'none',border:0,cursor:'pointer'}}>×</button>
          {links.map(([k,label])=>(
            <button key={k} onClick={()=>{setRoute(k);setMenuOpen(false);}} style={{padding:'20px 0',fontFamily:'var(--font-display)',fontSize:'clamp(32px,8vw,52px)',fontWeight:600,letterSpacing:'-0.025em',color:route===k?'var(--accent)':'var(--ink)',textAlign:'left',borderBottom:'1px solid var(--paper-edge)',background:'none',border:0,borderBottom:'1px solid var(--paper-edge)',cursor:'pointer',display:'block',width:'100%'}}>

          ))}
          <button className="btn btn-red" style={{marginTop:32,alignSelf:'flex-start'}} onClick={()=>{setMenuOpen(false);document.getElementById('fv-newsletter')?.scrollIntoView({behavior:'smooth'});}}>

/* ── SCRIPTED HTML (executes embedded scripts after render) ── */
function ScriptedHTML({html,className,style}){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    if(!ref.current||!html)return;
    ref.current.innerHTML=html;
    ref.current.querySelectorAll('script').forEach(old=>{
      const s=document.createElement('script');
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      document.body.appendChild(s);
    });
  },[html]);
  return<div ref={ref} className={className} style={style}/>;
}

  const displayed=[...issues].sort((a,b)=>(b.number||0)-(a.number||0)).slice(0,4);
  return(
    <section style={{padding:'clamp(48px,6vw,96px) 0',background:'var(--paper-deep)',borderTop:'1px solid var(--paper-edge)',borderBottom:'1px solid var(--paper-edge)'}}>
      <div className="wrap">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:20,borderBottom:'1px solid var(--paper-edge)',marginBottom:32,flexWrap:'wrap',gap:16}}>
          <span className="eyebrow eyebrow-accent">Issues of the journal</span>
          <button onClick={()=>setCurrentIssue('journal')} style={{fontFamily:'var(--font-mono)',fontSize:11,color:'var(--ink-3)',display:'inline-flex',alignItems:'center',gap:7,background:'none',border:0,cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.color='var(--accent)'} onMouseLeave={e=>e.currentTarget.style.color='var(--ink-3)'}>All issues <span>→</span></button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:1,background:'var(--paper-edge)',border:'1px solid var(--paper-edge)',overflow:'hidden'}}>
          {displayed.map(issue=>{
            const issueArticles=(articles||[]).filter(a=>articleBelongsToIssue(a,issue.id));
            const cover=assetUrl(issue.coverImage||issue.profile,assets,800);
            return(
              <button key={issue.id} onClick={()=>setCurrentIssue(issue)} style={{background:'var(--paper-deep)',cursor:'pointer',padding:0,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden',textAlign:'left',transition:'background 200ms'}} onMouseEnter={e=>e.currentTarget.style.background='var(--paper)'} onMouseLeave={e=>e.currentTarget.style.background='var(--paper-deep)'}>
                <div style={{fontFamily:'var(--font-didone)',fontStyle:'italic',fontSize:88,fontWeight:700,lineHeight:0.85,letterSpacing:'-0.04em',color:'var(--ink)',opacity:0.07,position:'absolute',right:16,top:12,pointerEvents:'none'}}>{String(issue.number||'').padStart(2,'0')}</div>
                {cover&&<div style={{width:'100%',aspectRatio:'16/7',overflow:'hidden',background:'var(--paper-edge)',flexShrink:0}}><img src={cover} alt={issue.title||''} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/></div>}
                <div style={{padding:'28px 32px 32px',display:'flex',flexDirection:'column',gap:8,flex:1}}>
                  <div className="mono" style={{color:'var(--ink-3)'}}>Issue №{String(issue.number||'').padStart(2,'0')}{issue.season?' · '+issue.season:''}</div>
                  <div style={{fontFamily:'var(--font-display)',fontSize:'clamp(20px,2.2vw,28px)',fontWeight:600,letterSpacing:'-0.02em',lineHeight:1.05,color:'var(--ink)'}}>{issue.title}</div>
                  {issue.coverline&&<p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:15,lineHeight:1.4,color:'var(--ink-3)',margin:0}}>{issue.coverline}</p>}
                  <div className="mono" style={{marginTop:8,color:'var(--ink-3)'}}>{issueArticles.length} {issueArticles.length===1?'essay':'essays'} <span style={{color:'var(--accent)'}}>→</span></div>
                </div>
              </button>
            );
          })}
        </div>
      </div>
    </section>
  );
}

/* ── ISSUE LIST VIEW ── */
function IssueView({issues,articles,assets,setCurrentIssue}){
  const sorted=(issues||[]).slice().sort((a,b)=>(b.number||0)-(a.number||0));
  return(
    <section className="fade-in" style={{padding:'56px 0 96px'}}>
      <div className="wrap">
        <div style={{paddingBottom:32,borderBottom:'2px solid var(--ink)',display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:24}}>
          <div>
            <div className="eyebrow eyebrow-accent" style={{marginBottom:14}}>The journal</div>
            <h1 className="display" style={{fontSize:'clamp(40px,6vw,88px)',margin:0,maxWidth:900}}>
              {sorted.length===0?<>First issue <em>coming.</em></>:<>{sorted.length} {sorted.length===1?'issue':'issues'}, <em>in print.</em></>}
            </h1>
          </div>
        </div>
        {sorted.length===0?(
          <div className="empty-state"><div className="empty-glyph">§</div><p className="empty-msg">The first issue is in preparation.</p></div>
        ):(
          <div style={{marginTop:40,display:'flex',flexDirection:'column',gap:0,border:'1px solid var(--paper-edge)',overflow:'hidden'}}>
            {sorted.map((issue,idx)=>{
              const issueArticles=(articles||[]).filter(a=>articleBelongsToIssue(a,issue.id));
              const cover=assetUrl(issue.coverImage||issue.profile,assets,640);
              return(
                <button key={issue.id} onClick={()=>setCurrentIssue(issue)} style={{textAlign:'left',background:idx%2===0?'var(--paper)':'var(--paper-deep)',borderTop:idx>0?'1px solid var(--paper-edge)':'none',display:'grid',gridTemplateColumns:cover?'200px 1fr':'1fr',gap:0,transition:'background 200ms',overflow:'hidden'}} onMouseEnter={e=>e.currentTarget.style.background='var(--paper-soft)'} onMouseLeave={e=>e.currentTarget.style.background=idx%2===0?'var(--paper)':'var(--paper-deep)'}>
                  {cover&&<div style={{aspectRatio:'4/3',overflow:'hidden',background:'var(--paper-deep)',flexShrink:0}}><img src={cover} alt={issue.title||''} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/></div>}
                  <div style={{padding:'32px 40px',display:'flex',flexDirection:'column',gap:10,flex:1}}>
                    <div className="mono" style={{color:'var(--ink-3)'}}>Issue №{String(issue.number||idx+1).padStart(2,'0')}{issue.season?' · '+issue.season:''}</div>
                    <div style={{fontFamily:'var(--font-display)',fontSize:'clamp(24px,3vw,42px)',fontWeight:600,letterSpacing:'-0.025em',lineHeight:1.0,color:'var(--ink)'}}>{issue.title}</div>
                    {issue.coverline&&<p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:17,lineHeight:1.4,color:'var(--ink-3)',margin:0}}>{issue.coverline}</p>}
                    <div style={{marginTop:'auto',display:'flex',alignItems:'center',justifyContent:'space-between',paddingTop:16,borderTop:'1px solid var(--paper-edge)'}}>
                      <span className="mono" style={{color:'var(--ink-3)'}}>{issueArticles.length} {issueArticles.length===1?'essay':'essays'}</span>
                      <span className="mono" style={{color:'var(--accent)'}}>Read issue →</span>
                    </div>
                  </div>
                </button>
              );
            })}
          </div>
        )}
      </div>
    </section>
  );
}

/* ── ISSUE DETAIL VIEW ── */
function IssueDetailView({issue,issues,articles,about,assets,setCurrentArticle,setCurrentIssue}){
  if(!issue)return null;
  const issueArticles=(articles||[]).filter(a=>articleBelongsToIssue(a,issue.id));
  const cover=assetUrl(issue.coverImage||issue.profile,assets,1400);
  const otherIssues=(issues||[]).filter(i=>i.id!==issue.id).sort((a,b)=>(b.number||0)-(a.number||0)).slice(0,2);
  return(
    <section className="fade-in">
      <div style={{position:'relative',overflow:'hidden',padding:'72px 0 64px',borderBottom:'1px solid var(--paper-edge)',background:'var(--paper)'}}>
        {cover&&(
          <div style={{position:'absolute',inset:0,zIndex:0}}>
            <img src={cover} alt={issue.title||''} style={{width:'100%',height:'100%',objectFit:'cover',display:'block',opacity:0.1}}/>
            <div style={{position:'absolute',inset:0,background:'linear-gradient(to bottom,var(--paper) 0%,rgba(252,251,247,0.6) 50%,var(--paper) 100%)'}}/>
          </div>
        )}
        <div className="wrap" style={{position:'relative',zIndex:1}}>
          <button className="issue-breadcrumb" onClick={()=>setCurrentIssue('list')}><span>←</span><span>All issues</span></button>
          <div style={{display:'flex',alignItems:'flex-start',gap:40,flexWrap:'wrap'}}>
            <div style={{flex:1}}>
              <div className="mono" style={{color:'var(--ink-3)',marginBottom:16}}>Issue №{String(issue.number||'').padStart(2,'0')}{issue.season?' · '+issue.season:''}</div>
              <h1 className="display" style={{fontSize:'clamp(48px,7.5vw,108px)',margin:0}}>{issue.title}</h1>
              {issue.coverline&&<p style={{fontFamily:'var(--font-serif)',fontStyle:'italic',fontSize:'clamp(17px,2vw,24px)',lineHeight:1.4,color:'var(--ink-2)',marginTop:20,maxWidth:600}}>{issue.coverline}</p>}
              <div style={{display:'flex',alignItems:'center',gap:24,marginTop:32,paddingTop:24,borderTop:'1px solid var(--paper-edge)',flexWrap:'wrap'}}>
                <span className="mono" style={{color:'var(--ink-3)'}}>{issueArticles.length} {issueArticles.length===1?'essay':'essays'}</span>
                {issue.publishDate&&<><span style={{width:3,height:3,borderRadius:'50%',background:'var(--ink-4)',display:'inline-block'}}/><span className="mono" style={{color:'var(--ink-3)'}}>{fmtDate(issue.publishDate)}</span></>}
              </div>
            </div>
            {cover&&<div style={{flexShrink:0,width:'clamp(160px,20vw,280px)',overflow:'hidden',boxShadow:'0 8px 32px rgba(14,14,12,0.18)'}}><img src={cover} alt={issue.title||''} style={{width:'100%',aspectRatio:'3/4',objectFit:'cover',display:'block'}}/></div>}
          </div>
        </div>
      </div>
      <div style={{padding:'64px 0 80px',background:'var(--paper)'}}>
        <div className="wrap">
          {issueArticles.length===0?(
            <div className="empty-state"><div className="empty-glyph">§</div><p className="empty-msg">Essays coming soon.</p></div>
          ):(
            <>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:20,borderBottom:'1px solid var(--paper-edge)',marginBottom:0}}>
                <span className="eyebrow eyebrow-accent">Essays in this issue</span>
                <span className="mono" style={{color:'var(--ink-3)'}}>{issueArticles.length} pieces</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:1,background:'var(--paper-edge)',border:'1px solid var(--paper-edge)',borderTop:'none',overflow:'hidden'}}>
                {issueArticles.map((a,i)=>{
                  const thumb=assetUrl(a.profile,assets,640)||a.coverImageUrl;
                  return(
                    <button key={a.id} onClick={()=>setCurrentArticle(a)} style={{textAlign:'left',background:'var(--paper)',display:'flex',flexDirection:'column',transition:'background 200ms',overflow:'hidden',cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.background='var(--paper-deep)'} onMouseLeave={e=>e.currentTarget.style.background='var(--paper)'}>
                      {thumb
                        ?<div style={{width:'100%',aspectRatio:'16/9',overflow:'hidden',background:'var(--paper-deep)',flexShrink:0}}><img src={thumb} alt={a.title||''} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/></div>
                        :<div style={{width:'100%',aspectRatio:'16/9',background:'var(--paper-deep)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontFamily:'var(--font-didone)',fontStyle:'italic',fontSize:56,color:'var(--ink)',opacity:0.08}}>{a.glyph||'§'}</span></div>}
                      <div style={{padding:'24px 28px 28px',display:'flex',flexDirection:'column',gap:8,flex:1}}>
                        {a.kicker&&<div className="eyebrow eyebrow-accent">{a.kicker}</div>}

                        {a.subtitle&&<p style={{fontFamily:'var(--font-serif)',fontSize:14,lineHeight:1.5,color:'var(--ink-3)',margin:0}}>{a.subtitle}</p>}

                          <span className="mono" style={{color:'var(--accent)'}}>Read →</span>
                        </div>
                      </div>
                    </button>

                })}
              </div>
            </>
          )}
        </div>
      </div>
      {otherIssues.length>0&&(
        <div style={{padding:'56px 0 80px',background:'var(--paper-deep)',borderTop:'1px solid var(--paper-edge)'}}>
          <div className="wrap">
            <div className="eyebrow eyebrow-accent" style={{marginBottom:20}}>Other issues</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:1,background:'var(--paper-edge)',border:'1px solid var(--paper-edge)',overflow:'hidden'}}>
              {otherIssues.map(oi=>{
                const oCover=assetUrl(oi.coverImage||oi.profile,assets,400)||oi.coverImageUrl;
                const oArts=(articles||[]).filter(a=>articleBelongsToIssue(a,oi.id));
                return(
                  <button key={oi.id} style={{textAlign:'left',background:'var(--paper-deep)',display:'flex',gap:20,padding:28,transition:'background 200ms',alignItems:'flex-start',cursor:'pointer'}} onClick={()=>setCurrentIssue(oi)} onMouseEnter={e=>e.currentTarget.style.background='var(--paper)'} onMouseLeave={e=>e.currentTarget.style.background='var(--paper-deep)'}>
                    {oCover&&<div style={{width:64,flexShrink:0,overflow:'hidden'}}><img src={oCover} alt={oi.title||''} style={{width:'100%',aspectRatio:'2/3',objectFit:'cover',display:'block'}}/></div>}
                    <div>
                      <div className="mono" style={{color:'var(--ink-3)',marginBottom:8}}>Issue №{String(oi.number||'').padStart(2,'0')}{oi.season?' · '+oi.season:''}</div>
                      <div style={{fontFamily:'var(--font-display)',fontSize:20,fontWeight:600,letterSpacing:'-0.01em',lineHeight:1.1,color:'var(--ink)'}}>{oi.title}</div>
                      <div className="mono" style={{color:'var(--ink-3)',marginTop:8}}>{oArts.length} {oArts.length===1?'essay':'essays'}</div>

                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

/* ── APP ── */
function App(){
  const[route,setRouteRaw]=useState(getInitialRoute);
  const[articles,setArticles]=useState([]);
  const[news,setNews]=useState([]);
  const[issues,setIssues]=useState([]);
  const[settings,setSettings]=useState(null);
  const[about,setAbout]=useState(null);
  const[assets,setAssets]=useState([]);
  const[entryPool,setEntryPool]=useState([]);
  const[currentArticle,setCurrentArticle]=useState(null);
  const[currentNews,setCurrentNews]=useState(null);
  const[currentIssue,setCurrentIssue]=useState(null);
  const[loading,setLoading]=useState(true);

  const setRoute=r=>{const path=ROUTE_TO_PATH[r];if(path)history.pushState({route:r},'',path);setRouteRaw(r);};

  useEffect(()=>{window.scrollTo(0,0);},[route]);

  useEffect(()=>{
    const onPop=()=>{
      const st=window.history.state;const p=window.location.pathname;
      if(st?.route==='article'&&st?.id){const a=(articles||[]).find(x=>x.id===st.id);if(a){setCurrentArticle(a);setRouteRaw('article');return;}}
      if(st?.route==='newsArticle'&&st?.id){const n=(news||[]).find(x=>x.id===st.id);if(n){setCurrentNews(n);setRouteRaw('newsArticle');return;}}
      if(st?.route==='journalDetail'&&st?.id){const i=(issues||[]).find(x=>x.id===st.id);if(i){setCurrentIssue(i);setRouteRaw('journalDetail');return;}}
      setRouteRaw(PATH_TO_ROUTE[p]||'home');
    };
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[articles,news,issues]);

  useEffect(()=>{
    let cancelled=false;

    /* Build flat asset pool from all response includes */
    const buildAssetPool=(...responses)=>{
      const seen=new Set();const pool=[];
      responses.forEach(r=>{(r?.includes?.Asset||[]).forEach(a=>{if(!seen.has(a.sys.id)){seen.add(a.sys.id);pool.push(a);}});});
      return pool;
    };

    /* Enrich item: resolve coverImageUrl from included assets */
    const enrichItem=(item,pool)=>{
      const f={...item.fields};
      const tryFields=['profile','coverImage','image','featuredImage','heroImage','photo','mainImage','cover','thumbnail','media'];
      for(const k of tryFields){
        const url=assetUrl(f[k],pool);
        if(url){f.coverImageUrl=url;break;}
      }
      return{id:item.sys.id,...f};
    };

    async function load(){
      try{
        const[aR,sR,abR,nR,iR]=await Promise.all([
          getEntries('articlePost','&order=-fields.publishDate&include=10').catch(()=>({items:[],includes:{}})),
          getEntries('settings','&include=2').catch(()=>({items:[],includes:{}})),
          getEntries('about','&include=2').catch(()=>({items:[],includes:{}})),
          getEntries('news','&order=-fields.publishDate&include=10').catch(()=>({items:[],includes:{}})),
          getEntries('issue','&order=-fields.number&include=2').catch(()=>({items:[],includes:{}})),
        ]);
        if(cancelled)return;

        const allAssets=buildAssetPool(aR,sR,abR,nR,iR);
        setAssets(allAssets);
        window.__fvAssets=allAssets;

        const seenE=new Set();
        const allEntries=[...(aR.includes?.Entry||[]),...(abR.includes?.Entry||[]),...(iR.includes?.Entry||[])].filter(e=>{if(seenE.has(e.sys.id))return false;seenE.add(e.sys.id);return true;});
        setEntryPool(allEntries);

        const arts=(aR.items||[]).map(i=>enrichItem(i,allAssets));
        const newsItems=(nR.items||[]).map(i=>enrichItem(i,allAssets));
        const issueItems=(iR.items||[]).map(i=>enrichItem(i,allAssets));

        setArticles(arts.length?arts:SAMPLE_ARTICLES);
        setNews(newsItems.length?newsItems:SAMPLE_NEWS);
        setIssues(issueItems);
        setSettings(sR.items?.length?{...sR.items[0].fields}:SAMPLE_SETTINGS);
        setAbout(abR.items?.length?enrichItem(abR.items[0],allAssets):SAMPLE_ABOUT);
      }catch(e){
        if(cancelled)return;
        console.warn('CF unreachable, using sample data',e);
        setArticles(SAMPLE_ARTICLES);setNews(SAMPLE_NEWS);
        setSettings(SAMPLE_SETTINGS);setAbout(SAMPLE_ABOUT);
      }finally{if(!cancelled)setLoading(false);}
    }
    const timer=setTimeout(()=>{
      if(cancelled)return;
      setArticles(prev=>prev.length?prev:SAMPLE_ARTICLES);
      setNews(prev=>prev.length?prev:SAMPLE_NEWS);
      setSettings(prev=>prev||SAMPLE_SETTINGS);
      setAbout(prev=>prev||SAMPLE_ABOUT);
      setLoading(false);
    },2500);
    load();
    return()=>{cancelled=true;clearTimeout(timer);};
  },[]);

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--paper)'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16}}>
        <FVWordmark size={36}/>
        <div className="mono" style={{color:'var(--accent)'}}>● Loading</div>
      </div>
    </div>
  );

  const openArticle=(a)=>{history.pushState({route:'article',id:a.id},'',`/archive/${a.slug||a.id}`);setCurrentArticle(a);setRouteRaw('article');};
  const openNews=(n)=>{history.pushState({route:'newsArticle',id:n.id},'',`/dispatches/${n.slug||n.id}`);setCurrentNews(n);setRouteRaw('newsArticle');};
  const openIssue=(i)=>{
    if(i==='list'||i==='journal'){history.pushState({route:'journal'},'','/journal');setRouteRaw('journal');return;}
    history.pushState({route:'journalDetail',id:i.id},'',`/journal/${i.number||i.id}`);setCurrentIssue(i);setRouteRaw('journalDetail');
  };

  const props={articles,news,issues,settings,about,assets,entryPool,route,setRoute,
    setCurrentArticle:openArticle,setCurrentNews:openNews,setCurrentIssue:openIssue,currentIssue};

  return(
    <div className="page" data-screen-label={`Framing Vote · ${route}`}>
      <Header route={route} setRoute={setRoute} settings={settings}/>
      <main style={{flex:1}}>
        {route==='home'         ?<HomeView {...props}/>:null}
        {route==='article'      ?<ArticleView article={currentArticle} about={about} assets={assets} setRoute={setRoute} articles={articles} setCurrentArticle={openArticle}/>:null}
        {route==='archive'      ?<ArchiveView {...props}/>:null}
        {route==='news'         ?<NewsView {...props}/>:null}
        {route==='newsArticle'  ?<NewsArticleView item={currentNews} about={about} assets={assets} setRoute={setRoute}/>:null}
        {route==='about'        ?<AboutView about={about} assets={assets} entryPool={entryPool}/>:null}
        {route==='submit'       ?<SubmitView about={about}/>:null}
        {route==='journal'      ?<IssueView issues={issues} articles={articles} assets={assets} setCurrentIssue={openIssue}/>:null}
        {route==='journalDetail'?<IssueDetailView issue={currentIssue} issues={issues} articles={articles} about={about} assets={assets} setCurrentArticle={openArticle} setCurrentIssue={openIssue}/>:null}
      </main>
      <Newsletter/>
      <Footer setRoute={setRoute} settings={settings} about={about}/>
      <PageNav/>
      <CommandPalette articles={articles} news={news} setRoute={setRoute} setCurrentArticle={openArticle} setCurrentNews={openNews}/>
      <AskTheEditor/>
      <CustomCursor enabled={true}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
