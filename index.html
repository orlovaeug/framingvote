<div id="root">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ── CONTENTFUL CONFIG ── */
const SPACE='upaglixkbf42', TOKEN='H3fmoxO4StTBS-lRp_ULYaywbv3uM3C6WTG8o1M_PbU';
const BASE=`https://cdn.contentful.com/spaces/${SPACE}/environments/master`;
async function cfFetch(p){const r=await fetch(`${BASE}${p}&access_token=${TOKEN}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}
async function getEntries(ct,extra=''){return cfFetch(`/entries?content_type=${ct}${extra}`);}

/* ── RICH TEXT RENDERER ── */
function rt(doc, assets){
  if(!doc||!doc.content)return'';
  const assetPool = assets || window.__fvAssets || [];
  const n=node=>{
    if(node.nodeType==='text'){
      let t=node.value;
      (node.marks||[]).forEach(m=>{
        if(m.type==='bold')t=`<strong>${t}</strong>`;
        if(m.type==='italic')t=`<em>${t}</em>`;
        if(m.type==='code')t=`<code>${t}</code>`;
      });
      return t;
    }
    const i=(node.content||[]).map(n).join('');
    switch(node.nodeType){
      case'paragraph':return`<p>${i}</p>`;
      case'heading-1':return`<h1>${i}</h1>`;
      case'heading-2':return`<h2>${i}</h2>`;
      case'heading-3':return`<h3>${i}</h3>`;
      case'unordered-list':return`<ul>${i}</ul>`;
      case'ordered-list':return`<ol>${i}</ol>`;
      case'list-item':return`<li>${i}</li>`;
      case'blockquote':return`<blockquote>${i}</blockquote>`;
      case'hr':return`<hr/>`;
      case'hyperlink':return`<a href="${node.data?.uri}" target="_blank" rel="noopener">${i}</a>`;
      case'embedded-entry-block':{
        const target=node.data?.target;
        const ct=target?.sys?.contentType?.sys?.id||target?.fields?.contentType;
        const fields=target?.fields||{};
        if(ct==='videoEmbed'||ct==='video'){
          const url=fields.url||fields.src||fields.embedUrl||'';
          const caption=fields.caption||fields.title||'';
          if(!url)return'';
          const isStream=/youtube|youtu\.be|vimeo/.test(url);
          const src=isStream?url.replace('watch?v=','embed/').replace('youtu.be/','www.youtube.com/embed/'):url;
          return`<div class="embed-breakout"><iframe class="embed-video" src="${src}" allowfullscreen loading="lazy" title="${caption}"></iframe>${caption?`<div class="embed-caption">${caption}</div>`:''}</div>`;
        }
        if(ct==='iframeEmbed'||ct==='iframe'||ct==='embed'||ct==='interactiveEmbed'||ct==='chartEmbed'||ct==='chart'||ct==='dataViz'){
          const url=fields.url||fields.src||fields.embedUrl||'';
          const caption=fields.caption||fields.label||fields.title||'';
          if(!url)return'';
          return`<div class="embed-breakout"><iframe class="embed-iframe" src="${url}" loading="lazy" title="${caption}"></iframe>${caption?`<div class="embed-caption">${caption}</div>`:''}</div>`;
        }
        return'';
      }
      case'embedded-asset-block':{
        const target=node.data?.target;
        const file=target?.fields?.file;
        const id=target?.sys?.id;
        const linked=assetPool.find(x=>x.sys?.id===id);
        const finalFile=file||linked?.fields?.file;
        if(!finalFile?.url)return'';
        const src=finalFile.url.startsWith('//')?'https:'+finalFile.url:finalFile.url.startsWith('http')?finalFile.url:'https:'+finalFile.url;
        const mime=finalFile.contentType||'';
        if(mime.startsWith('video/'))return`<div class="embed-breakout"><video controls playsinline class="embed-video"><source src="${src}" type="${mime}"></video></div>`;
        if(mime.startsWith('image/'))return`<div class="embed-breakout"><img src="${src}" class="embed-img" alt="${linked?.fields?.description||linked?.fields?.title||''}"/>${linked?.fields?.description?`<div class="embed-caption">${linked.fields.description}</div>`:''}</div>`;
        return'';
      }
      default:return i;
    }
  };
  return doc.content.map(node=>n(node)).join('');
}

/* ── HELPERS ── */
function fmtDate(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});}
function fmtDateLong(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});}

function resolveAsset(ref,assets){
  if(!ref)return null;
  if(ref?.fields?.file?.url)return ref;
  const id=ref?.sys?.id;
  if(id&&assets)return assets.find(x=>x.sys?.id===id)||null;
  return null;
}
function assetUrl(ref,assets,w=1200){
  const a=resolveAsset(ref,assets);
  const url=a?.fields?.file?.url;
  if(!url)return null;
  const base=url.startsWith('//')?url:'//'+url.replace(/^https?:\/\//,'');
  return'https:'+base+'?w='+w+'&fm=jpg&fl=progressive&q=80';
}
function assetAlt(ref,assets){
  const a=resolveAsset(ref,assets);
  return a?.fields?.description||a?.fields?.title||'';
}

/* ── FIXED: getCategories ── this was the bug that broke the site */
function getCategories(items){
  const cats=new Set();
  (items||[]).forEach(it=>{
    const c=it.category||it.categories;
    if(Array.isArray(c))c.forEach(x=>x&&cats.add(x));
    else if(c)cats.add(c);
  });
  return Array.from(cats).sort();
}

function matchesCategory(item,filter){
  if(!filter||filter==='All')return true;
  const c=item.category||item.categories;
  if(Array.isArray(c))return c.includes(filter);
  return c===filter;
}

function getArticleIssueId(a){return a?.issue?.sys?.id||a?.issueId||null;}
function articleBelongsToIssue(a,issueId){return getArticleIssueId(a)===issueId;}

/* ── RESOLVE CORRESPONDENT ──
   Handles the case where team members come as resolved entries (fields inline)
   OR as unresolved links {sys:{id}} that need looking up in the entry pool.
*/
function resolveCorrespondent(ref, entryPool){
  if(!ref)return null;
  // Already fully resolved — has fields directly
  if(ref.fields) return { id: ref.sys?.id, ...ref.fields };
  // It's a link — look it up in the pool
  const id = ref?.sys?.id;
  if(!id)return null;
  const entry = (entryPool||[]).find(e=>e.sys?.id===id);
  if(!entry)return null;
  return { id: entry.sys.id, ...entry.fields };
}

/* ── COMPONENTS ── */
function Mark({size=28}){
  return(
    <span style={{display:'inline-block',width:size,height:size,background:'var(--accent)',borderRadius:Math.round(size*0.15),flexShrink:0}}>
      <svg width={size} height={size} viewBox="0 0 28 28">
        <path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </span>
  );
}

function ReadingProgress(){
  const[p,setP]=useState(0);
  useEffect(()=>{
    const f=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;setP(m>0?Math.min(1,h.scrollTop/m):0);};
    window.addEventListener('scroll',f);f();
    return()=>window.removeEventListener('scroll',f);
  },[]);
  return<div id="progress" style={{transform:`scaleX(${p})`}}/>;
}

function Header({activeNav,navigate}){
  const links=[['home','Front','/'],['journal','Journal','/journal'],['news','Dispatches','/dispatches'],['about','About','/about'],['submit','Pitch us','/submit']];
  const[scrolled,setScrolled]=useState(false);

    const f=()=>setScrolled(window.scrollY>8);

  return(
    <header className={scrolled?'scrolled':''}>

            <svg width="14" height="14" viewBox="0 0 28 28"><path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" strokeWidth="2.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </span>
          Framing Vote
        </button>

          {links.map(([k,label,path])=>(
            <button key={k} onClick={()=>navigate(path)} className={`nav-btn${activeNav===k?' active':''}`}>{label}</button>
          ))}

        <button className="btn-cta" onClick={()=>document.getElementById('fv-nl')?.scrollIntoView({behavior:'smooth'})}>
          Subscribe <span className="mono-arrow">→</span>
        </button>

}

function CategoryChip({cat,onClick,active=false,dark=false}){

}
function CategoryChips({item,onClick,dark=false}){

function DispatchRail({news,assets,setCurrentNews}){

function ScriptedHTML({html,className,style}){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    if(!ref.current||!html)return;
    ref.current.innerHTML=html;
    ref.current.querySelectorAll('script').forEach(old=>{
      const s=document.createElement('script');
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      document.body.appendChild(s);
    });
  },[html]);
  return<div ref={ref} className={className} style={style}/>;
}

            {cover&&<div style={{flexShrink:0,width:'clamp(180px,22vw,300px)',borderRadius:4,overflow:'hidden',boxShadow:'0 8px 32px rgba(15,14,11,0.15)'}}><img src={cover} alt={issue.title} style={{width:'100%',aspectRatio:'3/4',objectFit:'cover',display:'block'}}/></div>}
          </div>
        </div>
      </div>
      <div style={{padding:'64px 0 80px',background:'var(--bg)'}}>
        <div className="wrap">
          {issueArticles.length===0?(
            <div className="empty-state"><div className="empty-glyph">§</div><p className="empty-msg">Essays coming soon.</p></div>
          ):(
            <>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',paddingBottom:20,borderBottom:'1px solid var(--rule)',marginBottom:0}}>
                <span className="label label-accent">Essays in this issue</span>
                <span style={{fontFamily:'var(--ff-mono)',fontSize:10,color:'var(--ink-4)'}}>{issueArticles.length} pieces</span>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(300px,1fr))',gap:1,background:'var(--rule)',border:'1px solid var(--rule)',borderTop:'none',borderRadius:'0 0 4px 4px',overflow:'hidden'}}>
                {issueArticles.map((a,i)=>{
                  const thumb=assetUrl(a.profile,assets,640);
                  return(
                    <button key={a.id} className="issue-card" onClick={()=>setCurrentArticle(a)} onMouseEnter={e=>e.currentTarget.style.background='var(--bg-warm)'} onMouseLeave={e=>e.currentTarget.style.background='var(--bg)'}>
                      {thumb
                        ?<div style={{width:'100%',aspectRatio:'16/9',overflow:'hidden',background:'var(--bg-deep)',flexShrink:0}}><img src={thumb} alt={a.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/></div>
                        :<div style={{width:'100%',aspectRatio:'16/9',background:'var(--bg-deep)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:56,color:'var(--ink)',opacity:0.08}}>{a.glyph||'§'}</span></div>}
                      <div style={{padding:'24px 28px 28px',display:'flex',flexDirection:'column',gap:8,flex:1}}>
                        <div style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:11,letterSpacing:'0.06em',color:'var(--ink-4)'}}>Essay {String(i+1).padStart(2,'0')}</div>
                        {a.kicker&&<div className="row-kicker">{a.kicker}</div>}
                        <div style={{fontFamily:'var(--ff-display)',fontSize:22,fontWeight:700,letterSpacing:'-0.01em',lineHeight:1.1,color:'var(--ink)'}}>{a.title}</div>
                        {a.subtitle&&<p style={{fontFamily:'var(--ff-sans)',fontSize:13.5,lineHeight:1.5,color:'var(--ink-3)',margin:0}}>{a.subtitle}</p>}
                        <div style={{marginTop:'auto',paddingTop:14,borderTop:'1px solid var(--rule)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <span style={{fontFamily:'var(--ff-mono)',fontSize:10.5,color:'var(--ink-4)'}}>{a.author||about?.editorName}</span>
                          <span style={{fontFamily:'var(--ff-mono)',fontSize:11,color:'var(--accent)'}}>Read →</span>
                        </div>
                      </div>
                    </button>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>
      {otherIssues.length>0&&(
        <div style={{padding:'56px 0 80px',background:'var(--bg-warm)',borderTop:'1px solid var(--rule)'}}>
          <div className="wrap">
            <div className="label label-accent" style={{marginBottom:20}}>Other issues</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))',gap:1,background:'var(--rule)',border:'1px solid var(--rule)',borderRadius:4,overflow:'hidden'}}>
              {otherIssues.map(oi=>{
                const oCover=assetUrl(oi.coverImage||oi.profile,assets,400);
                const oArticles=(articles||[]).filter(a=>articleBelongsToIssue(a,oi.id));
                return(
                  <button key={oi.id} style={{textAlign:'left',background:'var(--bg-warm)',display:'flex',gap:20,padding:28,transition:'background 200ms',alignItems:'flex-start'}} onClick={()=>{setCurrentIssue(oi);window.scrollTo(0,0);}} onMouseEnter={e=>e.currentTarget.style.background='var(--bg-deep)'} onMouseLeave={e=>e.currentTarget.style.background='var(--bg-warm)'}>
                    {oCover&&<div style={{width:64,flexShrink:0,borderRadius:2,overflow:'hidden'}}><img src={oCover} alt={oi.title} style={{width:'100%',aspectRatio:'2/3',objectFit:'cover',display:'block'}}/></div>}
                    <div>
                      <div className="label" style={{color:'var(--ink-4)',marginBottom:8}}>Issue №{String(oi.number||'').padStart(2,'0')}{oi.season?' · '+oi.season:''}</div>
                      <div style={{fontFamily:'var(--ff-display)',fontSize:20,fontWeight:700,letterSpacing:'-0.01em',lineHeight:1.1,color:'var(--ink)'}}>{oi.title}</div>
                      <div style={{fontFamily:'var(--ff-mono)',fontSize:10,color:'var(--ink-4)',marginTop:8}}>{oArticles.length} {oArticles.length===1?'essay':'essays'}</div>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      )}
    </section>
  );
}

function HomeView(props){
  const featured=props.articles&&props.articles.length>0?props.articles[0]:null;
  return(<>
    <Hero featured={featured} {...props}/>
    {props.news.length>0&&<DispatchRail {...props}/>}
    {props.articles.length>0&&<FeaturedGrid {...props}/>}
    {props.issues&&props.issues.length>0&&<IssuesStrip {...props}/>}
    <Manifesto/>
    {props.articles.length>0&&<Register {...props}/>}
    <PitchCTA {...props}/>
  </>);
}

/* ── HASH ROUTING ── */
function parseHash(hash){return(hash||'').replace(/^#!\/?|^#\/?/,'').split('/').filter(Boolean);}
function navigate(path){window.location.hash='!'+path;window.scrollTo(0,0);}

/* ── APP ── */
function App(){
  const[seg,setSeg]=useState(()=>parseHash(window.location.hash));
  const[articles,setArticles]=useState([]);
  const[news,setNews]=useState([]);
  const[issues,setIssues]=useState([]);
  const[settings,setSettings]=useState(null);
  const[about,setAbout]=useState(null);
  const[assets,setAssets]=useState([]);
  const[entryPool,setEntryPool]=useState([]); // for resolving correspondent links
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    const onHash=()=>setSeg(parseHash(window.location.hash));
    window.addEventListener('hashchange',onHash);
    return()=>window.removeEventListener('hashchange',onHash);
  },[]);

  useEffect(()=>{
    async function load(){
      try{
        const[aR,sR,abR,nR,iR]=await Promise.all([
          getEntries('articlePost','&order=-fields.publishDate&include=10').catch(()=>({items:[],includes:{}})),
          getEntries('settings').catch(()=>({items:[]})),
          // include=2 so correspondent entries inside team field are fully resolved
          getEntries('about','&include=2').catch(()=>({items:[],includes:{}})),
          getEntries('news','&order=-fields.publishDate&include=10').catch(()=>({items:[],includes:{}})),
          getEntries('issue','&order=-fields.number&include=2').catch(()=>({items:[],includes:{}})),
        ]);

        const seen=new Set();
        const allAssets=[
          ...(aR.includes?.Asset||[]),
          ...(abR.includes?.Asset||[]),
          ...(nR.includes?.Asset||[]),
          ...(iR.includes?.Asset||[]),
        ].filter(a=>{if(seen.has(a.sys.id))return false;seen.add(a.sys.id);return true;});
        setAssets(allAssets);
        window.__fvAssets=allAssets;

        // Collect ALL included entries so we can resolve correspondent links
        const seenE=new Set();
        const allEntries=[
          ...(aR.includes?.Entry||[]),
          ...(abR.includes?.Entry||[]),
          ...(iR.includes?.Entry||[]),
        ].filter(e=>{if(seenE.has(e.sys.id))return false;seenE.add(e.sys.id);return true;});
        setEntryPool(allEntries);

        setArticles((aR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        setNews((nR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        setIssues((iR.items||[]).map(i=>({id:i.sys.id,...i.fields})));
        if(sR.items?.length)setSettings(sR.items[0].fields);
        if(abR.items?.length)setAbout(abR.items[0].fields);
      }catch(e){console.error('Contentful error:',e);}
      finally{setLoading(false);}
    }
    load();
  },[]);

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--bg)'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
        <Mark size={36}/>
        <span style={{fontFamily:'Playfair Display,serif',fontSize:22,fontWeight:700,letterSpacing:'-0.025em',color:'var(--ink)'}}>Framing Vote</span>
        <span style={{fontFamily:'DM Mono,monospace',fontSize:10,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--ink-4)'}}>Loading</span>
      </div>
    </div>
  );

  const[section,slug,articleSlug]=seg;
  const currentIssue=slug&&section==='journal'?issues.find(i=>i.slug===slug)||null:null;
  const currentArticle=articleSlug&&section==='journal'?articles.find(a=>a.slug===articleSlug)||null
    :slug&&section==='archive'?articles.find(a=>a.slug===slug)||null:null;
  const currentNews=slug&&section==='dispatches'?news.find(n=>n.slug===slug)||null:null;

  function setCurrentArticle(a){
    if(!a?.slug)return;
    const issueId=a.issue?.sys?.id||a.issueId;
    const issue=issueId?issues.find(i=>i.id===issueId):null;
    if(issue?.slug)navigate(`/journal/${issue.slug}/${a.slug}`);
    else navigate(`/archive/${a.slug}`);
  }
  function setCurrentNews(n){if(n?.slug)navigate(`/dispatches/${n.slug}`);}
  function setCurrentIssue(i){if(i?.slug)navigate(`/journal/${i.slug}`);}
  function setRoute(r){const map={home:'/',journal:'/journal',archive:'/archive',news:'/dispatches',about:'/about',submit:'/submit'};if(map[r])navigate(map[r]);}

  const activeNav=section==='journal'||section==='archive'?'journal':section==='dispatches'?'news':section||'home';

  const props={articles,news,issues,settings,about,assets,entryPool,setRoute,setCurrentArticle,setCurrentNews,setCurrentIssue,currentIssue};

  return(
    <div className="page">
      <Header activeNav={activeNav} navigate={navigate}/>
      <main style={{flex:1}}>
        {(!section||section==='home')           &&<HomeView {...props}/>}
        {section==='archive'&&!slug             &&<ArchiveView {...props}/>}
        {section==='archive'&&slug              &&<ArticleView article={currentArticle} {...props}/>}
        {section==='journal'&&!slug             &&<IssueView {...props}/>}
        {section==='journal'&&slug&&!articleSlug&&<IssueDetailView issue={currentIssue} {...props}/>}
        {section==='journal'&&slug&&articleSlug &&<ArticleView article={currentArticle} {...props}/>}
        {section==='dispatches'&&!slug          &&<NewsView {...props}/>}
        {section==='dispatches'&&slug           &&<NewsArticleView item={currentNews} about={about} assets={assets}/>}
        {section==='about'                      &&<AboutView about={about} assets={assets} entryPool={entryPool}/>}
        {section==='submit'                     &&<SubmitView about={about}/>}
      </main>
      <Newsletter/>
      <Footer settings={settings} about={about}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
