<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Framing Vote — A quarterly journal on elections</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --paper:#F6F2EA;--paper-deep:#EAE3D5;--paper-soft:#FEFDF8;--paper-edge:#D9CFB8;
  --ink:#1B1A17;--ink-2:#3C3A33;--ink-3:#6B6759;--ink-4:#9A9382;
  --accent:#7A1F1F;--accent-deep:#5A1414;--accent-soft:#B85B5B;
  --ink-bg:#1B1A17;--ink-bg-2:#2A2823;
  --font-display:"Fraunces","Times New Roman",serif;
  --font-serif:"Bodoni Moda","Georgia",serif;
  --font-sans:"Inter Tight",-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper-soft);color:var(--ink);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:underline;text-underline-offset:0.18em;text-decoration-thickness:1px;transition:color 140ms;}
a:hover{color:var(--accent-deep);}
button{font-family:inherit;cursor:pointer;}
::selection{background:rgba(122,31,31,0.18);color:var(--ink);}
.fv-page{min-height:100vh;display:flex;flex-direction:column;}
.fv-container{width:100%;max-width:1180px;margin:0 auto;padding:0 32px;box-sizing:border-box;}
.fv-reading{width:100%;max-width:680px;margin:0 auto;padding:0 32px;}
.hr{border:0;border-top:1px solid var(--paper-edge);margin:0;}
.hr-strong{border:0;border-top:2px solid var(--ink);margin:0;}
.kicker{font-family:var(--font-sans);font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-3);}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;font-family:var(--font-sans);font-size:13px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;border-radius:0;transition:all 140ms;text-decoration:none;}
.btn:hover{background:#2A2823;color:var(--paper);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--paper-edge);}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}
.btn-on-dark{background:transparent;color:var(--paper);border:1px solid rgba(244,237,224,0.4);}
.btn-on-dark:hover{background:var(--paper);color:var(--ink);}
.input{display:block;width:100%;padding:13px 16px;border:1px solid var(--paper-edge);background:var(--paper-soft);font-family:var(--font-serif);font-size:16px;color:var(--ink);border-radius:0;outline:none;transition:border-color 140ms;}
.input::placeholder{color:var(--ink-4);font-style:italic;}
.input:focus{border-color:var(--ink);}
.input.on-dark{background:rgba(244,237,224,0.06);border-color:rgba(244,237,224,0.18);color:var(--paper);}
.input.on-dark::placeholder{color:rgba(244,237,224,0.4);}
.input.on-dark:focus{border-color:var(--paper);}
.fv-dropcap::first-letter{font-family:var(--font-display);font-weight:400;float:left;font-size:5.4em;line-height:0.85;margin:0.05em 0.08em 0 0;color:var(--accent);}
.art-card{cursor:pointer;padding:20px 0;border-top:1px solid var(--paper-edge);display:grid;grid-template-columns:1fr 96px;gap:18px;align-items:flex-start;transition:opacity 140ms;}
.art-card:hover .art-title{color:var(--accent);}
.art-title{font-family:var(--font-display);font-size:22px;line-height:1.2;letter-spacing:-0.01em;color:var(--ink);margin:0 0 8px;font-weight:400;transition:color 140ms;}
.art-thumb{background:var(--ink-bg);height:96px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-style:italic;color:rgba(244,237,224,0.7);font-size:28px;}
.reading-progress{position:fixed;top:0;left:0;right:0;height:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:100;transition:transform 80ms linear;}
.news-card{cursor:pointer;padding:18px 0;border-top:1px solid var(--paper-edge);transition:opacity 140ms;}
.news-card:hover .news-title{color:var(--accent);}
.news-title{font-family:var(--font-sans);font-size:16px;font-weight:600;line-height:1.3;color:var(--ink);margin:0 0 6px;transition:color 140ms;}
.news-category{display:inline-block;font-family:var(--font-sans);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);padding:2px 8px;margin-bottom:8px;}
.news-summary{font-family:var(--font-serif);font-style:italic;font-size:14px;line-height:1.5;color:var(--ink-2);margin:0 0 8px;}
.news-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-4);letter-spacing:0.04em;}
.fade-in{animation:fadeUp 320ms cubic-bezier(0.2,0.6,0.2,1) both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* Rich text body styles */
.post-body h2{font-family:var(–font-display);font-size:32px;line-height:1.2;letter-spacing:-0.01em;color:var(–ink);margin:40px 0 16px;font-weight:400;}
.post-body h3{font-family:var(–font-display);font-size:24px;line-height:1.2;color:var(–ink);margin:32px 0 12px;font-weight:400;}
.post-body p{font-family:var(–font-serif);font-size:18px;line-height:1.65;color:var(–ink);margin:0 0 20px;}
.post-body blockquote{margin:24px -40px;padding:32px 40px;background:var(–ink-bg);color:var(–paper);}
.post-body blockquote p{font-family:var(–font-display);font-size:26px;font-style:italic;line-height:1.25;color:var(–paper);margin:0;}
.post-body ul,.post-body ol{font-family:var(–font-serif);font-size:18px;line-height:1.65;color:var(–ink);padding-left:24px;margin:0 0 20px;}
.post-body hr{border:0;border-top:1px solid var(–paper-edge);margin:40px 0;}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(–paper-deep) 25%,var(–paper-edge) 50%,var(–paper-deep) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
</style>

</head>
<body>
<div class="fv-page" id="app">
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="text-align:center;">
      <div style="font-family:var(--font-display);font-size:28px;letter-spacing:-0.02em;color:var(--ink);margin-bottom:16px;">Framing<span style="color:var(--accent);margin:0 0.05em;">·</span><em>Vote</em></div>
      <div style="font-family:var(--font-sans);font-size:12px;color:var(--ink-3);letter-spacing:0.08em;text-transform:uppercase;">Loading…</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── CONTENTFUL CONFIG ──────────────────────────────────────────
const SPACE   = 'upaglixkbf42';
const TOKEN   = 'H3fmoxO4StTBS-lRp_ULYaywbv3uM3C6WTG8o1M_PbU';
const BASE    = `https://cdn.contentful.com/spaces/${SPACE}/environments/master`;

async function cfFetch(path) {
  const res = await fetch(`${BASE}${path}&access_token=${TOKEN}`);
  if (!res.ok) throw new Error(`Contentful ${res.status}`);
  return res.json();
}

async function getEntries(contentType, extra = '') {
  return cfFetch(`/entries?content_type=${contentType}${extra}`);
}

// ── RICH TEXT RENDERER (minimal) ──────────────────────────────
function renderRichText(doc) {
  if (!doc || !doc.content) return '';
  const renderNode = (node) => {
    if (node.nodeType === 'text') {
      let t = node.value;
      if (node.marks) node.marks.forEach(m => {
        if (m.type === 'bold') t = `<strong>${t}</strong>`;
        if (m.type === 'italic') t = `<em>${t}</em>`;
        if (m.type === 'code') t = `<code>${t}</code>`;
      });
      return t;
    }
    const inner = (node.content || []).map(renderNode).join('');
    switch (node.nodeType) {
      case 'paragraph': return `<p>${inner}</p>`;
      case 'heading-1': return `<h1>${inner}</h1>`;
      case 'heading-2': return `<h2>${inner}</h2>`;
      case 'heading-3': return `<h3>${inner}</h3>`;
      case 'heading-4': return `<h4>${inner}</h4>`;
      case 'unordered-list': return `<ul>${inner}</ul>`;
      case 'ordered-list': return `<ol>${inner}</ol>`;
      case 'list-item': return `<li>${inner}</li>`;
      case 'blockquote': return `<blockquote>${inner}</blockquote>`;
      case 'hr': return `<hr/>`;
      case 'hyperlink': return `<a href="${node.data?.uri}">${inner}</a>`;
      default: return inner;
    }
  };
  return doc.content.map(renderNode).join('');
}

// ── UTILITIES ─────────────────────────────────────────────────
function formatDate(str) {
  if (!str) return '';
  return new Date(str).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

// ── WORDMARK ──────────────────────────────────────────────────
function Wordmark({ size = 24, onClick }) {
  return (
    <div onClick={onClick} style={{ cursor: onClick ? 'pointer' : 'default', fontFamily: 'var(--font-display)', fontSize: size, letterSpacing: '-0.02em', color: 'var(--ink)', lineHeight: 1, userSelect: 'none' }}>
      Framing<span style={{ color: 'var(--accent)', margin: '0 0.05em' }}>·</span><em>Vote</em>
    </div>
  );
}

// ── MASTHEAD ──────────────────────────────────────────────────
function Masthead({ route, setRoute, settings, scrolled }) {
  const nav = [
    { id: 'home', label: 'The Argument' },
    { id: 'archive', label: 'Archive' },
    { id: 'news', label: 'News' },
    { id: 'about', label: 'About' },
    { id: 'submit', label: 'Submit' },
  ];
  return (
    <header style={{ position: 'sticky', top: 0, zIndex: 50, background: 'rgba(254,253,248,0.92)', backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', borderBottom: '1px solid var(--paper-edge)' }}>
      {!scrolled && settings && (
        <div style={{ background: 'var(--paper-deep)', borderBottom: '1px solid var(--paper-edge)' }}>
          <div className="fv-container" style={{ display: 'flex', justifyContent: 'space-between', padding: '7px 32px', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.08em', color: 'var(--ink-3)', textTransform: 'uppercase' }}>
            <span>Quarterly · Issue N°{settings.issueNumber || '01'}</span>
            <span>{settings.issueSeason || ''}</span>
            <span>{settings.cities || ''}</span>
          </div>
        </div>
      )}
      <div className="fv-container" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: scrolled ? '12px 32px' : '20px 32px', transition: 'padding 220ms' }}>
        <Wordmark size={scrolled ? 20 : 26} onClick={() => setRoute('home')} />
        <nav style={{ display: 'flex', gap: 28 }}>
          {nav.map(l => (
            <a key={l.id} href="#" onClick={e => { e.preventDefault(); setRoute(l.id); }}
              style={{ textDecoration: 'none', color: route === l.id ? 'var(--ink)' : 'var(--ink-2)', fontFamily: 'var(--font-sans)', fontSize: 13, fontWeight: 500, letterSpacing: '0.02em', borderBottom: route === l.id ? '2px solid var(--ink)' : '2px solid transparent', paddingBottom: 4 }}>
              {l.label}
            </a>
          ))}
        </nav>
        <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
          <a href="#newsletter" className="btn" style={{ padding: '8px 14px', fontSize: 11 }}>Subscribe</a>
        </div>
      </div>
    </header>
  );
}

// ── NEWSLETTER ────────────────────────────────────────────────
function Newsletter() {
  return (
    <section id="newsletter" style={{ background: 'var(--ink-bg)', color: 'var(--paper)', padding: '80px 0' }}>
      <div className="fv-container" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 64, alignItems: 'center' }}>
        <div>
          <div className="kicker" style={{ color: 'var(--accent-soft)', marginBottom: 12 }}>The Dispatch · Sundays</div>
          <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 44, lineHeight: 1.1, letterSpacing: '-0.02em', color: 'var(--paper)', margin: '0 0 16px', fontWeight: 400 }}>One letter a week, written by the editor. <em>No more.</em></h2>
          <p style={{ fontFamily: 'var(--font-serif)', fontSize: 17, lineHeight: 1.6, color: 'rgba(244,237,224,0.75)', margin: 0 }}>What we are reading, what we are commissioning, and the elections we will be watching. Free.</p>
        </div>
        <div>
          <label style={{ fontFamily: 'var(--font-sans)', fontSize: 11, fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'rgba(244,237,224,0.55)', display: 'block', marginBottom: 10 }}>Email address</label>
          <div style={{ display: 'flex', gap: 12 }}>
            <input className="input on-dark" placeholder="reader@example.org" style={{ flex: 1 }} />
            <button className="btn btn-on-dark">Subscribe</button>
          </div>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 12, color: 'rgba(244,237,224,0.5)', margin: '10px 0 0', lineHeight: 1.5 }}>We do not share addresses. Unsubscribe at any time.</p>
        </div>
      </div>
    </section>
  );
}

// ── FOOTER ────────────────────────────────────────────────────
function Footer({ setRoute, settings, about }) {
  return (
    <footer style={{ background: 'var(--paper-deep)', borderTop: '2px solid var(--ink)', marginTop: 'auto' }}>
      <div className="fv-container" style={{ padding: '64px 32px 24px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1.4fr repeat(4,1fr)', gap: 48 }}>
          <div>
            <Wordmark size={22} onClick={() => setRoute('home')} />
            <p style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: 14, lineHeight: 1.5, color: 'var(--ink-2)', margin: '14px 0', maxWidth: 260 }}>{settings?.tagline || 'A quarterly journal on elections.'}</p>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-3)', letterSpacing: '0.06em', textTransform: 'uppercase' }}>EST. {settings?.foundingYear || '2026'} · {settings?.cities || ''}</div>
          </div>
          {[
            { h: 'The Journal', links: [['About', 'about'], ['The editor', 'about'], ['Submit', 'submit']] },
            { h: 'Read', links: [['Latest issue', 'home'], ['Archive', 'archive']] },
            { h: 'Contribute', links: [['Pitch an essay', 'submit'], ['Guidelines', 'submit']] },
            { h: 'Subscribe', links: [['Free dispatch', 'home']] },
          ].map(col => (
            <div key={col.h} style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div className="kicker" style={{ marginBottom: 4 }}>{col.h}</div>
              {col.links.map(([label, id]) => (
                <a key={label} href="#" onClick={e => { e.preventDefault(); setRoute(id); }}
                  style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--ink-2)', textDecoration: 'none' }}
                  onMouseEnter={e => e.currentTarget.style.color = 'var(--accent)'}
                  onMouseLeave={e => e.currentTarget.style.color = 'var(--ink-2)'}>{label}</a>
              ))}
            </div>
          ))}
        </div>
        <hr className="hr" style={{ margin: '40px 0 18px' }} />
        <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--ink-3)' }}>
          <div>© Framing Vote {settings?.foundingYear || '2026'}{settings?.issn ? ` · ISSN ${settings.issn}` : ''}</div>
          <div style={{ display: 'flex', gap: 18 }}>
            {['Privacy', 'RSS'].map(l => <a key={l} href="#" style={{ color: 'var(--ink-3)', textDecoration: 'none' }}>{l}</a>)}
          </div>
        </div>
      </div>
    </footer>
  );
}

// ── HOME VIEW ─────────────────────────────────────────────────
function HomeView({ articles, news, settings, about, setRoute, setCurrentArticle, setCurrentNews }) {
  const hasArticles = articles && articles.length > 0;
  const featured = hasArticles ? articles[0] : null;

  if (!hasArticles) {
    // EMPTY STATE
    return (
      <section className="fade-in" style={{ padding: '80px 0 96px', borderBottom: '1px solid var(--paper-edge)' }}>
        <div className="fv-container" style={{ textAlign: 'center' }}>
          <svg viewBox="0 0 100 100" width="80" height="80" fill="none" style={{ display: 'block', margin: '0 auto 32px' }}>
            <circle cx="50" cy="50" r="46" stroke="#1B1A17" strokeWidth="0.75" opacity="0.25"/>
            <circle cx="50" cy="50" r="36" stroke="#1B1A17" strokeWidth="0.75" opacity="0.18"/>
            <circle cx="50" cy="50" r="26" stroke="#7A1F1F" strokeWidth="0.5" opacity="0.4"/>
            {[...Array(12)].map((_,i) => <line key={i} x1="50" y1="14" x2="50" y2="8" stroke="#1B1A17" strokeWidth="0.5" opacity="0.3" transform={`rotate(${i*30} 50 50)`}/>)}
            <text x="50" y="55" textAnchor="middle" fontFamily="Fraunces,serif" fontSize="14" fill="#1B1A17" fontStyle="italic" opacity="0.75">N°{settings?.issueNumber || '01'}</text>
          </svg>
          <div className="kicker" style={{ color: 'var(--accent)', marginBottom: 16 }}>Issue N°{settings?.issueNumber || '01'} · {settings?.issueSeason || ''}</div>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(36px,5vw,64px)', lineHeight: 1.05, letterSpacing: '-0.02em', color: 'var(--ink)', margin: '0 0 20px', fontWeight: 400 }}>
            <em>{settings?.issueTheme || 'The first issue'}</em><br/>is in preparation.
          </h1>
          <p style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: 20, lineHeight: 1.55, color: 'var(--ink-2)', maxWidth: 560, margin: '0 auto 32px' }}>
            {settings?.tagline || 'A quarterly journal on elections. The first issue is being assembled.'}
          </p>
          <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 64 }}>
            <a href="#newsletter" className="btn">Get notified</a>
            <button className="btn btn-ghost" onClick={() => setRoute('about')}>About the journal</button>
          </div>
          {about && (
            <div style={{ maxWidth: 680, margin: '0 auto', padding: 40, background: 'var(--paper-deep)', border: '1px solid var(--paper-edge)', textAlign: 'left' }}>
              <div className="kicker" style={{ marginBottom: 14 }}>A note from the editor</div>
              <p style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: 18, lineHeight: 1.6, color: 'var(--ink-2)', margin: '0 0 16px' }}>
                {about.editorBio?.substring(0, 300)}…
              </p>
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--ink-3)' }}>
                — <strong style={{ fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--ink-2)' }}>{about.editorName}</strong>, {about.editorTitle}
              </div>
            </div>
          )}
        </div>
      </section>
    );
  }

  // LIVE STATE — articles exist
  return (
    <>
      <section className="fade-in" style={{ padding: '56px 0 64px', borderBottom: '1px solid var(--paper-edge)' }}>
        <div className="fv-container">
          <div style={{ display: 'grid', gridTemplateColumns: '1.15fr 1fr', gap: 56, alignItems: 'center' }}>
            <div>
              <div className="kicker" style={{ color: 'var(--accent)', marginBottom: 16 }}>{featured.kicker || `The Argument · Issue ${settings?.issueNumber || '01'}`}</div>
              <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(36px,4.5vw,64px)', lineHeight: 1.05, letterSpacing: '-0.02em', color: 'var(--ink)', margin: '0 0 20px', fontWeight: 400 }}>{featured.title}</h1>
              {featured.subtitle && <p style={{ fontFamily: 'var(--font-serif)', fontStyle: 'italic', fontSize: 20, lineHeight: 1.5, color: 'var(--ink-2)', margin: '0 0 20px' }}>{featured.subtitle}</p>}
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--ink-3)', marginBottom: 28 }}>
                <strong style={{ fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--ink-2)' }}>By {featured.author || about?.editorName}</strong>
                {featured.publishDate && <> · {formatDate(featured.publishDate)}</>}
              </div>
              <div style={{ display: 'flex', gap: 12 }}>
                <button className="btn" onClick={() => { setCurrentArticle(featured); setRoute('article'); }}>Read the essay</button>
                <button className="btn btn-ghost" onClick={() => setRoute('archive')}>Browse the issue</button>
              </div>
            </div>
            <div style={{ position: 'relative', overflow: 'hidden', background: 'var(--ink-bg)', minHeight: 420 }}>
              <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(160deg,#3C3A33 0%,#1B1A17 60%,#2A2823 100%)' }}/>
              <div style={{ position: 'absolute', top: 24, left: 24, fontFamily: 'var(--font-sans)', fontSize: 11, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'rgba(244,237,224,0.5)' }}>{settings?.issueTheme} · {settings?.issueSeason}</div>
              <div style={{ position: 'absolute', left: 18, bottom: 14, fontFamily: 'var(--font-display)', color: 'var(--paper)', opacity: 0.85, fontStyle: 'italic', lineHeight: 0.9, fontSize: 120 }}>{featured.glyph || settings?.issueNumber || '§'}</div>
            </div>
          </div>
        </div>
      </section>

      {articles.length > 1 && (
        <section style={{ padding: '64px 0' }}>
          <div className="fv-container">
            <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 32 }}>
              <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 32, lineHeight: 1.1, letterSpacing: '-0.01em', color: 'var(--ink)', margin: 0, fontWeight: 400 }}>Latest in Issue {settings?.issueNumber || '01'}</h2>

// ── APP ───────────────────────────────────────────────────────
function App() {
  const [route, setRoute] = useState('home');
  const [scrolled, setScrolled] = useState(false);
  const [articles, setArticles] = useState([]);
  const [news, setNews] = useState([]);
  const [settings, setSettings] = useState(null);
  const [about, setAbout] = useState(null);
  const [currentArticle, setCurrentArticle] = useState(null);
  const [currentNews, setCurrentNews] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 80);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  useEffect(() => { window.scrollTo(0, 0); }, [route]);

  useEffect(() => {
    async function load() {
      try {
        const [artRes, settingsRes, aboutRes, newsRes] = await Promise.all([
          getEntries('articlePost', '&order=-fields.publishDate'),
          getEntries('settings'),
          getEntries('about'),
          getEntries('news', '&order=-fields.publishDate'),
        ]);

        const arts = (artRes.items || []).map(item => ({ id: item.sys.id, ...item.fields }));
        setArticles(arts);

        const newsItems = (newsRes.items || []).map(item => ({ id: item.sys.id, ...item.fields }));
        setNews(newsItems);

        if (settingsRes.items?.length) setSettings(settingsRes.items[0].fields);
        if (aboutRes.items?.length) setAbout(aboutRes.items[0].fields);
      } catch (e) {
        console.error('Contentful error:', e);
      } finally {
        setLoading(false);
      }
    }
    load();
  }, []);

  if (loading) {
    return (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh' }}>
        <div style={{ textAlign: 'center' }}>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 28, letterSpacing: '-0.02em', color: 'var(--ink)', marginBottom: 16 }}>Framing<span style={{ color: 'var(--accent)', margin: '0 0.05em' }}>·</span><em>Vote</em></div>
          <div style={{ fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--ink-3)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>Loading…</div>
        </div>
      </div>
    );
  }

  return (
    <div className="fv-page">
      <Masthead route={route} setRoute={setRoute} settings={settings} scrolled={scrolled} />
      <main style={{ flex: 1 }}>
        {route === 'home'        && <HomeView articles={articles} news={news} settings={settings} about={about} setRoute={setRoute} setCurrentArticle={setCurrentArticle} setCurrentNews={setCurrentNews} />}
        {route === 'article'     && <ArticleView article={currentArticle} about={about} setRoute={setRoute} />}
        {route === 'archive'     && <ArchiveView articles={articles} settings={settings} about={about} setRoute={setRoute} setCurrentArticle={setCurrentArticle} />}
        {route === 'news'        && <NewsView news={news} setRoute={setRoute} setCurrentNews={setCurrentNews} />}
        {route === 'newsArticle' && <NewsArticleView item={currentNews} about={about} setRoute={setRoute} />}
        {route === 'about'       && <AboutView about={about} />}
        {route === 'submit'      && <SubmitView about={about} />}
      </main>
      <Newsletter />
      <Footer setRoute={setRoute} settings={settings} about={about} />
    </div>
  );
}
