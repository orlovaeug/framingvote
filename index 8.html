<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Framing Vote — A journal on elections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #F5F2EA;
      --bg-warm: #EDE9DE;
      --bg-deep: #E3DED1;
      --ink: #0F0E0B;
      --ink-2: #2A2924;
      --ink-3: #6B6860;
      --ink-4: #ABA89F;
      --rule: #C8C3B6;
      --accent: #C1440E;
      --accent-pale: #F5E8E2;
      --night: #0F0E0B;
      --night-2: #1E1D19;
      --ff-display: 'Playfair Display', Georgia, serif;
      --ff-sans: 'DM Sans', system-ui, sans-serif;
      --ff-mono: 'DM Mono', ui-monospace, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ff-sans);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; padding: 0; }
    img { max-width: 100%; display: block; }
    ::selection { background: var(--accent); color: #fff; }

    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 48px; }
    .read { width: 100%; max-width: 700px; margin: 0 auto; padding: 0 40px; }

    .label {
      font-family: var(--ff-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .label-accent { color: var(--accent); }

    hr { border: 0; border-top: 1px solid var(--rule); }

    #progress {
      position: fixed; top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent); transform-origin: 0 50%;
      transform: scaleX(0); z-index: 200; transition: transform 80ms linear;
    }

    /* ── HEADER ── */
    .page > header {
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid transparent;
      transition: border-color 200ms, background 200ms;
      background: rgba(245,242,234,0);
      backdrop-filter: blur(0);
    }
    .page > header.scrolled {
      background: rgba(245,242,234,0.94);
      border-bottom-color: var(--rule);
      backdrop-filter: saturate(160%) blur(16px);
    }
    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
    }
    .wordmark {
      font-family: var(--ff-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      display: flex; align-items: center; gap: 10px;
    }
    .wordmark-mark {
      width: 26px; height: 26px; background: var(--accent); border-radius: 4px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    nav { display: flex; align-items: center; gap: 2px; }
    .nav-btn {
      padding: 7px 13px;
      font-family: var(--ff-sans);
      font-size: 13px;
      font-weight: 400;
      color: var(--ink-3);
      border-radius: 6px;
      transition: color 140ms, background 140ms;
    }
    .nav-btn:hover { color: var(--ink); background: rgba(15,14,11,0.05); }
    .nav-btn.active { color: var(--ink); font-weight: 500; }
    .btn-cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px;
      font-family: var(--ff-sans);
      font-size: 13px; font-weight: 500;
      background: var(--ink); color: var(--bg);
      border-radius: 6px;
      transition: background 160ms var(--ease), transform 140ms;
    }
    .btn-cta:hover { background: var(--accent); }
    .btn-cta:active { transform: translateY(1px); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 12px 22px;
      font-family: var(--ff-sans); font-size: 13.5px; font-weight: 500;
      background: var(--ink); color: var(--bg); border-radius: 6px;
      transition: background 160ms var(--ease), transform 120ms;
    }
    .btn:hover { background: var(--accent); }
    .btn:active { transform: translateY(1px); }
    .btn-outline {
      background: transparent; color: var(--ink);
      border: 1px solid var(--ink);
    }
    .btn-outline:hover { background: var(--ink); color: var(--bg); }
    .btn-outline-ghost {
      background: transparent; color: var(--ink-3);
      border: 1px solid var(--rule);
    }
    .btn-outline-ghost:hover { border-color: var(--ink); color: var(--ink); background: transparent; }

    .mono-arrow { font-family: var(--ff-mono); font-size: 13px; }

    /* ── CATEGORY CHIP ── */
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; font-family: var(--ff-mono);
      font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-pale); border-radius: 999px;
      border: 1px solid transparent;
      transition: background 140ms, border-color 140ms;
      cursor: default;
    }
    .chip-btn {
      cursor: pointer;
    }
    .chip-btn:hover { background: var(--accent); color: #fff; }
    .chip-btn.active { background: var(--accent); color: #fff; }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 16px 0;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 0;
    }
    .filter-label {
      font-family: var(--ff-mono); font-size: 9.5px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4);
      margin-right: 4px; flex-shrink: 0;
    }
    .filter-pill {
      padding: 5px 12px;
      font-family: var(--ff-mono); font-size: 9.5px;
      letter-spacing: 0.1em; text-transform: uppercase;
      border: 1px solid var(--rule);
      border-radius: 999px;
      color: var(--ink-3);
      background: transparent;
      cursor: pointer;
      transition: all 140ms;
    }
    .filter-pill:hover { border-color: var(--ink); color: var(--ink); }
    .filter-pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    /* ── HERO ── */
    .hero {
      padding: 0 0 88px;
      border-bottom: 1px solid var(--rule);
      background: var(--bg);
    }
    .hero-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0; border-bottom: 1px solid var(--rule);
      flex-wrap: wrap; gap: 16px;
    }
    .hero-bar-left { display: flex; align-items: center; gap: 16px; }
    .issue-num {
      font-family: var(--ff-mono); font-size: 11px;
      letter-spacing: 0.1em; color: var(--ink-3);
    }
    .dot-sep {
      width: 3px; height: 3px; border-radius: 50%;
      background: var(--ink-4); flex-shrink: 0;
    }
    .issue-theme {
      font-family: var(--ff-display); font-style: italic;
      font-size: 16px; color: var(--ink-2);
    }
    .live-badge {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-3);
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    .hero-head {
      padding: 80px 0 64px;
      display: grid; grid-template-columns: 1fr; gap: 40px;
    }
    .hero-h1 {
      font-family: var(--ff-display);
      font-size: clamp(64px, 11vw, 168px);
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 0.91;
      color: var(--ink);
    }
    .hero-h1 em { font-style: italic; color: var(--accent); font-weight: 400; }
    .hero-sub {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 40px; align-items: flex-end;
    }
    .hero-tagline {
      font-family: var(--ff-display);
      font-style: italic; font-size: 22px; line-height: 1.4;
      color: var(--ink-2); max-width: 540px;
    }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ── DISPATCH RAIL ── */
    .dispatch-rail-section {
      padding: 64px 0 0;
      background: var(--night);
      border-top: 1px solid var(--rule);
    }
    .dispatch-rail-header {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 48px 24px;
      max-width: 1320px; margin: 0 auto;
      flex-wrap: wrap; gap: 16px;
    }
    .dispatch-rail-scroll {
      display: flex;
      gap: 0;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 0 48px 48px;
      scrollbar-width: none;
    }
    .dispatch-rail-scroll::-webkit-scrollbar { display: none; }
    .dispatch-card {
      flex: 0 0 280px;
      scroll-snap-align: start;
      cursor: pointer;
      border-right: 1px solid rgba(245,242,234,0.1);
      display: flex;
      flex-direction: column;
      transition: background 200ms;
      background: transparent;
      text-align: left;
    }
    .dispatch-card:first-child { border-left: 1px solid rgba(245,242,234,0.1); }
    .dispatch-card:hover { background: rgba(245,242,234,0.04); }
    .dispatch-card-img {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--night-2);
      position: relative;
      flex-shrink: 0;
    }
    .dispatch-card-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 400ms var(--ease);
    }
    .dispatch-card:hover .dispatch-card-img img { transform: scale(1.04); }
    .dispatch-card-img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--ff-display); font-style: italic;
      font-size: 56px; color: rgba(245,242,234,0.1);
    }
    .dispatch-card-body {
      padding: 20px 24px 28px;
      display: flex; flex-direction: column; gap: 8px; flex: 1;
    }
    .dispatch-card-cat {
      font-family: var(--ff-mono); font-size: 9px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: #E8866A;
    }
    .dispatch-card-title {
      font-family: var(--ff-display); font-size: 18px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.15; color: #F5F2EA;
    }
    .dispatch-card-meta {
      font-family: var(--ff-mono); font-size: 10px;
      color: rgba(245,242,234,0.35);
      margin-top: auto; padding-top: 8px;
    }
    .dispatch-rail-fade-right {
      position: relative;
    }
    .dispatch-rail-fade-right::after {
      content: '';
      position: absolute; top: 0; right: 0; bottom: 0; width: 80px;
      background: linear-gradient(to right, transparent, var(--night));
      pointer-events: none;
    }

    /* ── FEATURED CARDS ── */
    .featured-section {
      padding: 72px 0;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
    }
    .featured-label {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 20px; border-bottom: 1px solid var(--rule); margin-bottom: 40px;
    }
    .featured-grid {
      display: grid;
      grid-template-columns: minmax(0,1.6fr) minmax(0,1fr);
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
      border-radius: 4px;
      overflow: hidden;
    }
    .feat-card {
      background: var(--bg);
      cursor: pointer;
      transition: background 200ms;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .feat-card:hover { background: var(--bg-warm); }
    .feat-card-img {
      width: 100%; aspect-ratio: 16/9; overflow: hidden;
      background: var(--bg-deep); flex-shrink: 0;
    }
    .feat-card-img img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 400ms var(--ease);
    }
    .feat-card:hover .feat-card-img img { transform: scale(1.03); }
    .feat-card-img-ph {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    .feat-card-content { padding: 32px 40px 40px; display: flex; flex-direction: column; flex: 1; }
    .feat-card-kicker {
      font-family: var(--ff-mono); font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 14px;
    }
    .feat-card-title {
      font-family: var(--ff-display); font-weight: 700;
      font-size: clamp(24px,3vw,42px); line-height: 1.05;
      letter-spacing: -0.02em; color: var(--ink); margin-bottom: 14px;
    }
    .feat-card-sub {
      font-family: var(--ff-display); font-style: italic;
      font-size: 16px; line-height: 1.5; color: var(--ink-3);
      margin-bottom: 20px;
    }
    .feat-card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
    .feat-card-meta {
      font-family: var(--ff-mono); font-size: 11px;
      color: var(--ink-4); display: flex; align-items: center; gap: 12px;
      margin-top: auto;
    }
    .secondary-cards {
      display: flex; flex-direction: column; gap: 1px;
    }
    .sec-card {
      background: var(--bg); cursor: pointer; transition: background 200ms;
      display: flex; flex-direction: column; flex: 1; overflow: hidden;
    }
    .sec-card:hover { background: var(--bg-warm); }
    .sec-card-img {
      width: 100%; aspect-ratio: 16/9; overflow: hidden;
      background: var(--bg-deep); flex-shrink: 0;
    }
    .sec-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 400ms var(--ease); }
    .sec-card:hover .sec-card-img img { transform: scale(1.03); }
    .sec-card-img-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    .sec-card-content { padding: 20px 28px 24px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .sec-card-kicker {
      font-family: var(--ff-mono); font-size: 9.5px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4);
    }
    .sec-card-title {
      font-family: var(--ff-display); font-size: 19px; font-weight: 700;
      letter-spacing: -0.015em; line-height: 1.1; color: var(--ink);
    }
    .sec-card-meta {
      font-family: var(--ff-mono); font-size: 10.5px; color: var(--ink-4);
    }
    .sec-card-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

    /* ── MANIFESTO ── */
    .manifesto {
      padding: 112px 0;
      background: var(--bg-warm);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .manifesto-grid {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1.5fr);
      gap: 80px; align-items: flex-start;
    }
    .manifesto-sticky {
      position: sticky; top: 120px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .manifesto-head {
      font-family: var(--ff-display); font-size: clamp(48px,6vw,88px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.92; color: var(--ink);
    }
    .manifesto-head em { font-style: italic; font-weight: 400; color: var(--accent); }
    .principles { margin-top: 48px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .principle {
      padding: 24px 0; border-top: 1px solid var(--rule);
    }
    .principle:nth-child(odd) { padding-right: 32px; }
    .principle:nth-child(even) { padding-left: 32px; border-left: 1px solid var(--rule); }
    .principle-head {
      font-family: var(--ff-display); font-size: 22px; font-weight: 700;
      letter-spacing: -0.01em; color: var(--ink); margin-bottom: 8px;
    }
    .principle-body {
      font-family: var(--ff-sans); font-size: 14.5px; line-height: 1.6;
      color: var(--ink-3);
    }

    /* ── ARCHIVE TABLE ── */
    .archive-section {
      padding: 80px 0 100px;
      background: var(--bg);
    }
    .archive-head {
      display: flex; align-items: flex-end; justify-content: space-between;
      padding-bottom: 20px; border-bottom: 1px solid var(--rule);
      flex-wrap: wrap; gap: 24px;
    }
    .archive-title {
      font-family: var(--ff-display); font-size: clamp(36px,4.5vw,64px);
      font-weight: 900; letter-spacing: -0.025em; line-height: 1; color: var(--ink);
    }
    .archive-title em { font-style: italic; font-weight: 400; color: var(--accent); }
    .table-header {
      display: grid;
      grid-template-columns: 52px minmax(0,1fr) 160px 120px 24px;
      gap: 24px; padding: 14px 16px;
      font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-4);
    }
    .table-row {
      display: grid;
      grid-template-columns: 52px minmax(0,1fr) 160px 120px 24px;
      gap: 24px; padding: 22px 16px;
      border-top: 1px solid var(--rule);
      cursor: pointer; transition: background 180ms;
      text-align: left; width: 100%;
    }
    .table-row:hover { background: var(--bg-warm); }
    .table-row:hover .row-arrow { transform: translateX(4px); color: var(--accent); }
    .row-num {
      font-family: var(--ff-display); font-style: italic; font-size: 28px;
      line-height: 1; color: var(--ink); align-self: center;
    }
    .row-title-block { min-width: 0; align-self: center; }
    .row-kicker {
      font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 5px;
    }
    .row-title {
      font-family: var(--ff-display); font-size: 21px; font-weight: 700;
      letter-spacing: -0.01em; line-height: 1.1; color: var(--ink);
    }
    .row-sub {
      font-family: var(--ff-sans); font-style: italic; font-size: 13px;
      color: var(--ink-4); margin-top: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .row-author {
      font-family: var(--ff-sans); font-size: 13px; color: var(--ink-2);
      align-self: center;
    }
    .row-date {
      font-family: var(--ff-mono); font-size: 11px; color: var(--ink-4);
      align-self: center;
    }
    .row-arrow {
      font-family: var(--ff-mono); font-size: 13px; color: var(--ink-4);
      align-self: center; transition: transform 200ms, color 200ms;
    }

    /* ── PITCH CTA ── */
    .pitch-section {
      background: var(--night);
      padding: 96px 0;
      position: relative;
      overflow: hidden;
    }
    .pitch-section::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 100% at 100% 0%, rgba(193,68,14,0.12), transparent 55%);
      pointer-events: none;
    }
    .pitch-inner {
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 80px; align-items: center;
    }
    .pitch-head {
      font-family: var(--ff-display);
      font-size: clamp(44px,5.5vw,80px);
      font-weight: 900; letter-spacing: -0.03em; line-height: 0.92;
      color: #F5F2EA;
    }
    .pitch-head em { font-style: italic; font-weight: 400; color: #E8866A; }
    .pitch-right { display: flex; flex-direction: column; gap: 32px; }
    .pitch-label {
      font-family: var(--ff-mono); font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: rgba(245,242,234,0.4);
    }
    .pitch-body {
      font-family: var(--ff-display); font-style: italic;
      font-size: 20px; line-height: 1.45; color: rgba(245,242,234,0.75);
    }
    .pitch-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    .pitch-spec {
      padding: 20px 0; border-top: 1px solid rgba(245,242,234,0.1);
    }
    .pitch-spec:nth-child(odd) { padding-right: 24px; }
    .pitch-spec:nth-child(even) { padding-left: 24px; border-left: 1px solid rgba(245,242,234,0.1); }
    .pitch-spec-head {
      font-family: var(--ff-mono); font-size: 9.5px; letter-spacing: 0.14em;
      text-transform: uppercase; color: rgba(245,242,234,0.4); margin-bottom: 4px;
    }
    .pitch-spec-val {
      font-family: var(--ff-sans); font-size: 14px; color: rgba(245,242,234,0.85);
    }
    .btn-light {
      background: #F5F2EA; color: var(--night);
      display: inline-flex; align-items: center; gap: 9px;
      padding: 12px 22px; font-family: var(--ff-sans);
      font-size: 13.5px; font-weight: 500; border-radius: 6px;
      transition: background 160ms, color 160ms;
    }
    .btn-light:hover { background: var(--accent); color: #fff; }

    /* ── NEWSLETTER ── */
    .newsletter {
      padding: 88px 0; background: var(--bg-deep);
      border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    }
    .nl-inner {

<body>
<div id="root">

    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">

      </div>
      <span style="font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-0.025em;color:var(--ink)">Framing Vote</span>
      <span style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-4)">Loading</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const SPACE='upaglixkbf42',TOKEN='H3fmoxO4StTBS-lRp_ULYaywbv3uM3C6WTG8o1M_PbU';
const BASE=`https://cdn.contentful.com/spaces/${SPACE}/environments/master`;
async function cfFetch(p){const r=await fetch(`${BASE}${p}&access_token=${TOKEN}`);if(!r.ok)throw new Error(r.status);return r.json();}
async function getEntries(ct,extra=''){return cfFetch(`/entries?content_type=${ct}${extra}`);}

function rt(doc, assets){
  if(!doc||!doc.content)return'';
  const assetPool = assets || window.__fvAssets || [];
  const n=node=>{
    if(node.nodeType==='text'){let t=node.value;(node.marks||[]).forEach(m=>{if(m.type==='bold')t=`<strong>${t}</strong>`;if(m.type==='italic')t=`<em>${t}</em>`;if(m.type==='code')t=`<code>${t}</code>`;});return t;}
    const i=(node.content||[]).map(n).join('');
    switch(node.nodeType){
      case'paragraph':return`<p>${i}</p>`;case'heading-1':return`<h1>${i}</h1>`;case'heading-2':return`<h2>${i}</h2>`;
      case'heading-3':return`<h3>${i}</h3>`;case'unordered-list':return`<ul>${i}</ul>`;case'ordered-list':return`<ol>${i}</ol>`;
      case'list-item':return`<li>${i}</li>`;case'blockquote':return`<blockquote>${i}</blockquote>`;case'hr':return`<hr/>`;
case'hyperlink':return`<a href="${node.data?.uri}" target="_blank" rel="noopener">${i}</a>`;
case 'embedded-asset-block': {
  const target = node.data?.target;
  const file = target?.fields?.file;
  const id = target?.sys?.id;
  const allAssets = assetPool;
  const linked = allAssets.find(x => x.sys?.id === id);
  const finalFile = file || linked?.fields?.file;
  if (!finalFile?.url) return `<div style="background:#f8d7da;border:1px solid #f5c2c7;padding:10px 14px;margin:16px 0;font-family:monospace;font-size:12px;border-radius:4px">asset id:${id} — NOT resolved (pool:${allAssets.length})</div>`;
  const src = finalFile.url.startsWith('//') ? 'https:' + finalFile.url : finalFile.url.startsWith('http') ? finalFile.url : 'https:' + finalFile.url;
  const mime = finalFile.contentType || '';
  if (mime.startsWith('video/')) {
    return `<video controls playsinline style="width:100%;margin:24px 0;border-radius:6px"><source src="${src}" type="${mime}"></video>`;
  }
  if (mime.startsWith('image/')) {
    return `<img src="${src}" style="width:100%;margin:24px 0;border-radius:6px"/>`;
  }
  return `<div style="background:#fff3cd;border:1px solid #ffc107;padding:10px 14px;margin:16px 0;font-family:monospace;font-size:12px;border-radius:4px">asset found, unhandled mime: "${mime}"</div>`;
}
      default: return i;
    }
  };
return doc.content.map(node => n(node)).join('');
}
function fmtDate(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'short',year:'numeric'});}
function fmtDateLong(s){if(!s)return'';return new Date(s).toLocaleDateString('en-US',{day:'numeric',month:'long',year:'numeric'});}

/* ── ASSET HELPERS ──
   Resolves a Contentful asset reference using the includes.Asset array.
   Field name: `portfolio` (single asset, used as cover/profile image everywhere)
*/
function resolveAsset(ref, assets){
  if(!ref) return null;
  if(ref?.fields?.file?.url) return ref;
  const id = ref?.sys?.id;
  if(id && assets) return assets.find(x => x.sys?.id === id) || null;
  return null;
}
function assetUrl(ref, assets, w=1200){
  const a = resolveAsset(ref, assets);
  const url = a?.fields?.file?.url;
  if(!url) return null;
  const base = url.startsWith("//") ? url : "//" + url.replace(/^https?:\/\//, "");
  return "https:" + base + "?w=" + w + "&fm=jpg&fl=progressive&q=80";
}
function assetAlt(ref, assets){
  const a = resolveAsset(ref, assets);
  return a?.fields?.description || a?.fields?.title || "";
}

/* ── CATEGORY HELPERS ── */
function getCategories(items){
  const cats=new Set();
  (items||[]).forEach(it=>{
    const c=it.category||it.categories;
    if(Array.isArray(c))c.forEach(x=>x&&cats.add(x));
    else if(c)cats.add(c);
  });
  return Array.from(cats).sort();
}
function matchesCategory(item, filter){
  if(!filter||filter==='All')return true;
  const c=item.category||item.categories;
  if(Array.isArray(c))return c.includes(filter);
  return c===filter;
}

/* ── PHOTO COMPONENT ── resolves `portfolio` field */
function Photo({item, assets, w=1200, style={}, className='', alt=''}){
  const src=assetUrl(item?.profile, assets, w);
  const altText=assetAlt(item?.profile, assets)||alt||item?.title||'';
  if(!src)return null;
  return <img src={src} alt={altText} style={style} className={className}/>;
}

/* ── CHIP COMPONENTS ── */
function CategoryChip({cat, onClick, active=false, dark=false}){
  if(!cat)return null;
  const darkStyle=dark?{color:'#E8866A',background:'rgba(232,134,106,0.12)',cursor:onClick?'pointer':'default'}:{};
  return(
    <span
      className={`chip${onClick?' chip-btn':''}${active?' active':''}`}
      style={darkStyle}
      onClick={onClick?()=>onClick(cat):undefined}
    >{cat}</span>
  );
}
function CategoryChips({item, onClick, dark=false}){
  const cats=item?.category||item?.categories;
  if(!cats)return null;
  const arr=Array.isArray(cats)?cats:[cats];
  if(!arr.length)return null;
  return(
    <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
      {arr.map(c=><CategoryChip key={c} cat={c} onClick={onClick} dark={dark}/>)}
    </div>
  );
}

/* ── FILTER BAR ── */
function FilterBar({items, activeFilter, setFilter, dark=false}){
  const cats=['All',...getCategories(items)];
  if(cats.length<=1)return null;
  return(
    <div className="filter-bar" style={dark?{borderColor:'rgba(245,242,234,0.12)'}:{}}>
      <span className="filter-label" style={dark?{color:'rgba(245,242,234,0.3)'}:{}}>Filter by region</span>
      {cats.map(c=>(
        <button
          key={c}
          className={`filter-pill${activeFilter===c?' active':''}`}
          style={dark?{
            borderColor: activeFilter===c ? 'rgba(245,242,234,0.6)' : 'rgba(245,242,234,0.15)',
            color: activeFilter===c ? 'var(--night)' : 'rgba(245,242,234,0.5)',
            background: activeFilter===c ? '#F5F2EA' : 'transparent'
          }:{}}
          onClick={()=>setFilter(c)}
        >{c}</button>
      ))}
    </div>
  );
}

function Mark({size=28}){
  return(
    <span style={{display:'inline-block',width:size,height:size,background:'var(--accent)',borderRadius:Math.round(size*0.15),flexShrink:0}}>
      <svg width={size} height={size} viewBox="0 0 28 28">
        <path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    </span>
  );
}

function ReadingProgress(){
  const[p,setP]=useState(0);
  useEffect(()=>{const f=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;setP(m>0?Math.min(1,h.scrollTop/m):0);};window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  return<div id="progress" style={{transform:`scaleX(${p})`}}/>;
}

function Header({route,setRoute}){
  const links=[['home','Front'],['archive','Archive'],['news','Dispatches'],['about','About'],['submit','Pitch us']];
  const[scrolled,setScrolled]=useState(false);
  useEffect(()=>{const f=()=>setScrolled(window.scrollY>8);window.addEventListener('scroll',f);f();return()=>window.removeEventListener('scroll',f);},[]);
  return(
    <header className={scrolled?'scrolled':''}>
      <div className="header-inner">
        <button onClick={()=>setRoute('home')} className="wordmark">
          <span className="wordmark-mark">
            <svg width="14" height="14" viewBox="0 0 28 28"><path d="M7.5 14.5L11.5 18.5L20.5 8.5" stroke="#F5F2EA" strokeWidth="2.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </span>
          Framing Vote
        </button>
        <nav>
          {links.map(([k,label])=>(

          Subscribe <span className="mono-arrow">→</span>
        </button>
      </div>

}

/* ── HERO ── */

/* ── DISPATCH RAIL ── horizontal scroll, photo + title cards */
function DispatchRail({news,assets,setRoute,setCurrentNews}){
  const[activeFilter,setActiveFilter]=useState('All');
  if(!news||news.length===0)return null;
  const filtered=activeFilter==='All'?news:news.filter(n=>matchesCategory(n,activeFilter));

  return(
    <section className="dispatch-rail-section">

          <div className="label" style={{color:'rgba(245,242,234,0.4)',marginBottom:8}}>Field dispatches</div>

            Notes from the field.

          All dispatches <span className="mono-arrow">→</span>
        </button>
      </div>

      {/* Filter bar inside rail */}
      <div style={{maxWidth:1320,margin:'0 auto',padding:'0 48px'}}>
        <FilterBar items={news} activeFilter={activeFilter} setFilter={setActiveFilter} dark={true}/>
      </div>

      <div className="dispatch-rail-fade-right">
        <div className="dispatch-rail-scroll" style={{paddingTop:24}}>
          {filtered.map(n=>{
            const src=assetUrl(n.profile,assets,560);
            return(
              <button key={n.id} className="dispatch-card" onClick={()=>{setCurrentNews(n);setRoute('newsArticle');}}>
                <div className="dispatch-card-img">
                  {src
                    ?<img src={src} alt={assetAlt(n.profile,assets)||n.title||''}/>

                      <span style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:40,color:'rgba(245,242,234,0.08)'}}>∅</span>
                    </div>
                  }
                </div>
                <div className="dispatch-card-body">
                  {(n.category||n.categories)&&(
                    <div className="dispatch-card-cat">
                      {Array.isArray(n.category||n.categories)
                        ?(n.category||n.categories).join(' · ')
                        :(n.category||n.categories)}
                    </div>

                  {src&&(
                    <div style={{width:'100%',aspectRatio:'16/9',overflow:'hidden',background:'var(--bg-deep)',flexShrink:0}}>
                      <img src={src} alt={assetAlt(it.profile,assets)||it.title||''} style={{width:'100%',height:'100%',objectFit:'cover',display:'block',transition:'transform 400ms var(--ease)'}}/>
                    </div>
                  )}
                  <div style={{padding:28,display:'flex',flexDirection:'column',gap:10,flex:1}}>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                      {(it.category||it.categories)&&<CategoryChips item={it}/>}
                    </div>
                    <div style={{fontFamily:'var(--ff-display)',fontSize:22,fontWeight:700,letterSpacing:'-0.01em',lineHeight:1.1,color:'var(--ink)'}}>{it.title}</div>
                    {it.summary&&<p style={{fontFamily:'var(--ff-sans)',fontSize:14,lineHeight:1.55,color:'var(--ink-3)',margin:0}}>{it.summary}</p>}
                    <div style={{fontFamily:'var(--ff-mono)',fontSize:10.5,color:'var(--ink-4)',marginTop:'auto',display:'flex',justifyContent:'space-between'}}>
                      <span>{it.author||about?.editorName}</span>
                      <span>{it.publishDate?fmtDate(it.publishDate):''}</span>
                    </div>
                  </div>
                </button>
              );
            })}
            {filtered.length===0&&<div style={{gridColumn:'1/-1',padding:'48px',fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:20,color:'var(--ink-4)',textAlign:'center'}}>No dispatches for this region.</div>}
          </div>
        )}
      </div>
    </section>
  );
}

/* ── NEWS ARTICLE VIEW ── */
function NewsArticleView({item,about,assets,setRoute}){
  if(!item)return null;
  const html=rt(item.body, assets);
  const coverSrc=assetUrl(item.profile,assets,1400);
  return(
    <article className="article-wrap">
      <ReadingProgress/>
      <div style={{padding:'32px 0 0'}}>
        <div className="read">
          <button className="back-btn" onClick={()=>setRoute('news')}><span className="mono-arrow">←</span> All dispatches</button>
        </div>
      </div>
      <header className="article-header">
        <div className="read">
          {(item.category||item.categories)&&(
            <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:12}}>
              <CategoryChips item={item}/>

          )}

          {item.summary&&<p className="article-sub">{item.summary}</p>}
          <div className="article-byline">
            <div className="byline-avatar">{(item.author||about?.editorName||'E')[0]}</div>
            <div>
              <div className="byline-name">{item.author||about?.editorName}</div>
              {item.publishDate&&<div className="byline-detail">{fmtDateLong(item.publishDate)}</div>}

        </div>
      </header>
      {coverSrc&&(
        <div style={{padding:'0 0 48px'}}>
          <div className="wrap">
            <div style={{width:'100%',aspectRatio:'16/7',borderRadius:4,overflow:'hidden',background:'var(--bg-deep)',minHeight:200}}>
              <img src={coverSrc} alt={assetAlt(item.profile,assets)||item.title} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>

      <div style={{borderTop:'1px solid var(--rule)',padding:'32px 0'}}>

        </div>
      </div>
    </article>
  );
}

/* ── ABOUT VIEW ── */
function AboutView({about,assets,setRoute}){
  if(!about)return<div style={{padding:'80px 32px',textAlign:'center',fontFamily:'var(--ff-sans)',color:'var(--ink-3)'}}>Loading…</div>;
  const bioHtml=about.editorBio?.nodeType?rt(about.editorBio,assets):`<p>${about.editorBio||''}</p>`;
  const descHtml=about.journalDescription?.nodeType?rt(about.journalDescription,assets):`<p>${about.journalDescription||''}</p>`;
  const prinHtml=about.publishingPrinciples?.nodeType?rt(about.publishingPrinciples,assets):about.publishingPrinciples?`<p>${about.publishingPrinciples}</p>`:null;
  const portraitSrc=assetUrl(about.profile,assets,480);
  const team=(about.team||[]).map(t=>t.fields||t).filter(Boolean);
  const board=(about.advisoryBoard||[]).map(b=>b.fields||b).filter(Boolean);

  return(
    <section style={{animation:'fadein 200ms ease both'}}>
      <div style={{borderBottom:'1px solid var(--rule)',background:'var(--bg)'}}>
        <div className="wrap" style={{padding:'64px 48px 72px'}}>
          <div className="label label-accent" style={{marginBottom:32}}>The editor</div>
          <div style={{display:'grid',gridTemplateColumns:portraitSrc?'minmax(0,1fr) 340px':'1fr',gap:64,alignItems:'flex-start'}}>
            <div>
              <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(48px,6vw,96px)',fontWeight:900,letterSpacing:'-0.03em',lineHeight:0.92,color:'var(--ink)',margin:0}}>{about.editorName||'The editor'}</h1>
              {about.editorTitle&&<div style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:22,color:'var(--ink-3)',marginTop:14}}>{about.editorTitle}</div>}
              {about.editorEmail&&<a href={`mailto:${about.editorEmail}`} style={{display:'inline-flex',alignItems:'center',gap:8,marginTop:24,fontFamily:'var(--ff-mono)',fontSize:13,color:'var(--accent)'}}>{about.editorEmail}</a>}
              <div className="post-body about-bio dropcap" style={{marginTop:40,maxWidth:640}} dangerouslySetInnerHTML={{__html:bioHtml}}/>
              <div style={{display:'flex',gap:10,marginTop:32,flexWrap:'wrap'}}>
                <button className="btn" onClick={()=>setRoute('submit')}>Pitch an essay <span className="mono-arrow">→</span></button>
                <button className="btn btn-outline-ghost" onClick={()=>document.getElementById('fv-nl')?.scrollIntoView({behavior:'smooth'})}>Get the dispatch</button>
              </div>
            </div>
            {portraitSrc&&(
              <div style={{position:'sticky',top:100}}>
                <div style={{width:'100%',borderRadius:4,overflow:'hidden',background:'var(--bg-deep)'}}>
                  <img src={portraitSrc} alt={about.editorName||''} style={{width:'100%',height:'auto',maxHeight:'72vh',objectFit:'cover',objectPosition:'center top',display:'block'}}/>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>

      {descHtml&&(
        <div style={{background:'var(--bg-warm)',borderBottom:'1px solid var(--rule)'}}>
          <div className="wrap" style={{padding:'72px 48px'}}>
            <div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1.6fr)',gap:80,alignItems:'flex-start'}}>
              <div style={{position:'sticky',top:100}}>
                <Mark size={40}/>
                <div className="label label-accent" style={{marginTop:22,marginBottom:12}}>About the journal</div>
                <p style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:17,lineHeight:1.55,color:'var(--ink-3)',maxWidth:280,margin:0}}>A journal on how the vote is asked, counted, and contested.</p>
              </div>
              <div>
                <h2 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(36px,4.5vw,64px)',fontWeight:900,letterSpacing:'-0.03em',lineHeight:0.94,margin:'0 0 36px',color:'var(--ink)'}}>A journal on elections, <em style={{fontStyle:'italic',fontWeight:400,color:'var(--accent)'}}>written to last.</em></h2>
                <div className="post-body about-bio" dangerouslySetInnerHTML={{__html:descHtml}}/>
                {prinHtml&&<><h3 style={{fontFamily:'var(--ff-display)',fontSize:32,fontWeight:700,letterSpacing:'-0.02em',margin:'52px 0 8px',color:'var(--ink)'}}>Publishing principles</h3><div className="post-body about-bio" dangerouslySetInnerHTML={{__html:prinHtml}}/></>}
              </div>
            </div>
          </div>
        </div>
      )}

      {team.length>0&&(
        <div style={{background:'var(--bg)',borderBottom:'1px solid var(--rule)'}}>
          <div className="wrap" style={{padding:'72px 48px'}}>
            <div style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',paddingBottom:24,borderBottom:'1px solid var(--rule)',marginBottom:40,flexWrap:'wrap',gap:16}}>
              <div>
                <div className="label label-accent" style={{marginBottom:10}}>Editorial team</div>
                <h2 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(32px,4vw,56px)',fontWeight:900,letterSpacing:'-0.025em',lineHeight:1,margin:0,color:'var(--ink)'}}>{team.length} {team.length===1?'editor':'editors'}, one <em style={{fontStyle:'italic',fontWeight:400}}>mission.</em></h2>
              </div>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:1,background:'var(--rule)',border:'1px solid var(--rule)',borderRadius:4,overflow:'hidden'}}>
              {team.map((member,i)=>{
                const mPhoto=assetUrl(member.profile||member.profile,assets,320);
                return(
                  <div key={i} style={{background:'var(--bg)',padding:'32px'}}>
                    {mPhoto?<img src={mPhoto} alt={member.name||''} style={{width:64,height:64,borderRadius:'50%',objectFit:'cover',objectPosition:'top',marginBottom:16,display:'block'}}/>

                    <div style={{fontFamily:'var(--ff-display)',fontSize:22,fontWeight:700,letterSpacing:'-0.01em',color:'var(--ink)'}}>{member.name}</div>
                    {member.title&&<div style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:16,color:'var(--ink-3)',marginTop:4}}>{member.title}</div>}
                    {member.bio&&<p style={{fontFamily:'var(--ff-sans)',fontSize:14,lineHeight:1.55,color:'var(--ink-3)',margin:'12px 0 0'}}>{member.bio}</p>}
                    {member.email&&<a href={`mailto:${member.email}`} style={{display:'inline-block',marginTop:12,fontFamily:'var(--ff-mono)',fontSize:12,color:'var(--accent)'}}>{member.email}</a>}

            </div>

        </div>
      )}

      {board.length>0&&(
        <div style={{background:'var(--bg-warm)',borderBottom:'1px solid var(--rule)'}}>
          <div className="wrap" style={{padding:'72px 48px'}}>
            <div style={{paddingBottom:24,borderBottom:'1px solid var(--rule)',marginBottom:40}}>
              <div className="label label-accent" style={{marginBottom:10}}>Advisory board</div>
              <h2 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(28px,3.5vw,48px)',fontWeight:900,letterSpacing:'-0.025em',lineHeight:1,margin:0,color:'var(--ink)'}}>People who keep us <em style={{fontStyle:'italic',fontWeight:400}}>honest.</em></h2>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:0}}>
              {board.map((member,i)=>{

                  <div key={i} style={{padding:'24px 0',borderTop:'1px solid var(--rule)',paddingRight:24}}>
                    {mPhoto?<img src={mPhoto} alt={member.name||''} style={{width:48,height:48,borderRadius:'50%',objectFit:'cover',objectPosition:'top',marginBottom:12,display:'block'}}/>
                      :<div style={{width:48,height:48,borderRadius:'50%',background:'var(--bg-deep)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:20,color:'var(--ink)',marginBottom:12}}>{(member.name||'?')[0]}</div>}

                    {member.title&&<div style={{fontFamily:'var(--ff-sans)',fontSize:13,color:'var(--ink-3)',marginTop:3,lineHeight:1.4}}>{member.title}</div>}

      )}

      <div style={{background:'var(--bg)',borderBottom:'1px solid var(--rule)'}}>
        <div className="wrap" style={{padding:'64px 48px'}}>
          <div className="label" style={{marginBottom:24}}>Colophon</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:0}}>
            {[['Founded',about.foundingYear||'2026'],['Frequency','Quarterly + occasional recounts'],['Format','Free to read, online-first'],['Typeset','Playfair Display, DM Mono']].map(([k,v])=>(
              <div key={k} style={{paddingTop:18,paddingBottom:18,borderTop:'1px solid var(--rule)',paddingRight:24}}>
                <div className="label" style={{marginBottom:5}}>{k}</div>
                <div style={{fontFamily:'var(--ff-display)',fontSize:17,color:'var(--ink)'}}>{v}</div>
              </div>
            ))}
          </div>
        </div>

/* ── SUBMIT VIEW ── */
function SubmitView({about,setRoute}){
  const[name,setName]=useState('');
  const[email,setEmail]=useState('');
  const[pitch,setPitch]=useState('');
  const[sent,setSent]=useState(false);
  const iStyle={width:'100%',padding:'13px 16px',border:'1px solid var(--rule)',background:'var(--bg-warm)',fontFamily:'var(--ff-sans)',fontSize:15,color:'var(--ink)',borderRadius:6,outline:'none',transition:'border-color 140ms'};
  return(
    <section style={{padding:'56px 0 96px',animation:'fadein 200ms ease both'}}>
      <div className="wrap">
        <div style={{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1.6fr)',gap:80,alignItems:'flex-start'}}>
          <div style={{position:'sticky',top:120}}>
            <div className="label label-accent">Pitch an essay</div>
            <h1 style={{fontFamily:'var(--ff-display)',fontSize:'clamp(44px,6vw,96px)',fontWeight:900,letterSpacing:'-0.03em',lineHeight:0.92,color:'var(--ink)',margin:'16px 0 0'}}>We read every pitch.<br/><em style={{fontStyle:'italic',fontWeight:400,color:'var(--accent)'}}>We reply to all.</em></h1>
            <p style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:22,lineHeight:1.4,color:'var(--ink-3)',marginTop:20}}>Long-form essays, field reports, data analyses, and editorial arguments on elections and democratic institutions.</p>
            <div style={{marginTop:40,display:'grid',gridTemplateColumns:'1fr 1fr',gap:0}}>
              {[['Length','2,500–6,000 words.'],['Tone','First-person. Argument required.'],['Sources','Primary documents preferred.'],['Rights','First pub. You retain ownership.']].map(([h,b])=>(
                <div key={h} style={{paddingTop:18,borderTop:'1px solid var(--rule)',paddingBottom:18}}>
                  <div className="label" style={{marginBottom:5}}>{h}</div>
                  <p style={{fontFamily:'var(--ff-sans)',fontSize:13.5,lineHeight:1.5,color:'var(--ink-3)',margin:0}}>{b}</p>
                </div>
              ))}
            </div>
          </div>
          <div>
            {sent?(
              <div style={{padding:40,background:'var(--bg-warm)',border:'1px solid var(--rule)',borderRadius:6}}>
                <div style={{fontFamily:'var(--ff-display)',fontStyle:'italic',fontSize:40,color:'var(--accent)',marginBottom:10}}>Received.</div>
                <p style={{fontFamily:'var(--ff-sans)',fontSize:16,color:'var(--ink-3)',margin:0}}>We aim to reply within two weeks. Commissioned pieces are paid.</p>
              </div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div>
                  <div className="label" style={{marginBottom:8}}>Send a pitch</div>
                  <p style={{fontFamily:'var(--ff-sans)',fontSize:14,color:'var(--ink-3)',margin:0}}>200–300 words — your argument, your angle, why now. Or email directly to{' '}
                    {about?.editorEmail?<a href={`mailto:${about.editorEmail}`} style={{color:'var(--accent)',fontFamily:'var(--ff-mono)',fontSize:13}}>{about.editorEmail}</a>:<span style={{fontFamily:'var(--ff-mono)',fontSize:13,color:'var(--ink-4)'}}>email coming soon</span>}.
                  </p>
                </div>
                <input style={iStyle} placeholder="Your name" value={name} onChange={e=>setName(e.target.value)} onFocus={e=>e.target.style.borderColor='var(--ink)'} onBlur={e=>e.target.style.borderColor='var(--rule)'}/>
                <input style={iStyle} type="email" placeholder="your@email.com" value={email} onChange={e=>setEmail(e.target.value)} onFocus={e=>e.target.style.borderColor='var(--ink)'} onBlur={e=>e.target.style.borderColor='var(--rule)'}/>
                <textarea style={{...iStyle,minHeight:200,resize:'vertical',lineHeight:1.6}} placeholder="Your pitch — argument, angle, why now (200–300 words)" value={pitch} onChange={e=>setPitch(e.target.value)} onFocus={e=>e.target.style.borderColor='var(--ink)'} onBlur={e=>e.target.style.borderColor='var(--rule)'}/>
                <button className="btn" style={{alignSelf:'flex-start'}} onClick={()=>{if(name&&email&&pitch)setSent(true);}}>Send pitch <span className="mono-arrow">→</span></button>
                <p style={{fontFamily:'var(--ff-mono)',fontSize:10.5,color:'var(--ink-4)',margin:0}}>Commissioned pieces are paid. We reply within two weeks.</p>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── HOME ── */
function HomeView(props){
  const featured=props.articles&&props.articles.length>0?props.articles[0]:null;
  return(<>
    <Hero featured={featured} {...props}/>
    {props.news.length>0&&<DispatchRail {...props}/>}
    {props.articles.length>0&&<FeaturedGrid {...props}/>}
    <Manifesto/>
    {props.articles.length>0&&<Register {...props}/>}
    <PitchCTA {...props}/>
  </>);
}

/* ── APP ── */
function App(){
  const[route,setRoute]=useState('home');
  const[articles,setArticles]=useState([]);
  const[news,setNews]=useState([]);
  const[settings,setSettings]=useState(null);
  const[about,setAbout]=useState(null);
  const[assets,setAssets]=useState([]);
  const[currentArticle,setCurrentArticle]=useState(null);
  const[currentNews,setCurrentNews]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{window.scrollTo(0,0);},[route]);

  useEffect(()=>{
    async function load(){
      try{
        const[aR,sR,abR,nR]=await Promise.all([
          getEntries('articlePost','&order=-fields.publishDate&include=10'),
          getEntries('settings'),
          getEntries('about','&include=2'),
          getEntries('news','&order=-fields.publishDate&include=10'),
        ]);
        const seen=new Set();
        const allAssets=[
          ...(aR.includes?.Asset||[]),
          ...(abR.includes?.Asset||[]),
          ...(nR.includes?.Asset||[]),
        ].filter(a=>{if(seen.has(a.sys.id))return false;seen.add(a.sys.id);return true;});
        setAssets(allAssets);
        window.__fvAssets = allAssets;
        const mappedArticles=(aR.items||[]).map(i=>({id:i.sys.id,...i.fields}));
        const mappedNews=(nR.items||[]).map(i=>({id:i.sys.id,...i.fields}));
        // Debug: log first item fields so we can confirm field names + asset shape
        if(mappedArticles[0]) console.log('[FV] article[0] fields:', Object.keys(mappedArticles[0]), '| profile:', mappedArticles[0].profile);
        if(mappedNews[0]) console.log('[FV] news[0] fields:', Object.keys(mappedNews[0]), '| profile:', mappedNews[0].profile);
        console.log('[FV] total assets in includes:', allAssets.length, allAssets[0]);
        setArticles(mappedArticles);
        setNews(mappedNews);
        if(sR.items?.length)setSettings(sR.items[0].fields);
        if(abR.items?.length)setAbout(abR.items[0].fields);
      }catch(e){console.error('Contentful error:',e);}
      finally{setLoading(false);}
    }
    load();
  },[]);

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',background:'var(--bg)'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
        <Mark size={36}/>
        <span style={{fontFamily:'Playfair Display,serif',fontSize:22,fontWeight:700,letterSpacing:'-0.025em',color:'var(--ink)'}}>Framing Vote</span>
        <span style={{fontFamily:'DM Mono,monospace',fontSize:10,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--ink-4)'}}>Loading</span>
      </div>
    </div>
  );

  const props={articles,news,settings,about,assets,setRoute,setCurrentArticle,setCurrentNews};

  return(
    <div className="page">
      <Header route={route} setRoute={setRoute}/>
      <main style={{flex:1}}>
        {route==='home'        &&<HomeView {...props}/>}
        {route==='article'     &&<ArticleView article={currentArticle} {...props} articles={articles} setCurrentArticle={setCurrentArticle}/>}
        {route==='archive'     &&<ArchiveView {...props}/>}
        {route==='news'        &&<NewsView {...props}/>}
        {route==='newsArticle' &&<NewsArticleView item={currentNews} about={about} assets={assets} setRoute={setRoute}/>}
        {route==='about'       &&<AboutView about={about} assets={assets} setRoute={setRoute}/>}
        {route==='submit'      &&<SubmitView about={about} setRoute={setRoute}/>}
      </main>
      <Newsletter/>
      <Footer setRoute={setRoute} settings={settings} about={about}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
