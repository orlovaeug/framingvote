<div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px;font-size:12px;color:#888780;">
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#D85A30;"></span>Getting worse — 73%</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#1D9E75;"></span>Getting better — 8%</span>
  <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;border-radius:2px;background:#888780;"></span>Don't know — 19%</span>
</div>
<div style="position:relative;width:100%;height:240px;">
  <canvas id="chart3" role="img" aria-label="UK public sentiment January 2026: 73% think things are getting worse, 8% better, 19% don't know">73% worse, 8% better, 19% don't know.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('chart3'), {
  type: 'doughnut',
  data: {
    labels: ['Getting worse','Getting better',"Don't know"],
    datasets: [{
      data: [73, 8, 19],
      backgroundColor: ['#D85A30','#1D9E75','#888780'],
      borderWidth: 0,
      hoverOffset: 6
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    cutout: '65%',
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: ctx => ` ${ctx.parsed}%` } }
    }
  }
});
</script>
